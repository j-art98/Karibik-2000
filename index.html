// ===== touch.js =====
// ===================================================================================
//  touch.js – Handy-Steuerung im Gefecht
//  Linker Daumen: virtueller Stick (laufen; ganz nach vorn = sprinten; im Fahrzeug
//  Gas/Lenken). Rechte Bildhälfte wischen: umsehen/zielen. Knöpfe: Feuer (halten,
//  beim Halten wischen zielt mit), Zielen, Laden, Ducken, Springen/Bremse,
//  Einsteigen/Aussteigen, Platz, Karte, Sicht, Pause. Alles läuft über Input,
//  damit Spieler- und Fahrzeuglogik unverändert bleiben.
// ===================================================================================
'use strict';

const Touch = {
  root: null, el: {}, joy: null, look: null, fire: null, btn: new Map(), aimOn: false, overToggle: false, sprinting: false,
  JOY_R: 58,

  build(host) {
    this.clear();
    const r = document.createElement('div');
    r.className = 'tctl';
    const b = (id, label, x, y, d, cls = '') => `<button type="button" class="tb ${cls}" data-tb="${id}" style="--x:${x}px;--y:${y}px;--d:${d}px">${label}</button>`;
    r.innerHTML = `<div class="tzone"></div><div class="tjoy"><i></i></div>
      ${b('fire', 'Feuer', 62, 78, 96, 'fire')}${b('aim', 'Zielen', 160, 44, 60)}${b('reload', 'Laden', 172, 126, 54)}
      ${b('crouch', 'Ducken', 104, 168, 54)}${b('jump', 'Springen', 36, 188, 54)}
      ${b('use', 'Ein&shy;steigen', 172, 204, 62, 'use')}${b('seat', 'Platz', 104, 168, 54)}
      <div class="tb-top">${b('map', 'Karte', 0, 0, 0)}${b('view', 'Sicht', 0, 0, 0)}${b('pause', 'II', 0, 0, 0)}</div>`;
    host.appendChild(r);
    this.root = r;
    this.el = { joy: r.querySelector('.tjoy'), knob: r.querySelector('.tjoy i') };
    r.querySelectorAll('[data-tb]').forEach(e => { this.el[e.dataset.tb] = e; });
    const opt = { passive: false };
    r.addEventListener('touchstart', e => this.onStart(e), opt);
    r.addEventListener('touchmove', e => this.onMove(e), opt);
    r.addEventListener('touchend', e => this.onEnd(e), opt);
    r.addEventListener('touchcancel', e => this.onEnd(e), opt);
    // Maus-Ersatz (z. B. Test am PC im Handy-Modus)
    r.addEventListener('mousedown', e => { e.preventDefault(); this.onStart(this.fakeTouch(e)); });
    window.addEventListener('mousemove', this._mm = e => { if (this.mouseActive) this.onMove(this.fakeTouch(e)); });
    window.addEventListener('mouseup', this._mu = e => { if (this.mouseActive) { this.onEnd(this.fakeTouch(e)); this.mouseActive = false; } });
    this.resetJoy();
    this.layout();
  },
  fakeTouch(e) {
    if (e.type === 'mousedown') this.mouseActive = true;
    const t = { identifier: 'm', clientX: e.clientX, clientY: e.clientY, target: e.target };
    return { changedTouches: [t], preventDefault() { } };
  },
  clear() {
    if (this.root) this.root.remove();
    if (this._mm) { window.removeEventListener('mousemove', this._mm); window.removeEventListener('mouseup', this._mu); this._mm = this._mu = null; }
    this.root = null; this.el = {}; this.joy = null; this.look = null; this.fire = null; this.btn.clear();
    this.aimOn = false; this.overToggle = false; this.sprinting = false; this.mouseActive = false;
    Input.touchAxis = null;
    Input.mouse = [false, false, false];
    for (const k of ['Space', 'ShiftLeft']) Input.keys.delete(k);
  },
  safeInsets() {
    if (!this._probe) {
      const p = document.createElement('div');
      p.style.cssText = 'position:fixed;left:0;bottom:0;width:env(safe-area-inset-left,0px);height:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none';
      document.body.appendChild(p);
      this._probe = p;
    }
    const r = this._probe.getBoundingClientRect();
    return { l: r.width || 0, b: r.height || 0 };
  },
  joyHome() { const s = this.safeInsets(); return { x: Math.max(16, s.l) + 14 + this.JOY_R + 8, y: window.innerHeight - Math.max(10, s.b) - 18 - this.JOY_R - 8 }; },
  resetJoy() {
    const h = this.joyHome();
    this.joyCenter = h;
    if (this.el.joy) { this.el.joy.style.left = h.x + 'px'; this.el.joy.style.top = h.y + 'px'; this.el.knob.style.transform = ''; this.el.joy.classList.remove('sprint'); }
    Input.touchAxis = null;
    if (this.sprinting) { Input.keys.delete('ShiftLeft'); this.sprinting = false; }
  },
  layout() { if (!this.joy) this.resetJoy(); },

  // ------------------------------------------------------------ Ereignisse ----
  onStart(e) {
    e.preventDefault();
    for (const t of e.changedTouches) {
      const el = t.target && t.target.closest ? t.target.closest('[data-tb]') : null;
      if (el) { this.press(t, el); continue; }
      const w = window.innerWidth, h = window.innerHeight;
      if (!this.joy && t.clientX < w * 0.45 && t.clientY > h * 0.3) {
        const c = this.joyHome(), d = Math.hypot(t.clientX - c.x, t.clientY - c.y);
        // schwebender Stick: setzt sich unter den Daumen, wenn außerhalb des Kreises begonnen
        this.joyCenter = d > this.JOY_R * 1.1 ? { x: t.clientX, y: t.clientY } : c;
        this.el.joy.style.left = this.joyCenter.x + 'px'; this.el.joy.style.top = this.joyCenter.y + 'px';
        this.joy = { id: t.identifier };
        this.moveJoy(t);
      } else if (!this.look) {
        this.look = { id: t.identifier, x: t.clientX, y: t.clientY, t0: performance.now(), moved: 0 };
      }
    }
  },
  onMove(e) {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (this.joy && t.identifier === this.joy.id) this.moveJoy(t);
      else if (this.look && t.identifier === this.look.id) {
        const dx = t.clientX - this.look.x, dy = t.clientY - this.look.y;
        this.look.x = t.clientX; this.look.y = t.clientY; this.look.moved += Math.abs(dx) + Math.abs(dy);
        Input.addLook(dx, dy);
      } else if (this.fire && t.identifier === this.fire.id) {
        const dx = t.clientX - this.fire.x, dy = t.clientY - this.fire.y;
        this.fire.x = t.clientX; this.fire.y = t.clientY;
        Input.addLook(dx, dy);
      }
    }
  },
  onEnd(e) {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (this.joy && t.identifier === this.joy.id) { this.joy = null; this.resetJoy(); }
      else if (this.look && t.identifier === this.look.id) {
        if (this.look.moved < 12 && performance.now() - this.look.t0 < 300) Input.mousePressedArr[0] = true;   // Tippen (z. B. Zuschauer: nächster Kamerad)
        this.look = null;
      } else if (this.btn.has(t.identifier)) this.release(t.identifier);
    }
  },
  moveJoy(t) {
    const R = this.JOY_R, c = this.joyCenter;
    let dx = t.clientX - c.x, dy = t.clientY - c.y;
    const d = Math.hypot(dx, dy);
    if (d > R) { dx *= R / d; dy *= R / d; }
    this.el.knob.style.transform = `translate(${dx.toFixed(1)}px,${dy.toFixed(1)}px)`;
    let x = dx / R, y = -dy / R;
    const m = Math.hypot(x, y);
    if (m < 0.12) { x = 0; y = 0; }
    Input.touchAxis = { x, y };
    const sprint = y > 0.82 && m > 0.95;
    if (sprint !== this.sprinting) {
      this.sprinting = sprint;
      if (sprint) Input.keys.add('ShiftLeft'); else Input.keys.delete('ShiftLeft');
      this.el.joy.classList.toggle('sprint', sprint);
    }
  },
  press(t, el) {
    const id = el.dataset.tb;
    this.btn.set(t.identifier, el);
    el.classList.add('down');
    Audio2.click();
    switch (id) {
      case 'fire': Input.mouse[0] = true; this.fire = { id: t.identifier, x: t.clientX, y: t.clientY }; break;
      case 'aim': this.aimOn = !this.aimOn; Input.mouse[2] = this.aimOn; break;
      case 'jump': Input.pressedSet.add('Space'); Input.keys.add('Space'); break;
      case 'crouch': Input.pressedSet.add('KeyC'); break;
      case 'reload': Input.pressedSet.add('KeyR'); break;
      case 'use': Input.pressedSet.add('KeyE'); if (this.aimOn) { this.aimOn = false; Input.mouse[2] = false; } break;
      case 'seat': Input.pressedSet.add('KeyF'); break;
      case 'view': Input.pressedSet.add('KeyV'); break;
      case 'map': this.overToggle = !this.overToggle; break;
      case 'pause': Battle.pause(); break;
    }
  },
  release(tid) {
    const el = this.btn.get(tid);
    this.btn.delete(tid);
    if (!el) return;
    el.classList.remove('down');
    const id = el.dataset.tb;
    if (id === 'fire') { Input.mouse[0] = false; this.fire = null; }
    if (id === 'jump') Input.keys.delete('Space');
  },
  /** Knöpfe je nach Lage ein-/ausblenden und beschriften (jeden Frame). */
  update() {
    if (!this.root) return;
    const p = Battle.player, alive = p && p.alive && !Battle.over;
    const v = alive ? p.vehicle : null, seat = v ? v.seats[p.seat] : null;
    const show = (id, on) => { const e = this.el[id]; if (e && e.hidden === on) e.hidden = !on; };
    const onFoot = alive && !v, gunner = !!(seat && seat.gunner && v.weapon);
    show('fire', onFoot || gunner); show('aim', onFoot || gunner); show('reload', onFoot || gunner);
    show('crouch', onFoot); show('jump', onFoot || !!(seat && seat.driver));
    show('use', !!(v || (onFoot && Player.canEnter)));
    show('seat', !!v);
    show('view', alive); show('map', true); show('pause', !Battle.over);
    const lbl = (id, text) => { const e = this.el[id]; if (e && e.dataset.l !== text) { e.dataset.l = text; e.innerHTML = text; } };
    lbl('jump', seat && seat.driver ? 'Bremse' : 'Springen');
    lbl('use', v ? 'Aus&shy;steigen' : 'Ein&shy;steigen');
    this.el.aim.classList.toggle('on', this.aimOn);
    this.el.crouch.classList.toggle('on', !!(onFoot && p.crouch));
    this.el.map.classList.toggle('on', this.overToggle);
    this.el.view.classList.toggle('on', !!Player.fp);
    if (!alive || UI.modalOpen()) {
      if (this.fire) { Input.mouse[0] = false; }
      this.el.joy.style.opacity = '0.35';
    } else this.el.joy.style.opacity = '';
    if (this.aimOn && !(onFoot || gunner)) { this.aimOn = false; Input.mouse[2] = false; }
    else if (this.aimOn !== Input.mouse[2]) Input.mouse[2] = this.aimOn;
  },
};

// ===== main.js =====
// ===================================================================================
//  main.js – Spielsteuerung (Port von GameManager.cs / SceneTransition.cs):
//  Renderer, Laden, Hauptmenü, Moduswechsel Karte <-> Gefecht, Zeit, Speichern.
// ===================================================================================
'use strict';

const nextFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));

const Game = {
  mode: 'boot', state: null, map: null, renderer: null, last: 0, battleSetup: null, errorShown: false, fps: 60,
  SAVE_KEY: 'kk2000_save_v1', SET_KEY: 'kk2000_settings_v1',
  settings: { volume: 0.7, sensitivity: 1, renderScale: 1, shadows: true, invertY: false, controls: null },

  /** Touchscreen ohne feine Maus (Handy/Tablet)? */
  detectTouch() {
    try {
      const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      const fine = window.matchMedia && window.matchMedia('(any-pointer: fine)').matches;
      const tp = (navigator.maxTouchPoints || 0) > 0 || 'ontouchstart' in window;
      return !!(tp && (coarse || !fine));
    } catch (e) { return false; }
  },
  isTouch() { return this.settings.controls === 'touch'; },
  setControls(mode) {
    if (mode !== 'touch' && mode !== 'pc') return;
    this.settings.controls = mode;
    storageSet(this.SET_KEY, JSON.stringify(this.settings));
    document.body.classList.toggle('touch', mode === 'touch');
    if (mode === 'touch') Input.exitLock();
    if (this.mode === 'battle' && typeof BattleUI !== 'undefined') BattleUI.applyControls();
  },

  async boot(hot) {
    let saved = null;
    try { saved = JSON.parse(storageGet(this.SET_KEY) || 'null'); if (saved) Object.assign(this.settings, saved); } catch (e) { /* Standardwerte */ }
    if (this.settings.controls !== 'touch' && this.settings.controls !== 'pc') {
      const t = this.detectTouch();
      this.settings.controls = t ? 'touch' : 'pc';
      if (t && !saved) { this.settings.renderScale = 0.75; this.settings.shadows = false; }
    }
    this.touchDetected = this.detectTouch();
    document.body.classList.toggle('touch', this.isTouch());
    UI.init();
    if (typeof THREE === 'undefined') { UI.loadingError('Die 3D-Engine (three.js) konnte nicht geladen werden. Bitte die Seite neu laden.'); return; }
    let r;
    try { r = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' }); }
    catch (e) { UI.loadingError('WebGL ist in diesem Browser nicht verfügbar – das Spiel braucht 3D-Grafik.'); return; }
    r.outputEncoding = THREE.sRGBEncoding;
    r.shadowMap.enabled = !!this.settings.shadows;
    r.shadowMap.type = THREE.PCFSoftShadowMap;
    r.shadowMap.autoUpdate = false;
    this.renderer = r;
    document.getElementById('view').appendChild(r.domElement);
    r.domElement.setAttribute('aria-label', 'Spielansicht');
    Input.init(r.domElement);
    Audio2.init(this.settings.audio || this.legacyAudio());
    Music.init();
    AudioUI.init();
    window.addEventListener('resize', () => this.resize());
    window.addEventListener('pagehide', () => this.autosave());
    document.addEventListener('visibilitychange', () => { if (document.hidden) { this.autosave(); Audio2.suspend(); } else Audio2.resume(); });

    UI.setLoading(0.08, 'Vermesse die Insel …'); await nextFrame();
    this.map = new WorldMap(LAYOUT);
    this.map.generate();
    UI.setLoading(0.5, 'Baue die 3D-Landschaft …'); await nextFrame();
    this.state = newGame('Kommandant');
    World.build(this.map, this.state);
    Campaign.init(this.map, this.state);
    UI.setLoading(0.85, 'Bereite Shader vor …'); await nextFrame();
    this.resize();
    MapCam.follow = false; MapCam.distance = 470; MapCam.target = { x: this.map.MW * 0.5, z: this.map.MH * 0.45 };
    MapCam.update(0.016, null);
    try { r.compile(World.scene, World.camera); } catch (e) { /* optional */ }
    UI.setLoading(1, 'Bereit.'); await nextFrame();
    UI.hideLoading();
    this.last = performance.now();
    requestAnimationFrame(t => this.loop(t));
    if (hot && hot.save && this.loadFromString(hot.save)) { if (hot.battle) UI.toast('Gefecht nach Neuladen abgebrochen.'); }
    else this.showMainMenu();
    window.KK = { Game, World, Overworld, Campaign, UI, Econ, GS, Roster, MapCam, DB, Missions, Towns, Resolver, get Battle() { return typeof Battle !== 'undefined' ? Battle : null; }, get Player() { return typeof Player !== 'undefined' ? Player : null; }, get Fx() { return typeof Fx !== 'undefined' ? Fx : null; } };
  },

  resize() {
    const r = this.renderer;
    if (!r) return;
    const w = window.innerWidth, h = window.innerHeight;
    r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75) * clamp(this.settings.renderScale, 0.5, 1));
    r.setSize(w, h, false);
    r.domElement.style.width = w + 'px'; r.domElement.style.height = h + 'px';
    if (World.camera) { World.camera.aspect = w / h; World.camera.updateProjectionMatrix(); }
    if (typeof Battle !== 'undefined' && Battle.camera) { Battle.camera.aspect = w / h; Battle.camera.updateProjectionMatrix(); }
  },

  /** Alte Einstellung (eine Effekt-Lautstärke 0–1) in die neuen 30 Stufen übernehmen. */
  legacyAudio() {
    const v = Number(this.settings.volume);
    if (!Number.isFinite(v)) return null;
    return { lvl: { sfx: v <= 0 ? 0 : Math.round(30 + 20 * Math.log10(v) / 1.4) } };
  },
  saveAudio() {
    this.settings.audio = Audio2.config();
    storageSet(this.SET_KEY, JSON.stringify(this.settings));
  },

  setSetting(key, val) {
    this.settings[key] = val;
    storageSet(this.SET_KEY, JSON.stringify(this.settings));
    if (key === 'renderScale') this.resize();
    if (key === 'volume') Audio2.setVolume(val);
    if (key === 'shadows') {
      this.renderer.shadowMap.enabled = !!val;
      const upd = sc => sc && sc.traverse(o => { if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { m.needsUpdate = true; }); });
      upd(World.scene);
      if (typeof Battle !== 'undefined') upd(Battle.scene);
      this.renderer.shadowMap.needsUpdate = true;
    }
  },

  // ============================================================== Schleife ====
  loop(now) {
    requestAnimationFrame(t => this.loop(t));
    const dt = Math.min(0.05, Math.max(0, (now - this.last) / 1000));
    this.last = now;
    if (dt > 0) this.fps = lerp(this.fps, 1 / dt, 0.05);
    Input.beginFrame();
    try {
      if (this.mode === 'menu') {
        MapCam.yaw += dt * 0.035;
        MapCam.update(dt, null);
        World.update(dt, this.state, this.renderer);
        UI.update(dt);
        this.renderer.render(World.scene, World.camera);
      } else if (this.mode === 'map') {
        Overworld.update(dt);
        World.update(dt, this.state, this.renderer);
        UI.update(dt);
        this.renderer.render(World.scene, World.camera);
      } else if (this.mode === 'battle') {
        Battle.update(dt);
        if (Battle.scene) this.renderer.render(Battle.scene, Battle.camera);
      }
    } catch (e) {
      console.error(e);
      if (!this.errorShown) { this.errorShown = true; UI.toast('Interner Fehler: ' + (e && e.message ? e.message : e), 8000); }
    }
    Input.endFrame();
  },

  setMode(mode) {
    this.mode = mode;
    UI.setMode(mode);
    if (mode === 'menu' || mode === 'map' || mode === 'battle') Music.setContext(mode);
    const r = this.renderer;
    r.shadowMap.autoUpdate = mode === 'battle';
    r.shadowMap.needsUpdate = true;
    if (mode !== 'battle') Input.exitLock();
    document.body.style.cursor = '';
    r.domElement.style.cursor = mode === 'battle' ? 'none' : '';
  },

  // ============================================================== Zeit ====
  advanceTime(hours) {
    const s = this.state;
    s.worldHours += hours;
    while (GS.day(s) > s.lastProcessedDay) {
      s.lastProcessedDay++;
      Econ.processNewDay(s);
      this.autosave();
    }
  },

  // ============================================================== Kampagne ====
  showMainMenu() {
    this.setMode('menu');
    Overworld.stopMoving(); Overworld.resting = false; Overworld.encounter = null;
    MapCam.follow = false; MapCam.distance = 470; MapCam.target = { x: this.map.MW * 0.5, z: this.map.MH * 0.45 };
    UI.open({ kind: 'main', name: this.state && this.state.commanderName !== 'Kommandant' ? this.state.commanderName : '' });
  },

  newCampaign(name) {
    const s = newGame(name);
    s.player.pos = this.map.nearestPassable(s.player.pos);
    this.state = s;
    Campaign.init(this.map, s);
    Campaign.createInitialParties(s);
    Missions.refreshOffers(s, Econ.rng);
    this.resetWorldView();
    GS.log(s, `${s.commanderName} übernimmt das Kommando über die Kompanie.`);
    GS.log(s, Game.isTouch() ? 'Tipp: Tippe auf einen Ort, um dorthin zu marschieren. Zwei Finger zoomen und drehen die Karte.' : 'Tipp: Klicke auf einen Ort, um dorthin zu marschieren. H zeigt die Steuerung.');
    this.setMode('map');
    UI.closeModal();
    UI.open({ kind: 'briefing' });
    this.save();
  },

  /** Nach Neues Spiel / Laden: Karte, Marker, Kamera an den Spielstand anpassen. */
  resetWorldView() {
    const s = this.state;
    for (const t of s.towns) World.refreshTown(t);
    for (const [, mk] of World.partyMarkers) World.scene.remove(mk.group);
    World.partyMarkers.clear();
    UI.clearPartyLabels();
    UI.logLines = [];
    UI.minimapBase = null;
    Overworld.stopMoving(); Overworld.resting = false; Overworld.encounter = null;
    MapCam.follow = true; MapCam.distance = 190; MapCam.yaw = 0;
    MapCam.focus(s.player.pos);
    World.updatePlayer(s.player.pos, Overworld.playerMotorized(), false, 0.016);
    this.renderer.shadowMap.needsUpdate = true;
  },

  resolveImmediately(setup) {
    const rng = new RNG(setup.seed || 1);
    const r = Resolver.autoResolve(setup, rng);
    r.setupTitle = setup.title;
    Econ.generateLoot(setup, r, rng);
    Resolver.applyToCampaign(this.state, setup, r);
    this.save();
    return r;
  },
  /** Wird aufgerufen, wenn der Gefechtsbericht geschlossen wird. */
  afterReport() {
    const p = this.state.player;
    if (Roster.healthy(p.roster) === 0) UI.toast('Ohne Truppen bist du verwundbar – wirb in einer Stadt neue Soldaten an.', 5000);
  },

  // ============================================================== Gefecht ====
  wantsPointerLock() { return !this.isTouch() && this.mode === 'battle' && typeof Battle !== 'undefined' && Battle.wantsPointerLock(); },
  async startBattle(setup) {
    this.battleSetup = setup;
    UI.closeModal();
    Overworld.stopMoving(); Overworld.resting = false;
    this.save();
    UI.el.loading.hidden = false;
    UI.setLoading(0.2, 'Das Gefechtsfeld wird vorbereitet …');
    UI.el.loading.querySelector('.title-big').textContent = setup.title.toUpperCase();
    UI.el.loading.querySelector('.subtitle').textContent = `${BT_LABEL[setup.terrain] || ''}${setup.locationName ? ' · bei ' + setup.locationName : ''}`;
    this.mode = 'loading';
    await nextFrame();
    try {
      Battle.start(setup);
    } catch (e) {
      console.error(e);
      UI.hideLoading();
      UI.toast('Das 3D-Gefecht konnte nicht gestartet werden – es wird automatisch aufgelöst.', 6000);
      try { Battle.dispose(); } catch (e2) { /* egal */ }
      this.setMode('map');
      UI.open({ kind: 'report', result: this.resolveImmediately(setup), setupTitle: setup.title });
      return;
    }
    UI.setLoading(1, 'Bereit.');
    await nextFrame();
    UI.hideLoading();
    this.setMode('battle');
    this.last = performance.now();
  },
  finishBattle(result) {
    const setup = this.battleSetup;
    const rng = new RNG((setup.seed || 1) + 77);
    result.setupTitle = setup.title;
    Econ.generateLoot(setup, result, rng);
    Resolver.applyToCampaign(this.state, setup, result);
    Battle.dispose();
    this.battleSetup = null;
    this.setMode('map');
    this.renderer.shadowMap.needsUpdate = true;
    UI.open({ kind: 'report', result, setupTitle: setup.title });
    this.save();
  },

  // ============================================================== Speichern ====
  hasSave() { return !!storageGet(this.SAVE_KEY); },
  saveInfo() {
    try {
      const d = JSON.parse(storageGet(this.SAVE_KEY) || 'null');
      if (!d) return '';
      return `${d.name || ''} · ${d.date || ''}`;
    } catch (e) { return ''; }
  },
  save() {
    if (!this.state || this.mode === 'menu' || this.mode === 'boot') return false;
    try {
      const s = this.state;
      return storageSet(this.SAVE_KEY, JSON.stringify({ v: 1, name: s.commanderName, date: GS.dateString(s), real: Date.now(), state: s }));
    } catch (e) { return false; }
  },
  autosave() { if (this.mode === 'map' || this.mode === 'battle') this.save(); },
  load() { return this.loadFromString(storageGet(this.SAVE_KEY)); },
  loadFromString(str) {
    let d;
    try { d = JSON.parse(str || 'null'); } catch (e) { return false; }
    const s = d && (d.state || d);
    if (!s || !s.player || !Array.isArray(s.towns) || !Array.isArray(s.parties)) return false;
    // fehlende Felder (ältere Stände) ergänzen
    const def = GS.create();
    for (const k of Object.keys(def)) if (s[k] === undefined) s[k] = def[k];
    for (const k of Object.keys(def.player)) if (s.player[k] === undefined) s.player[k] = def.player[k];
    // neue Orte/Verstecke (Dschungel-Halbinsel) und Gebäude in älteren Ständen ergänzen
    for (const td of LAYOUT.towns) if (!s.towns.some(t => t.id === td.id)) s.towns.push(Towns.create(td, Econ.rng));
    for (const h of LAYOUT.hideouts) if (!s.hideouts.some(x => x.id === h.id)) s.hideouts.push({ id: h.id, name: h.name, faction: DB.PIRATES, pos: LAYOUT.toWorld(h.x, h.y), clearedUntilDay: 0 });
    for (const t of s.towns) Buildings.ensure(t);
    this.state = s;
    Campaign.init(this.map, s);
    this.resetWorldView();
    for (const line of s.log.slice(-4)) UI.logLines.push({ msg: line.replace(/^\[[^\]]*\]\s*/, ''), t: performance.now() });
    this.setMode('map');
    UI.closeModal();
    return true;
  },
};

// Hot-Reload-Unterstützung der Vorschau (optional)
if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
  try { window.claude.hot.snapshot(() => ({ save: Game.state && (Game.mode === 'map' || Game.mode === 'battle') ? JSON.stringify(Game.state) : null, battle: Game.mode === 'battle' })); } catch (e) { /* egal */ }
}
const kkStart = data => { Game.boot(data || {}); };
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(kkStart);
else kkStart((window.claude && window.claude.hot && window.claude.hot.data) || {});

</script>
