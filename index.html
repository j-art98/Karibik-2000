        if (!h || !GS.hideoutActive(h, day) || far > 560) { this.place(l, false); l.ax = -1e4; continue; }
        pos = h.pos; off = 9;
      }
      const gy = m.surfaceHeight(pos.x, pos.z);
      const vis = this.proj(pos.x, gy + off, pos.z, o);
      if (this.proj(pos.x, gy + 2, pos.z, a)) { l.ax = a.x; l.ay = a.y; } else { l.ax = -1e4; }
      this.place(l, vis, o.x, o.y);
    }
    // Armeen
    const seen = new Set();
    if (Game.mode === 'map') {
      for (const p of s.parties) {
        const mk = World.partyMarkers.get(p.id);
        if (!mk || !mk.visible) continue;
        seen.add(p.id);
        let l = this.partyLabels.get(p.id);
        if (!l) {
          const el = document.createElement('div');
          el.className = 'lbl party';
          el.style.borderLeftColor = rgbCss(DB.factionColor(p.faction));
          this.el.labels.appendChild(el);
          l = { el, visible: true, txt: '', ax: -1e4, ay: -1e4, faction: p.faction };
          this.partyLabels.set(p.id, l);
        }
        const txt = `${esc(p.name)} · <b>${Roster.healthy(p.roster)}</b>`;
        if (txt !== l.txt) { l.el.innerHTML = txt; l.txt = txt; }
        const pos = mk.group.position;
        const vis = far < 420 && this.proj(pos.x, pos.y + 3.3 * mk.group.scale.y, -pos.z, o);
        if (this.proj(pos.x, pos.y + 2, -pos.z, a)) { l.ax = a.x; l.ay = a.y; } else l.ax = -1e4;
        this.place(l, vis, o.x, o.y);
      }
      // Spieler
      if (!this.playerLabel) {
        const el = document.createElement('div');
        el.className = 'lbl party player';
        el.style.borderLeftColor = rgbCss(DB.factionColor(DB.PLAYER));
        this.el.labels.appendChild(el);
        this.playerLabel = { el, visible: true, txt: '' };
      }
      const pl = this.playerLabel, pp = World.playerMarker.group.position;
      const ptxt = `${esc(s.commanderName)} · <b>${Roster.healthy(s.player.roster) + 1}</b>`;
      if (ptxt !== pl.txt) { pl.el.innerHTML = ptxt; pl.txt = ptxt; }
      this.place(pl, far < 520 && this.proj(pp.x, pp.y + 3.6 * World.playerMarker.group.scale.y, -pp.z, o), o.x, o.y);
    } else if (this.playerLabel) this.place(this.playerLabel, false);
    for (const [id, l] of this.partyLabels) {
      if (seen.has(id)) continue;
      if (!GS.party(s, id)) { l.el.remove(); this.partyLabels.delete(id); } else { this.place(l, false); l.ax = -1e4; }
    }
  },
  clearPartyLabels() { for (const [, l] of this.partyLabels) l.el.remove(); this.partyLabels.clear(); },

  /** Was liegt unter dem Bildschirmpunkt? {kind:'town'|'hideout'|'party', id} oder null. */
  pickAt(x, y) {
    let best = null, bd = 1e9;
    const test = (pick, ax, ay, r) => { const d = Math.hypot(ax - x, ay - y); if (d < r && d < bd) { bd = d; best = pick; } };
    const rectTest = (pick, el) => {
      const r = el.getBoundingClientRect();
      if (x >= r.left - 3 && x <= r.right + 3 && y >= r.top - 3 && y <= r.bottom + 3) { const d = Math.abs(y - (r.top + r.bottom) / 2) * 0.5 + 2; if (d < bd) { bd = d; best = pick; } }
    };
    for (const l of this.labels) {
      if (l.ax > -1e3) test(l.pick, l.ax, l.ay, l.pick.kind === 'town' ? 34 : 24);
      if (l.visible) rectTest(l.pick, l.el);
    }
    for (const [id, l] of this.partyLabels) {
      const pick = { kind: 'party', id };
      if (l.ax > -1e3) test(pick, l.ax, l.ay, 22);
      if (l.visible) rectTest(pick, l.el);
    }
    return best;
  },

  updateHover() {
    const tip = this.el.hover;
    if (this.modal || this.pointerOverUI || Input.mouse[2] || Game.isTouch()) { tip.hidden = true; return; }
    const hit = this.pickAt(Input.mx, Input.my);
    if (!hit) { tip.hidden = true; document.body.style.cursor = ''; return; }
    document.body.style.cursor = 'pointer';
    const s = Game.state;
    let html = '';
    if (hit.kind === 'town') {
      const t = GS.town(s, hit.id);
      if (!t) return;
      const war = GS.isHostileToPlayer(s, t.owner);
      html = `<b>${esc(t.name)}</b> · ${TOWN_TYPE_LABEL[t.type]} · ${esc(DB.factionName(t.owner))}<br>` +
        (war ? `<span class="bad-text">Feindlich</span> · Verteidigung ≈ ${fmt(Towns.defenseStrength(t))} (du: ${fmt(Overworld.playerStrength())})`
          : `Wohlstand ${Math.round(t.prosperity)} · Befestigung ${t.fortificationLevel}/${ECO.maxFortification}${GS.isPlayerOwned(t) ? ` · Garnison ${Roster.total(t.garrison)}` : ''}`);
    } else if (hit.kind === 'hideout') {
      const h = GS.hideout(s, hit.id);
      if (!h) return;
      html = `<b>${esc(h.name)}</b> · Versteck der Bergpiraten<br>Klicken, um das Lager anzusteuern`;
    } else {
      const p = GS.party(s, hit.id);
      if (!p) return;
      const hostile = GS.areHostile(s, p.faction, DB.PLAYER), str = Campaign.strength(p), mine = Overworld.playerStrength();
      html = `<b>${esc(p.name)}</b> · ${esc(DB.factionName(p.faction))}<br>${Roster.healthy(p.roster)} Mann${p.vehicles.length ? ` · ${p.vehicles.length} Fahrzeug${p.vehicles.length > 1 ? 'e' : ''}` : ''}` +
        ` · Stärke ${fmt(str)} (du: ${fmt(mine)}) · ${hostile ? '<span class="bad-text">feindlich</span>' : '<span class="good-text">neutral</span>'}`;
    }
    tip.innerHTML = html;
    tip.hidden = false;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = Input.mx + 16, y = Input.my + 18;
    if (x + w > window.innerWidth - 8) x = Input.mx - w - 12;
    if (y + h > window.innerHeight - 8) y = Input.my - h - 12;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  },
};

// ---------------------------------------------------------------- HTML-Helfer ----
const H = {
  sheet({ title, meta = '', tabs = null, tab = null, body = '', footer = '', size = '', close = true }) {
    return `<div class="sheet ${size}${tabs ? ' tall' : ''}" role="dialog" aria-label="${esc(title)}">
      <header><h2>${title}</h2>${meta ? `<div class="meta">${meta}</div>` : ''}${close ? '<button type="button" class="x" data-act="close" aria-label="Schließen">✕</button>' : ''}</header>
      ${tabs ? `<nav class="tabs">${tabs.map(t => `<button type="button" class="tab${t.id === tab ? ' on' : ''}" data-act="tab" data-arg="${t.id}">${t.label}</button>`).join('')}</nav>` : ''}
      <div class="body">${body}</div>
      ${footer ? `<footer>${footer}</footer>` : ''}
    </div>`;
  },
  btn(label, act, arg = '', cls = '', disabled = false, extra = '') {
    return `<button type="button" class="btn ${cls}" data-act="${act}" data-arg="${esc(String(arg))}"${disabled ? ' disabled' : ''} ${extra}>${label}</button>`;
  },
  chip(label, cls = '') { return `<span class="chip ${cls}">${label}</span>`; },
  sw(c) { return `<span class="sw" style="background:${rgbCss(c)}"></span>`; },
  bar(frac, label) { return `<div class="strength"><i style="width:${(clamp01(frac) * 100).toFixed(1)}%"></i><span>${label}</span></div>`; },
  hbar(frac, color) { return `<span style="display:inline-block;width:90px;height:8px;background:#000;border:1px solid var(--line);vertical-align:middle"><i style="display:block;height:100%;width:${(clamp01(frac) * 100).toFixed(0)}%;background:${color || 'var(--good)'}"></i></span>`; },
  stars(n) { return '<span style="color:var(--brass)">' + '★'.repeat(n) + '</span><span class="muted">' + '☆'.repeat(Math.max(0, 3 - n)) + '</span>'; },
  roster(r, empty = '–') {
    if (!r || !r.stacks.length) return empty;
    return r.stacks.map(s => `${s.count}× ${esc(DB.unitName(s.unitId))}`).join(', ');
  },
  info(m) {
    const s = Game.state;
    const cr = `<span class="kv">Credits <b class="num">${fmt(s.player.credits)}</b></span>`;
    return `<div class="info">${cr}${m && m.msg ? ` &nbsp;·&nbsp; <span class="${m.msgOk ? 'msg' : 'bad-text'}">${esc(m.msg)}</span>` : ''}</div>`;
  },
  confirm(m) {
    const c = m.confirm;
    return `<div class="info"><span class="warn-text">${esc(c.text)}</span></div>${H.btn(c.label || 'Ja', 'confirmYes', '', 'danger')}${H.btn('Abbrechen', 'confirmNo')}`;
  },
};

// ===== ui_views.js =====
// ===================================================================================
//  ui_views.js – Tafeln der Kampagne (Port von TownUI.cs / OverworldUI.cs):
//  Stadtmenü, Begegnung, Gefechtsbericht, Armee, Städte, Aufträge, Händler,
//  Diplomatie, Söldner, Hilfe, Menü, Hauptmenü, Lagebesprechung.
// ===================================================================================
'use strict';

const S_ = () => Game.state;
const P_ = () => Game.state.player;

function closeFooter(m, extra = '', closeLabel = 'Schließen') {
  if (m.confirm) return H.confirm(m);
  return H.info(m) + extra + H.btn(closeLabel, 'close');
}

// ================================================================ Stadt ====
Object.assign(UI.views, {
  town(m) {
    const s = S_(), t = GS.town(s, m.townId);
    if (!t) return '';
    const hostile = GS.isHostileToPlayer(s, t.owner), own = GS.isPlayerOwned(t);
    const tabs = hostile ? [{ id: 'overview', label: 'Lage' }] : [
      { id: 'overview', label: 'Übersicht' }, { id: 'recruit', label: 'Rekrutieren' }, { id: 'market', label: 'Markt' },
      { id: 'gear', label: 'Waffen & Fahrzeuge' }, ...(own ? [{ id: 'garrison', label: 'Garnison' }] : []), { id: 'jobs', label: 'Aufträge' },
    ];
    if (!tabs.some(x => x.id === m.tab)) m.tab = 'overview';
    const meta = `${TOWN_TYPE_LABEL[t.type]} · ${H.sw(DB.factionColor(t.owner))}${esc(DB.factionName(t.owner))}`;
    let body = '';
    switch (m.tab) {
      case 'recruit': body = this.townRecruit(t); break;
      case 'market': body = this.townMarket(t); break;
      case 'gear': body = this.townGear(t); break;
      case 'garrison': body = this.townGarrison(t); break;
      case 'jobs': body = this.townJobs(t); break;
      default: body = hostile ? this.townHostile(t) : this.townOverview(t);
    }
    const footer = m.confirm ? H.confirm(m) : H.info(m) + (hostile ? '' : H.btn('Rasten (1 Tag)', 'townRest')) + H.btn(hostile ? 'Abziehen' : 'Stadt verlassen', 'close');
    return H.sheet({ title: esc(t.name), meta, tabs, tab: m.tab, body, footer });
  },
});

Object.assign(UI, {
  townOverview(t) {
    const s = S_(), p = P_(), own = GS.isPlayerOwned(t);
    Buildings.ensure(t);
    const goods = ids => ids.length ? ids.map(id => H.chip(esc(DB.goodName(id)))).join(' ') : '<span class="muted">–</span>';
    let h = `<p class="lead">${TOWN_TYPE_LABEL[t.type]} unter Kontrolle von <b>${esc(DB.factionName(t.owner))}</b>.
      ${own ? 'Der Ort gehört deiner Kompanie: Er zahlt dir täglich Abgaben, braucht aber eine Garnison. Gebaut wird nur mit Credits.' : t.owner === DB.TRADERS ? 'Ein neutraler Handelsposten der Gilde.' : 'Du bist hier willkommen, solange du keinen Streit mit den Herren der Stadt suchst.'}</p>
      <div class="split"><div>
        <div class="section-h">Zusammenfassung</div>${this.townSummary(t)}
      </div><div>
        <div class="section-h">Handel</div>
        <div class="kv" style="margin-bottom:6px">Erzeugt: ${goods(t.produces)}</div>
        <div class="kv">Gefragt: ${goods(t.consumes)}</div>
      </div></div>`;
    h += this.townBuildings(t, own);
    h += '<div class="section-h">Aktionen</div><div class="row">';
    const prisoners = Roster.total(p.prisoners);
    if (t.type !== 'Village') h += H.btn(`Gefangene übergeben${prisoners ? ` (+${fmt(Econ.prisonersValue(p))} Cr)` : ''}`, 'ransom', '', '', prisoners === 0);
    if (!own) h += H.btn('Stadt angreifen …', 'attackTown', '', 'danger');
    h += '</div>';
    const offers = Missions.offersAt(s, t.id).length, deliver = Missions.active(s).filter(mm => Missions.canDeliver(s, mm, t)).length;
    if (offers || deliver) h += `<p class="lead" style="margin-top:12px">Am Anschlagbrett: ${offers} Auftrag${offers === 1 ? '' : 'e'}${deliver ? ` · <span class="good-text">${deliver} Lieferung bereit</span>` : ''} – siehe Reiter „Aufträge“.</p>`;
    return h;
  },
  townHostile(t) {
    const mine = Overworld.playerStrength(), def = Towns.defenseStrength(t);
    return `<p class="lead">Die Tore von <b>${esc(t.name)}</b> sind verschlossen. ${esc(DB.factionName(t.owner))} befindet sich im Krieg mit dir –
      Handel und Rekrutierung sind unmöglich. Du kannst die Stadt stürmen: Gelingt der Angriff, gehört sie dir.</p>
      <div class="kv">Verteidiger: <b>${H.roster(Towns.defenders(t))}</b></div>
      <div class="kv">Befestigung Stufe <b>${t.fortificationLevel}</b> · Verteidigungsbonus ×${Towns.defenseMult(t).toFixed(2)}</div>
      ${H.bar(mine / Math.max(1, mine + def), `Deine Stärke ${fmt(mine)} : ${fmt(def)} Verteidigung`)}
      <div class="row">${H.btn('Sturmangriff (3D-Gefecht)', 'siegeFight', '', 'danger')}${H.btn('Automatisch auflösen', 'siegeAuto')}</div>
      <p class="lead" style="margin-top:12px">Tipp: Belagerungen sind schwer. Mehr Truppen, Veteranen, Fahrzeuge und Munition erhöhen deine Chancen.</p>
      ${this.townBuildings(t, false, 'Aufklärung: Gebäude')}`;
  },
  /** Zusammenfassung wie die Provinzübersicht in Total War: Einkommen, Wachstum, Verteidigung, Rekruten, Bau. */
  townSummary(t) {
    Buildings.ensure(t);
    const own = GS.isPlayerOwned(t), inc = Buildings.income(t), tgt = Buildings.growthTarget(t), pr = Math.round(t.prosperity);
    const trend = tgt > pr + 1 ? '<span class="good-text">▲ wächst</span>' : tgt < pr - 1 ? '<span class="bad-text">▼ schrumpft</span>' : '<span class="muted">● stabil</span>';
    const parts = [`Abgaben ${inc.tax}`];
    if (inc.hall) parts.push(`Verwaltung +${inc.hall}`);
    if (inc.market) parts.push(`Markt +${inc.market}`);
    if (inc.res) parts.push(`${esc(RES[t.buildings.res].name)} +${inc.res}`);
    const g = Roster.total(t.garrison), cap = Towns.garrisonCap(t), b = t.buildings.build;
    const maxTier = t.type === 'Village' ? Math.min(3, 2 + Buildings.tierBonus(t)) : 3;
    return `<div class="tsum">
      <div class="ts"><span class="ts-k">Einkommen</span><b class="${own ? 'good-text' : ''}">+${fmt(inc.total)} Cr/Tag</b><small>${own ? parts.join(' · ') : `geht an ${esc(DB.factionName(t.owner))}`}</small></div>
      <div class="ts"><span class="ts-k">Wachstum</span><b>${pr} → ${Math.round(clamp(tgt, 5, 100))}</b><small>${trend} ${H.hbar(t.prosperity / 100)}</small></div>
      <div class="ts"><span class="ts-k">Verteidigung</span><b>×${Towns.defenseMult(t).toFixed(2)}</b><small>Kraft ${fmt(Towns.defenseStrength(t))} · Befestigung ${ROMAN[t.fortificationLevel] || '–'}</small></div>
      <div class="ts"><span class="ts-k">Garnison</span><b>${g} / ${cap}</b><small>${own ? 'Plätze durch Kaserne und Befestigung' : 'Verteidiger und Miliz'}</small></div>
      <div class="ts"><span class="ts-k">Rekruten</span><b>${t.recruits.reduce((a, o) => a + o.available, 0)} bereit</b><small>${Buildings.recruitBonus(t) ? `Kaserne +${Buildings.recruitBonus(t)} je Typ · ` : ''}bis ${'★'.repeat(maxTier)}</small></div>
      <div class="ts"><span class="ts-k">Bau</span><b>${b ? esc(Buildings.buildLabel(t)) : '–'}</b><small>${b ? 'Fertig nach Ablauf der Tage' : own ? 'Keine Baustelle' : '—'}</small></div>
    </div>`;
  },
  /** Gebäude-Kacheln: Hauptgebäude, Ressource, Bauplätze (frei / gesperrt), darunter die Detailansicht. */
  townBuildings(t, own, title = 'Gebäude') {
    Buildings.ensure(t);
    const B = t.buildings, sel = this.modal && this.modal.bsel !== undefined ? this.modal.bsel : null, bd = B.build;
    let h = `<div class="section-h">${title}${own ? ' <span class="muted" style="letter-spacing:.06em;text-transform:none;font-weight:500">· Bauen und Ausbauen kostet nur Credits</span>' : ''}</div><div class="bgrid">`;
    B.slots.forEach((sl, i) => {
      const locked = Buildings.locked(t, i), busy = bd && bd.slot === i;
      const kind = i === 0 ? 'main' : i === 1 ? 'res' : sl ? 'free' : locked ? 'locked' : 'empty';
      const kl = i === 0 ? 'Hauptgebäude' : i === 1 ? 'Ressource' : sl ? 'Gebäude' : locked ? 'Gesperrt' : 'Bauplatz';
      let inner;
      if (sl) {
        const mx = Buildings.max(t, sl);
        inner = `${bIcon(Buildings.icon(t, sl))}<span class="bt-name">${esc(Buildings.name(t, sl))}</span>
          <span class="bt-tier" aria-label="Stufe ${sl.lvl} von ${mx}">${Array.from({ length: mx }, (_, k) => `<i class="${k < sl.lvl ? 'on' : ''}"></i>`).join('')}</span>`;
      } else if (locked) {
        inner = `${bIcon('lock')}<span class="bt-name">Stufe ${ROMAN[Buildings.OPEN[t.type].findIndex(n => n > i - 2)] || 'max'}</span><span class="bt-sub">${esc(BLD.hall.name[t.type])}</span>`;
      } else {
        inner = `${bIcon(busy ? BLD[bd.id].icon : 'plus')}<span class="bt-name">${busy ? esc(BLD[bd.id].name) : own ? 'Bauen' : 'Frei'}</span><span class="bt-sub">${busy ? '' : 'freier Platz'}</span>`;
      }
      let flag = '';
      if (own && sl && !bd) { const c = Buildings.check(Game.state, t, i); if (c.ok) flag = `<span class="bt-up" title="Ausbau möglich">▲</span>`; }
      if (busy) flag = `<span class="bt-up busy" title="Im Bau">${bIcon('hammer', 'bt-mini')}</span>`;
      const prog = busy ? `<span class="bt-busy" title="${esc(Buildings.buildLabel(t))}"><i style="width:${((1 - bd.days / bd.total) * 100).toFixed(0)}%"></i></span>` : '';
      h += `<button type="button" class="btile ${kind}${sel === i ? ' sel' : ''}${busy ? ' busy' : ''}" data-act="bsel" data-arg="${i}"><span class="bt-kind">${kl}</span>${inner}${flag}${prog}</button>`;
    });
    h += '</div>';
    h += `<div class="bdetail">${sel === null || sel === undefined ? `<span class="muted">${own ? 'Tippe auf eine Kachel, um ein Gebäude zu bauen oder auszubauen.' : 'Tippe auf eine Kachel für Details.'}</span>` : this.buildingDetail(t, sel, own)}</div>`;
    return h;
  },
  buildingDetail(t, i, own) {
    const B = t.buildings, sl = B.slots[i], s = Game.state, bd = B.build;
    if (Buildings.locked(t, i) && !sl) {
      const need = Buildings.OPEN[t.type].findIndex(n => n > i - 2);
      return `<div class="bd-h">${bIcon('lock', 'bd-ic')}<div><b>Gesperrter Bauplatz</b><div class="muted">Wird mit ${esc(BLD.hall.name[t.type])} Stufe ${ROMAN[need] || '–'} freigeschaltet.</div></div></div>`;
    }
    if (!sl) {
      if (bd && bd.slot === i) return `<div class="bd-h">${bIcon(BLD[bd.id].icon, 'bd-ic')}<div><b>${esc(BLD[bd.id].name)} im Bau</b><div class="muted">${esc(Buildings.buildLabel(t))}</div></div></div>`;
      let h = `<div class="bd-h">${bIcon('plus', 'bd-ic')}<div><b>Freier Bauplatz</b><div class="muted">${own ? 'Wähle ein Gebäude. Jede Art gibt es einmal pro Ort.' : 'Hier steht nichts.'}</div></div></div>`;
      if (!own) return h;
      h += '<div class="bopts">';
      for (const id of FREE_IDS) {
        const have = Buildings.level(t, id) > 0 || (bd && bd.id === id), c = Buildings.check(s, t, i, id), cost = BLD[id].cost[1], days = BLD[id].days[1];
        h += `<div class="bopt${have ? ' have' : ''}">${bIcon(BLD[id].icon, 'bo-ic')}<div class="bo-t"><b>${esc(BLD[id].name)}</b><span class="muted">${esc(Buildings.effect(t, id, 1))}</span></div>
          ${have ? '<span class="muted bo-c">vorhanden</span>' : H.btn(`Bauen · ${fmt(cost)} Cr · ${days} T`, 'bbuild', `${i}:${id}`, 'small good', !c.ok, `title="${esc(c.ok ? BLD[id].desc : c.msg)}"`)}</div>`;
      }
      return h + '</div>';
    }
    const mx = Buildings.max(t, sl), next = sl.lvl + 1, id = sl.id;
    let h = `<div class="bd-h">${bIcon(Buildings.icon(t, sl), 'bd-ic')}<div><b>${esc(Buildings.name(t, sl))}</b> <span class="muted">· ${esc(Buildings.label(t, sl))} · Stufe ${ROMAN[sl.lvl]} von ${ROMAN[mx]}</span>
      <div class="muted">${esc(Buildings.desc(t, id))}</div></div></div>
      <div class="bd-row"><span class="kv">Wirkung jetzt</span><b>${esc(Buildings.effect(t, id, sl.lvl))}</b></div>`;
    if (next <= mx) {
      const c = Buildings.check(s, t, i), cost = Buildings.cost(t, id, next), days = Buildings.days(t, id, next);
      h += `<div class="bd-row"><span class="kv">Stufe ${ROMAN[next]}</span><b>${esc(Buildings.effect(t, id, next))}</b></div>`;
      if (own) h += `<div class="row" style="margin-top:8px">${H.btn(`Ausbauen auf Stufe ${ROMAN[next]} · ${fmt(cost)} Cr · ${days} ${days === 1 ? 'Tag' : 'Tage'}`, 'bup', String(i), 'good', !c.ok)}${c.ok ? '' : `<span class="warn-text" style="font-size:13px">${esc(c.msg)}</span>`}</div>`;
    } else h += '<div class="bd-row"><span class="kv">Ausbau</span><b class="good-text">Höchste Stufe erreicht</b></div>';
    return h;
  },
  townRecruit(t) {
    const s = S_(), p = P_(), space = GS.maxPartySize(p) - Roster.total(p.roster);
    let h = `<p class="lead">Freiwillige und Söldner warten auf Anwerbung. Neue Rekruten erscheinen alle drei Tage.
      Platz in deiner Armee: <b>${space}</b> von ${GS.maxPartySize(p)} (mehr Ansehen erhöht das Limit).</p>`;
    if (!t.recruits.length) return h + '<p class="muted">Derzeit niemand verfügbar.</p>';
    h += '<div class="tablewrap"><table class="grid"><thead><tr><th>Einheit</th><th>Stufe</th><th class="r">Verfügbar</th><th class="r">Kosten</th><th class="r">Sold/Tag</th><th>Waffe</th><th></th></tr></thead><tbody>';
    for (const o of t.recruits) {
      const u = DB.unit(o.unitId), cost = Econ.recruitCost(t, o.unitId), dis = o.available <= 0 || space <= 0 || p.credits < cost;
      h += `<tr><td><b>${esc(u.displayName)}</b><br><span class="muted" style="font-size:12.5px">${esc(u.description)}</span></td><td>${H.stars(u.tier)}</td>
        <td class="r">${o.available}</td><td class="r">${fmt(cost)}</td><td class="r">${u.dailyWage}</td><td>${esc(DB.weaponName(u.primaryWeapon))}</td>
        <td class="r" style="white-space:nowrap">${H.btn('+1', 'recruit', o.unitId + ':1', 'small', dis)} ${H.btn('+5', 'recruit', o.unitId + ':5', 'small', dis)} ${H.btn('Alle', 'recruit', o.unitId + ':99', 'small', dis)}</td></tr>`;
    }
    return h + '</tbody></table></div>';
  },
  townMarket(t) {
    const p = P_();
    let h = `<p class="lead">Preise richten sich nach Vorrat und Nachfrage. Was hier erzeugt wird, ist billig; was gefragt ist, bringt gutes Geld.
      Deine Truppe verbraucht täglich <b>${Econ.rationsPerDay(p)}</b> Nahrung${Econ.activeVehicles(p) ? ` und <b>${Econ.activeVehicles(p)}</b> Treibstoff` : ''}.</p>`;
    h += '<div class="tablewrap"><table class="grid"><thead><tr><th>Ware</th><th class="r">Vorrat</th><th class="r">Kaufpreis</th><th></th><th class="r">Verkauf</th><th class="r">Dein Lager</th><th></th></tr></thead><tbody>';
    for (const g of DB.goods) {
      const mk = GS.market(t, g.id), stock = mk ? Math.floor(mk.stock) : 0, buy = Econ.buyPrice(t, g.id), sell = Econ.sellPrice(t, g.id), have = Inv.get(p, g.id);
      const tag = t.produces.includes(g.id) ? ' ' + H.chip('Erzeugnis', 'peace') : t.consumes.includes(g.id) ? ' ' + H.chip('Gefragt', 'war') : '';
      const cmp = buy < g.basePrice * 0.95 ? 'good-text' : buy > g.basePrice * 1.3 ? 'bad-text' : '';
      h += `<tr><td><b>${esc(g.displayName)}</b>${tag}</td><td class="r">${stock}</td><td class="r ${cmp}">${fmt(buy)}</td>
        <td style="white-space:nowrap">${H.btn('+1', 'buy', g.id + ':1', 'small', stock < 1 || p.credits < buy)} ${H.btn('+10', 'buy', g.id + ':10', 'small', stock < 1 || p.credits < buy)}</td>
        <td class="r">${fmt(sell)}</td><td class="r">${have}</td>
        <td style="white-space:nowrap">${H.btn('−1', 'sell', g.id + ':1', 'small', have < 1)} ${H.btn('−10', 'sell', g.id + ':10', 'small', have < 1)} ${H.btn('Alle', 'sell', g.id + ':9999', 'small', have < 1)}</td></tr>`;
    }
    return h + '</tbody></table></div>';
  },
  townGear(t) {
    const p = P_();
    let h = '<div class="section-h">Waffenhändler</div>';
    for (const id of Econ.weaponsForSale(t)) {
      const w = DB.weapon(id), price = Econ.weaponPrice(t, id), owned = GS.ownsWeapon(p, id);
      h += `<div class="card"><div class="grow"><h4>${esc(w.displayName)}</h4><p>${esc(w.description)}</p><p>${weaponStats(w)}</p></div>
        <div class="num" style="min-width:90px;text-align:right">${fmt(price)} Cr</div>${H.btn(owned ? 'Im Besitz' : 'Kaufen', 'buyWeapon', id, '', owned || p.credits < price)}</div>`;
    }
    if (p.ownedWeapons.length) {
      h += '<div class="section-h">Deine Waffenkammer (nicht ausgerüstet)</div>';
      for (const id of p.ownedWeapons) {
        const w = DB.weapon(id); if (!w) continue;
        h += `<div class="card"><div class="grow"><h4>${esc(w.displayName)}</h4><p>${weaponStats(w)}</p></div>${H.btn(`Verkaufen (+${fmt(Econ.weaponSellPrice(id))} Cr)`, 'sellWeapon', id)}</div>`;
      }
    }
    const vs = Econ.vehiclesForSale(t);
    h += '<div class="section-h">Fahrzeughändler</div>';
    if (!vs.length) h += '<p class="muted">Fahrzeuge gibt es nur in Städten und Festungen.</p>';
    for (const id of vs) {
      const v = DB.vehicle(id), price = Econ.vehiclePrice(t, id);
      h += `<div class="card"><div class="grow"><h4>${esc(v.displayName)}</h4><p>${esc(v.description)}</p>
        <p>Plätze ${v.seats} · Panzerung ${Math.round(v.armor * 100)}% · Struktur ${v.maxHealth} · ${v.mountedWeapon ? esc(DB.weaponName(v.mountedWeapon)) : 'unbewaffnet'} · Unterhalt ${v.dailyUpkeep} Cr/Tag</p></div>
        <div class="num" style="min-width:90px;text-align:right">${fmt(price)} Cr</div>${H.btn('Kaufen', 'buyVehicle', id, '', p.credits < price || p.vehicles.length >= 6)}</div>`;
    }
    if (p.vehicles.length) {
      h += '<div class="section-h">Dein Fuhrpark</div>';
      p.vehicles.forEach((v, i) => {
        const d = DB.vehicle(v.vehicleId), cost = Econ.repairCost(v, t), canRepair = t.type !== 'Village';
        h += `<div class="card"><div class="grow"><h4>${esc(d.displayName)}</h4><p>Struktur ${Math.round(v.health)} / ${d.maxHealth} ${H.hbar(VehicleState.frac(v), VehicleState.frac(v) < 0.4 ? 'var(--danger)' : '')}</p></div>
          ${H.btn(cost > 0 ? `Reparieren (${fmt(cost)} Cr)` : 'Unbeschädigt', 'repairVehicle', i, '', cost <= 0 || !canRepair || p.credits < cost)}
          ${H.btn(`Verkaufen (+${fmt(Econ.vehicleSellPrice(v))} Cr)`, 'sellVehicle', i)}</div>`;
      });
    }
    return h;
  },
  townGarrison(t) {
    const p = P_();
    const rows = (r, act, label) => r.stacks.length ? r.stacks.map(st => {
      const n = Roster.healthyOfStack(st);
      return `<tr><td>${esc(DB.unitName(st.unitId))}</td><td class="r">${n}${st.wounded ? ` <span class="muted">(+${st.wounded}✚)</span>` : ''}</td>
        <td class="r" style="white-space:nowrap">${H.btn(label + ' 1', act, st.unitId + ':1', 'small', n < 1)} ${H.btn(label + ' 5', act, st.unitId + ':5', 'small', n < 1)} ${H.btn('Alle', act, st.unitId + ':999', 'small', n < 1)}</td></tr>`;
    }).join('') : '<tr><td colspan="3" class="muted">niemand</td></tr>';
    return `<p class="lead">Eine Garnison verteidigt die Stadt gegen Angriffe der KI-Armeen. Garnisonstruppen erhalten den halben Sold.
      Richtwert für ${TOWN_TYPE_LABEL[t.type]}: ${Towns.garrisonCap(t)} Mann · Verteidigungskraft jetzt ${fmt(Towns.defenseStrength(t))}.</p>
      <div class="split"><div><div class="section-h">Deine Armee (${Roster.total(p.roster)})</div><table class="grid"><tbody>${rows(p.roster, 'toGarrison', '→')}</tbody></table></div>
      <div><div class="section-h">Garnison (${Roster.total(t.garrison)})</div><table class="grid"><tbody>${rows(t.garrison, 'fromGarrison', '←')}</tbody></table></div></div>`;
  },
  townJobs(t) {
    const s = S_();
    let h = '';
    const deliver = Missions.active(s).filter(mm => mm.type === 'Delivery' && mm.targetTownId === t.id);
    if (deliver.length) {
      h += '<div class="section-h">Lieferungen für diese Stadt</div>';
      for (const mm of deliver) {
        const ok = Missions.canDeliver(s, mm, t);
        h += `<div class="card"><div class="grow"><h4>${esc(mm.title)}</h4><p>Im Lager: ${Inv.get(s.player, mm.goodId)} / ${mm.amount}</p></div>${H.btn(`Liefern (+${fmt(mm.reward)} Cr)`, 'deliver', mm.id, 'good', !ok)}</div>`;
      }
    }
    const offers = Missions.offersAt(s, t.id);
    h += `<div class="section-h">Anschlagbrett (aktiv: ${Missions.active(s).length}/${Missions.MAX_ACTIVE})</div>`;
    if (!offers.length) h += '<p class="muted">Keine neuen Aufträge. Alle paar Tage wird das Brett neu bestückt.</p>';
    for (const mm of offers) {
      h += `<div class="card"><div class="grow"><h4>${esc(mm.title)}</h4><p>${esc(mm.description)}</p>
        <p>Belohnung <b class="good-text">${fmt(mm.reward)} Cr</b> · +${mm.renownReward} Ansehen · Frist bis ${GS.dayToDate(mm.deadlineDay)}</p></div>${H.btn('Annehmen', 'acceptMission', mm.id, 'good')}</div>`;
    }
    return h;
  },
});

// ======================================================== Begegnung / Bericht ====
Object.assign(UI.views, {
  encounter(m) {
    const s = S_(), e = Overworld.encounter;
    if (!e) return '';
    const mine = Overworld.playerStrength();
    if (e.hideout) {
      const h = e.hideout, active = GS.hideoutActive(h, GS.day(s));
      const body = active ? `<p class="lead">Rauch steigt aus dem Lager <b>${esc(h.name)}</b> auf. Späher zählen <b>8 bis 15</b> Bergpiraten hinter Palisaden –
          wer das Versteck aushebt, beendet für Wochen die Überfälle in der Gegend und gewinnt Ansehen.</p>
          <div class="kv">Deine Stärke <b>${fmt(mine)}</b> · ${Roster.healthy(s.player.roster)} Soldaten + du</div>`
        : `<p class="lead">Das Lager <b>${esc(h.name)}</b> ist verlassen. Hier ist vorerst nichts mehr zu holen.</p>`;
      const footer = active ? H.btn('Angreifen (3D-Gefecht)', 'encFight', '', 'danger') + H.btn('Automatisch auflösen', 'encAuto') + H.btn('Abziehen', 'encLeave') : H.btn('Weiterziehen', 'encLeave');
      return H.sheet({ title: 'Piratenversteck', meta: 'Sierra de Fuego', body, footer, size: 'narrow', close: false });
    }
    const p = e.party;
    const theirs = Campaign.strength(p);
    const veh = p.vehicles.map(id => esc(DB.vehicle(id) ? DB.vehicle(id).displayName : id)).join(', ');
    let intro;
    if (e.hostile && !e.initiatedByPlayer) intro = `<b>${esc(p.name)}</b> hat deine Kolonne gestellt! Die Männer gehen hinter den Fahrzeugen in Deckung.`;
    else if (e.hostile) intro = `Du hast <b>${esc(p.name)}</b> eingeholt. Der Feind formiert sich zum Gefecht.`;
    else intro = `Ihr trefft auf <b>${esc(p.name)}</b> (${esc(DB.factionName(p.faction))}). Man grüßt sich vorsichtig – ihr seid nicht im Krieg.`;
    const body = `<p class="lead">${intro}</p>
      <div class="kv">Fraktion: ${H.sw(DB.factionColor(p.faction))}<b>${esc(DB.factionName(p.faction))}</b></div>
      <div class="kv">Truppen: <b>${H.roster(p.roster)}</b></div>
      ${veh ? `<div class="kv">Fahrzeuge: <b>${veh}</b></div>` : ''}
      ${H.bar(mine / Math.max(1, mine + theirs), `Deine Stärke ${fmt(mine)} : ${fmt(theirs)} ${esc(DB.factionShort(p.faction))}`)}
      ${e.hostile && !e.initiatedByPlayer ? '<p class="lead">Ein Rückzug kostet etwa ein Zehntel deiner Soldaten als Nachhut.</p>' : ''}`;
    let footer;
    if (m.confirm) footer = H.confirm(m);
    else if (e.hostile) footer = H.btn('Kämpfen (3D-Gefecht)', 'encFight', '', 'danger') + H.btn('Automatisch auflösen', 'encAuto') + (e.initiatedByPlayer ? H.btn('Abziehen', 'encLeave') : H.btn('Rückzug', 'encRetreat'));
    else footer = H.btn('Angreifen …', 'encDeclareWar', '', 'danger') + H.btn('Weiterziehen', 'encLeave');
    return H.sheet({ title: esc(p.name), meta: e.hostile ? '<span class="bad-text">Feindkontakt</span>' : 'Begegnung', body, footer, size: 'narrow', close: false });
  },

  report(m) {
    const r = m.result, s = S_();
    const title = r.victory ? 'Sieg!' : r.playerRetreated ? 'Rückzug' : 'Niederlage';
    const items = r.itemsLooted.filter(i => i.amount > 0).map(i => `${i.amount}× ${esc(DB.goodName(i.id))}`);
    const weapons = r.weaponsLooted.map(w => esc(DB.weaponName(w)));
    const vehicles = r.vehiclesCaptured.map(v => esc(DB.vehicle(v.vehicleId).displayName));
    let body = `<p class="lead">${esc(r.summary || '')}</p><div class="split"><div>
      <div class="section-h">Eigene Verluste</div>
      <div class="kv">Gefallen: <b>${Roster.total(r.playerKilled)}</b> <span class="muted">${H.roster(r.playerKilled, '')}</span></div>
      <div class="kv">Verwundet: <b>${Roster.total(r.playerWounded)}</b></div>
      ${Roster.total(r.playerCaptured) ? `<div class="kv">Gefangen genommen: <b>${Roster.total(r.playerCaptured)}</b></div>` : ''}
      ${r.creditsLost ? `<div class="kv bad-text">Geplündert: −${fmt(r.creditsLost)} Cr</div>` : ''}
      </div><div>
      <div class="section-h">Feind</div>
      <div class="kv">Ausgeschaltet: <b>${Roster.total(r.enemyKilled)}</b></div>
      <div class="kv">Gefangene: <b>${Roster.total(r.prisonersTaken)}</b></div>
      ${r.playerKills ? `<div class="kv">Davon durch dich: <b>${r.playerKills}</b></div>` : ''}
      </div></div>`;
    if (r.victory) {
      body += `<div class="section-h">Beute</div><div class="kv">Credits: <b class="good-text">+${fmt(r.creditsLooted)}</b></div>
        ${items.length ? `<div class="kv">Material: <b>${items.join(', ')}</b></div>` : ''}
        ${weapons.length ? `<div class="kv">Waffen: <b>${weapons.join(', ')}</b></div>` : ''}
        ${vehicles.length ? `<div class="kv">Fahrzeuge: <b>${vehicles.join(', ')}</b></div>` : ''}`;
    }
    body += `<div class="section-h">Kompanie</div><div class="kv">Ansehen <b class="${r.renownGained >= 0 ? 'good-text' : 'bad-text'}">${r.renownGained >= 0 ? '+' : ''}${r.renownGained}</b> · Moral <b>${Math.round(s.player.morale)}</b> · Truppen <b>${Roster.healthy(s.player.roster)}</b> einsatzbereit</div>`;
    if (Roster.healthy(s.player.roster) === 0) body += '<p class="lead warn-text" style="margin-top:10px">Deine Kompanie ist zerschlagen. Wirb in einer befreundeten Stadt neue Truppen an.</p>';
    return H.sheet({ title, meta: esc(m.setupTitle || ''), body, footer: H.info(null) + H.btn('Weiter', 'close', '', 'good', false, 'autofocus'), size: 'narrow', close: false });
  },
});

          ${idx > 0 && w ? H.btn('Ablegen', 'unequip', idx, 'small') : ''}</div>`;

      body += '<div class="section-h">Ausgerüstet (Tasten 1–3 im Gefecht)</div>' + slot('Primär', p.primaryWeapon, 0) + slot('Sekundär', p.secondaryWeapon, 1) + slot('Spezial', p.specialWeapon, 2);
      body += '<div class="section-h">Waffenkammer</div>';
      if (!p.ownedWeapons.length) body += '<p class="muted">Keine weiteren Waffen. Kaufe welche beim Waffenhändler oder erbeute sie im Gefecht.</p>';
      for (const id of p.ownedWeapons) {
        const w = DB.weapon(id); if (!w) continue;
        body += `<div class="card"><div class="grow"><h4>${esc(w.displayName)}</h4><p>${weaponStats(w)}</p></div>
          ${H.btn('Primär', 'equip', id + ':0', 'small')} ${H.btn('Sekundär', 'equip', id + ':1', 'small')} ${H.btn('Spezial', 'equip', id + ':2', 'small')}</div>`;
      }
    } else if (m.tab === 'inv') {
      body += '<div class="tablewrap"><table class="grid"><thead><tr><th>Ware</th><th class="r">Menge</th><th>Beschreibung</th></tr></thead><tbody>';
      for (const g of DB.goods) body += `<tr><td><b>${esc(g.displayName)}</b></td><td class="r">${Inv.get(p, g.id)}</td><td class="muted">${esc(g.description)}</td></tr>`;
      body += '</tbody></table></div>';
      body += `<p class="lead" style="margin-top:10px">Nahrung reicht für <b>${Math.floor(Econ.daysOfFood(p))}</b> Tage. Munition: <b>${Inv.get(p, DB.AMMO)}</b> Kisten
        – pro 4 Soldaten wird eine Kiste je Gefecht gebraucht, sonst gibt es weniger Magazine.</p>`;
    } else {
      body += `<p class="lead">Gefangene können in Städten und Festungen gegen Lösegeld übergeben werden (Stadtmenü ▸ Übersicht).</p>`;
      if (!p.prisoners.stacks.length) body += '<p class="muted">Keine Gefangenen.</p>';
      else body += `<table class="grid"><tbody>${p.prisoners.stacks.map(st => `<tr><td>${esc(DB.unitName(st.unitId))}</td><td class="r">${st.count}</td><td class="r">${fmt(st.count * Econ.prisonerValue(st.unitId))} Cr</td></tr>`).join('')}</tbody></table>
        <p class="kv" style="margin-top:8px">Gesamtwert <b>${fmt(Econ.prisonersValue(p))} Cr</b></p>`;
    }
    return H.sheet({ title: 'Armee', meta: esc(s.commanderName), tabs, tab: m.tab, body, footer: closeFooter(m) });
  },

  towns(m) {
    const s = S_(), pp = s.player.pos;
    const list = s.towns.slice().sort((a, b) => flatDist(a.pos, pp) - flatDist(b.pos, pp));
    let body = '<div class="tablewrap"><table class="grid"><thead><tr><th>Ort</th><th>Typ</th><th>Besitzer</th><th class="r">Wohlstand</th><th class="r">Entfernung</th><th></th></tr></thead><tbody>';
    for (const t of list) {
      const war = GS.isHostileToPlayer(s, t.owner);
      body += `<tr><td><b>${esc(t.name)}</b></td><td>${TOWN_TYPE_LABEL[t.type]}</td><td>${H.sw(DB.factionColor(t.owner))}${esc(DB.factionShort(t.owner))} ${war ? H.chip('Krieg', 'war') : ''}</td>
        <td class="r">${Math.round(t.prosperity)}</td><td class="r">${(flatDist(t.pos, pp) / 10).toFixed(1)} km</td>
        <td class="r" style="white-space:nowrap">${H.btn('Zeigen', 'focusTown', t.id, 'small')} ${H.btn('Hinreisen', 'travelTown', t.id, 'small')}</td></tr>`;
    }
    body += '</tbody></table></div>';
    return H.sheet({ title: 'Städte', meta: `${s.towns.filter(GS.isPlayerOwned).length} in deinem Besitz`, body, footer: closeFooter(m) });
  },

  missions(m) {
    const s = S_(), active = Missions.active(s), day = GS.day(s);
    let body = '';
    if (!active.length) body = '<p class="lead">Keine aktiven Aufträge. Neue Aufträge findest du am Anschlagbrett der Städte (Stadtmenü ▸ Aufträge).</p>';
    for (const mm of active) {
      const giver = GS.town(s, mm.giverTownId), left = mm.deadlineDay - day;
      const target = mm.type === 'Bounty' ? GS.party(s, mm.targetPartyId) : null;
      body += `<div class="card"><div class="grow"><h4>${esc(mm.title)}</h4><p>${esc(mm.description)}</p>
        <p>Auftraggeber ${giver ? esc(giver.name) : '?'} · Belohnung <b class="good-text">${fmt(mm.reward)} Cr</b> · Frist <b class="${left <= 2 ? 'warn-text' : ''}">${left <= 0 ? 'heute' : `noch ${left} Tag${left === 1 ? '' : 'e'}`}</b>
        ${mm.type === 'Delivery' ? ` · im Lager ${Inv.get(s.player, mm.goodId)}/${mm.amount}` : ''}</p></div>
        ${target ? H.btn('Ziel verfolgen', 'chase', target.id, 'small') : giver ? H.btn('Hinreisen', 'travelTown', giver.id, 'small') : ''}

    return H.sheet({ title: 'Aufträge', meta: `${active.length}/${Missions.MAX_ACTIVE} aktiv`, body, footer: closeFooter(m), size: 'narrow' });
  },

  trader(m) {
    const s = S_();
    let body = '<p class="lead">Günstigster Einkauf und bester Verkauf in allen Orten, die dir nicht feindlich gesinnt sind. Ein Klick auf den Ort setzt die Marschroute.</p>';
    body += '<div class="tablewrap"><table class="grid"><thead><tr><th>Ware</th><th class="r">Lager</th><th class="r">Kauf ab</th><th>Ort</th><th class="r">Verkauf bis</th><th>Ort</th></tr></thead><tbody>';
    for (const g of DB.goods) {
      let cheap = null, best = null, cp = Infinity, bp = 0;
      for (const t of s.towns) {
        if (GS.isHostileToPlayer(s, t.owner)) continue;
        const b = Econ.buyPrice(t, g.id), se = Econ.sellPrice(t, g.id);
        if (b < cp) { cp = b; cheap = t; }
        if (se > bp) { bp = se; best = t; }
      }
      body += `<tr><td><b>${esc(g.displayName)}</b></td><td class="r">${Inv.get(s.player, g.id)}</td>
        <td class="r">${cheap ? fmt(cp) : '–'}</td><td>${cheap ? H.btn(esc(cheap.name), 'travelTown', cheap.id, 'small') : ''}</td>
        <td class="r">${best ? fmt(bp) : '–'}</td><td>${best ? H.btn(esc(best.name), 'travelTown', best.id, 'small') : ''}</td></tr>`;
    }
    body += '</tbody></table></div>';
    return H.sheet({ title: 'Händler – Preisübersicht', body, footer: closeFooter(m) });
  },

  diplomacy(m) {
    const s = S_();
    let body = '';
    for (const f of DB.factions) {
      if (f.id === DB.PLAYER) continue;
      const fs = GS.faction(s, f.id);
      if (!fs) continue;
      const enemies = fs.enemies.map(e => esc(DB.factionShort(e)));
      const towns = GS.townsOwnedBy(s, f.id).length;
      let action = '';
      if (fs.atWarWithPlayer && !f.isBandit) action = H.btn(`Frieden kaufen (${fmt(Econ.peaceCost(s, f.id))} Cr)`, 'peace', f.id, 'good', s.player.credits < Econ.peaceCost(s, f.id));
      else if (!fs.atWarWithPlayer) action = H.btn('Krieg erklären …', 'declareWar', f.id, 'danger');
      body += `<div class="card"><div class="grow"><h4>${H.sw(f.color)}${esc(f.displayName)} ${fs.atWarWithPlayer ? H.chip('Krieg mit dir', 'war') : H.chip('Frieden', 'peace')}</h4>

  },

  mercs(m) {
    const s = S_(), pp = s.player.pos;

UI.controlsSeg = function () {

  return `<div class="seg" role="group" aria-label="Steuerung">

    <button type="button" class="segbtn${c === 'touch' ? ' on' : ''}" data-act="setControls" data-arg="touch" aria-pressed="${c === 'touch'}">Handy<small>Touchscreen</small></button></div>`;
};
UI.settingsHtml = function (st) {
  return `<div style="margin-bottom:12px">${UI.controlsSeg()}</div>
    <div style="display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center">

    <label class="kv" for="setScale">Auflösung</label><input id="setScale" type="range" min="0.5" max="1" step="0.05" value="${st.renderScale}" data-set="renderScale">
    <span></span><label class="chk"><input type="checkbox" data-set="shadows" ${st.shadows ? 'checked' : ''}> Schatten</label>

// ================================================================= Aktionen ====
const argN = a => { const [id, n] = String(a).split(':'); return [id, parseInt(n, 10) || 1]; };
Object.assign(UI.actions, {
  openAudio() { AudioUI.open(); },
  close() {
    const m = this.modal;
    if (m && m.back) { this.modal = m.back; this.render(true); return; }
    if (m && m.kind === 'report' && Game.mode === 'map') Game.afterReport();
    this.closeModal();
  },
  tab(id) { this.modal.tab = id; this.modal.msg = ''; this.modal.confirm = null; },
  confirmNo() { this.modal.confirm = null; },
  confirmYes() {
    const c = this.modal.confirm;
    this.modal.confirm = null;
    if (c && this.actions[c.act]) this.actions[c.act].call(this, c.arg, null, true);
  },

  // ----------------------------------------------------------- Stadt ----
  townRest() {
    const t = GS.town(S_(), this.modal.townId);
    Overworld.restInTown(24);
    this.flash({ ok: true, msg: `Ein Tag in ${t ? t.name : 'der Stadt'} vergeht. Die Truppe erholt sich.` });
  },
  ransom() { const t = GS.town(S_(), this.modal.townId); if (t) this.flash(Econ.sellPrisoners(S_())); },
  fortify() { const t = GS.town(S_(), this.modal.townId); if (t) this.flash(Econ.upgradeFortification(S_(), t)); },
  bsel(i) { const k = parseInt(i, 10); this.modal.bsel = this.modal.bsel === k ? undefined : k; },
  bbuild(arg) {
    const [i, id] = String(arg).split(':'), t = GS.town(S_(), this.modal.townId);
    if (!t) return;
    const r = Buildings.start(S_(), t, parseInt(i, 10), id);
    if (r.ok) GS.log(S_(), `${t.name}: ${r.msg}`);
    this.flash(r);
  },
  bup(i) {
    const t = GS.town(S_(), this.modal.townId);
    if (!t) return;
    const r = Buildings.start(S_(), t, parseInt(i, 10));
    if (r.ok) GS.log(S_(), `${t.name}: ${r.msg}`);
    this.flash(r);
  },
  attackTown(arg, el, ok) {
    const s = S_(), t = GS.town(s, this.modal.townId);
    if (!t) return;
    if (!ok) { this.ask(`Ein Angriff auf ${t.name} bedeutet Krieg mit ${DB.factionName(t.owner)}. Wirklich?`, 'attackTown', '', 'Krieg erklären'); return; }
    GS.setWarWithPlayer(s, t.owner, true);
    this.modal.tab = 'overview';
    this.flash({ ok: false, msg: `${DB.factionName(t.owner)} ist nun dein Feind.` });
  },
  siegeFight() { const t = GS.town(S_(), this.modal.townId); if (t) Overworld.beginSiege(t); },
  siegeAuto() { const t = GS.town(S_(), this.modal.townId); if (t) Overworld.autoResolveSiege(t); },
  recruit(a) { const [id, n] = argN(a), t = GS.town(S_(), this.modal.townId); this.flash(Econ.recruit(S_(), t, id, n)); },
  buy(a) { const [id, n] = argN(a), t = GS.town(S_(), this.modal.townId); this.flash(Econ.buy(S_(), t, id, n)); },
  sell(a) { const [id, n] = argN(a), t = GS.town(S_(), this.modal.townId); this.flash(Econ.sell(S_(), t, id, n)); },
  buyWeapon(id) { const t = GS.town(S_(), this.modal.townId); this.flash(Econ.buyWeapon(S_(), t, id)); },
  sellWeapon(id) { this.flash(Econ.sellWeapon(S_(), id)); },
  buyVehicle(id) { const t = GS.town(S_(), this.modal.townId); this.flash(Econ.buyVehicle(S_(), t, id)); },

// ===== battle_world.js =====
// ===================================================================================
//  battle_world.js – Gefechtsfeld (Port von BattlefieldGenerator.cs / CoverSystem.cs)
//  Gelände je Kampfgebiet, Requisiten mit Deckungspunkten, Kollision, Strahltests,
//  Wegfindung (Raster-A* statt NavMesh) und Partikeleffekte.
//  Koordinaten: three.js (x, y oben, z). Spieler startet bei z < 0 und blickt nach +z.
// ===================================================================================
'use strict';

/** Baut eine Geometrie aus vielen Teilen mit Vertex-Farben (eine Draw-Call pro Objekt). */
class GeoBuilder {
  constructor() { this.p = []; this.n = []; this.c = []; this.m = new THREE.Matrix4(); this.q = new THREE.Quaternion(); this.e = new THREE.Euler(); this.v = new THREE.Vector3(); this.s = new THREE.Vector3(); this.nm = new THREE.Matrix3(); }
  static unit(kind, seg) {
    const key = kind + (seg || '');
    GeoBuilder.cache = GeoBuilder.cache || {};
    let g = GeoBuilder.cache[key];
    if (!g) {
      if (kind === 'box') g = new THREE.BoxGeometry(1, 1, 1);
      else if (kind === 'cyl') g = new THREE.CylinderGeometry(0.5, 0.5, 1, seg || 10);
      else if (kind === 'cone') g = new THREE.ConeGeometry(0.5, 1, seg || 8);
      else if (kind === 'sph') g = new THREE.SphereGeometry(0.5, seg || 8, Math.max(5, (seg || 8) - 2));
      else if (kind === 'ico') g = new THREE.IcosahedronGeometry(0.5, 0);
      g = g.toNonIndexed();
      GeoBuilder.cache[key] = g;
    }
    return g;
  }
  add(kind, x, y, z, sx, sy, sz, color, yaw = 0, pitch = 0, roll = 0, seg = 0) {
    const g = GeoBuilder.unit(kind, seg);
    this.e.set(pitch, yaw, roll, 'YXZ');
    this.q.setFromEuler(this.e);
    this.m.compose(this.v.set(x, y, z), this.q, this.s.set(sx, sy, sz));
    this.nm.getNormalMatrix(this.m);
    const P = g.attributes.position, N = g.attributes.normal, v = new THREE.Vector3();
    for (let i = 0; i < P.count; i++) {
      v.fromBufferAttribute(P, i).applyMatrix4(this.m); this.p.push(v.x, v.y, v.z);
      v.fromBufferAttribute(N, i).applyMatrix3(this.nm).normalize(); this.n.push(v.x, v.y, v.z);
      this.c.push(color[0], color[1], color[2]);
    }
    return this;
  }
  build() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(this.n, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(this.c, 3));
    g.computeBoundingSphere();
    return g;
  }
}
const hex3 = h => [((h >> 16) & 255) / 255, ((h >> 8) & 255) / 255, (h & 255) / 255];
const mulC = (c, f) => [c[0] * f, c[1] * f, c[2] * f];

const TERRAIN_PAL = {
  Grass: [96, 128, 58], Dirt: [122, 98, 68], Rock: [122, 118, 108], JungleFloor: [58, 84, 40], DesertSand: [205, 176, 122],
  Pavement: [140, 134, 124], BeachSand: [222, 204, 160], Farmland: [112, 90, 56],
};
const TERRAIN_LAYERS = {
  Jungle: ['JungleFloor', 'Dirt', 'Grass'], Forest: ['JungleFloor', 'Grass', 'Dirt'], Desert: ['DesertSand', 'Dirt', 'Rock'],
  Urban: ['Pavement', 'Dirt', 'Grass'], Hills: ['Grass', 'Dirt', 'Rock'], Beach: ['BeachSand', 'Dirt', 'Grass'],
  Farmland: ['Farmland', 'Dirt', 'Grass'], Siege: ['Grass', 'Dirt', 'Pavement'], Plains: ['Grass', 'Dirt', 'Rock'],
};
const PASTELS = [[0.93, 0.72, 0.72], [0.96, 0.86, 0.55], [0.62, 0.8, 0.9], [0.95, 0.93, 0.86], [0.72, 0.88, 0.7], [0.98, 0.76, 0.5]];
const TERRACOTTA = [0.66, 0.32, 0.2];

// =================================================================== Gefechtsfeld ====
class BattleField {
  constructor(setup) {
    this.setup = setup;
    this.rng = new RNG((setup.seed || 1) * 31 + 7);
    this.perlin = new Perlin((setup.seed || 1) * 7 + 3);
    this.half = 150; this.ext = 62; this.E = this.half + this.ext; this.step = 2;
    this.N = Math.round(2 * this.E / this.step) + 1;
    this.ox = this.R(0, 500); this.oz = this.R(0, 500);
    this.terrain = setup.terrain || 'Plains';
    this.hasCompound = this.terrain === 'Siege';
    this.hasSea = this.terrain === 'Beach';
    this.seaStartX = this.half - 75;
    this.playerSpawn = { x: 0, y: 0, z: -this.half + 35 };
    this.enemySpawn = { x: 0, y: 0, z: this.half - 35 };
    if (this.hasCompound) { this.compound = { x: 0, z: this.half - 75, w: 86, d: 66 }; this.enemySpawn = { x: 0, y: 0, z: this.compound.z }; }
    this.pathPoints = [this.playerSpawn, { x: this.R(-45, 45), z: -this.half * 0.3 }, { x: this.R(-45, 45), z: this.half * 0.3 }, this.enemySpawn];
    this.blockers = []; this.obstacles = []; this.cover = [];
    this.inst = {};           // gesammelte Instanzen je Vegetationsart
    this.group = new THREE.Group();
    this.disposables = [];
    this.rayStamp = 0;
  }
  R(a, b) { return a + this.rng.next() * (b - a); }

  // ============================================================== Erzeugung ====
  generate(scene) {
    this.buildTerrain();
    for (const p of [this.playerSpawn, this.enemySpawn]) p.y = this.ground(p.x, p.z);
    if (this.compound) this.compound.y = this.ground(this.compound.x, this.compound.z);
    this.blockers.push([this.playerSpawn.x, this.playerSpawn.z, 28]);
    if (!this.hasCompound) this.blockers.push([this.enemySpawn.x, this.enemySpawn.z, 28]);
    switch (this.terrain) {
      case 'Jungle': this.buildJungle(); break;
      case 'Forest': this.buildForest(); break;
      case 'Desert': this.buildDesert(); break;
      case 'Urban': this.buildTown(); break;
      case 'Hills': this.buildHills(); break;
      case 'Beach': this.buildBeach(); break;
      case 'Farmland': this.buildFarmland(); break;
      case 'Siege': this.buildCompound(); this.buildPlainsProps(0.6); break;
      default: this.buildPlainsProps(1);
    }
    this.buildOuterRing();
    this.flushInstances();
    let vis = 180;
    if (this.terrain === 'Jungle') vis = 75; else if (this.terrain === 'Forest') vis = 95; else if (this.terrain === 'Urban') vis = 120;
    this.night = this.setup.hourOfDay < 5.5 || this.setup.hourOfDay > 20.5;
    if (this.night) vis *= 0.55;
    this.visibility = vis;
    this.fogDensity = (this.terrain === 'Jungle' ? 0.0085 : this.terrain === 'Forest' ? 0.0058 : 0.0026) * (this.night ? 1.5 : 1);
    this.buildGrid();
    this.buildNav();
    this.filterCover();
    scene.add(this.group);
  }

  // ----------------------------------------------------------------- Höhe ----
  fbm(x, y) { const p = this.perlin; return p.noise(x, y) * 0.6 + p.noise(x * 2.1, y * 2.1) * 0.3 + p.noise(x * 4.3, y * 4.3) * 0.1; }
  distToPath(x, z) {
    let best = 1e9;
    const pp = this.pathPoints;
    for (let i = 0; i < pp.length - 1; i++) best = Math.min(best, distToSegment(x, z, pp[i].x, pp[i].z, pp[i + 1].x, pp[i + 1].z));
    return best;
  }
  baseHeight(x, z) {
    const n = this.fbm(x * 0.012 + this.ox, z * 0.012 + this.oz);
    let h;
    switch (this.terrain) {
      case 'Hills': h = (n - 0.35) * 22 + this.fbm(x * 0.03 + this.oz, z * 0.03 + this.ox) * 4; break;
      case 'Desert': { const r = 1 - Math.abs(this.perlin.noise(x * 0.02 + this.ox, z * 0.035 + this.oz) * 2 - 1); h = r * r * 7 + n * 2; break; }
      case 'Urban': h = n * 0.8; break;
      case 'Farmland': h = n * 1.6; break;
      case 'Jungle': h = n * 6; break;
      case 'Forest': h = n * 7; break;
      case 'Beach': h = n * 2.5 + 0.8; break;
      case 'Siege': h = n * 3; break;
      default: h = n * 4.5;
    }
    const flat = (hh, c, inner, outer) => { const d = Math.hypot(x - c.x, z - c.z); return lerp(Math.min(hh, 1.2), hh, smooth01(invLerp(inner, outer, d))); };
    h = flat(h, this.playerSpawn, 24, 40);
    if (!this.hasCompound) h = flat(h, this.enemySpawn, 24, 40);
    else {
      const c = this.compound;
      const dx = Math.max(0, Math.abs(x - c.x) - c.w * 0.5 - 6), dz = Math.max(0, Math.abs(z - c.z) - c.d * 0.5 - 6);
      h = lerp(1.5, h, smooth01(Math.hypot(dx, dz) / 20));
    }
    const pd = this.distToPath(x, z);
    if (pd < 8) h = lerp(h * 0.6, h, pd / 8);
    if (this.hasSea) h = lerp(h, -6, smooth01(invLerp(this.seaStartX, this.seaStartX + 30, x)));
    // Außenring sanft auf Sockelhöhe auslaufen lassen
    const edge = Math.max(Math.abs(x), Math.abs(z));
    if (edge > this.half + 4) h = lerp(h, this.hasSea && x > this.seaStartX ? -6 : 0.4, smooth01(invLerp(this.E - 40, this.E - 2, edge)));
    return h;
  }
  /** Geländehöhe – exakt auf den Dreiecken des Meshes. */
  ground(x, z) {
    const N = this.N, st = this.step;
    let fx = (x + this.E) / st, fz = (z + this.E) / st;
    fx = clamp(fx, 0, N - 1.001); fz = clamp(fz, 0, N - 1.001);
    const i = fx | 0, j = fz | 0, u = fx - i, v = fz - j, k = j * N + i, hm = this.hm;
    if (u + v <= 1) return hm[k] + (hm[k + 1] - hm[k]) * u + (hm[k + N] - hm[k]) * v;
    const hd = hm[k + N + 1];
    return hd + (hm[k + N] - hd) * (1 - u) + (hm[k + 1] - hd) * (1 - v);
  }
  normalAt(x, z, out) {
    const e = 1.2, hx = this.ground(x + e, z) - this.ground(x - e, z), hz = this.ground(x, z + e) - this.ground(x, z - e);
    out.set(-hx, 2 * e, -hz).normalize();
    return out;
  }

  buildTerrain() {
    const N = this.N, E = this.E, st = this.step;
    const hm = this.hm = new Float32Array(N * N);
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) hm[j * N + i] = this.baseHeight(-E + i * st, -E + j * st);
    const pos = new Float32Array(N * N * 3), uv = new Float32Array(N * N * 2);
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const k = j * N + i;
      pos[k * 3] = -E + i * st; pos[k * 3 + 1] = hm[k]; pos[k * 3 + 2] = -E + j * st;
      uv[k * 2] = i / (N - 1); uv[k * 2 + 1] = j / (N - 1);
    }
    const idx = new Uint32Array((N - 1) * (N - 1) * 6);
    let t = 0;
    for (let j = 0; j < N - 1; j++) for (let i = 0; i < N - 1; i++) {
      const a = j * N + i, b = a + 1, c = a + N, d = c + 1;
      idx[t++] = a; idx[t++] = c; idx[t++] = b; idx[t++] = b; idx[t++] = c; idx[t++] = d;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    geo.setIndex(new THREE.BufferAttribute(idx, 1));
    geo.computeVertexNormals();
    // Farbtextur (Splat wie im Unity-Original)
    const TW = 512, cv = document.createElement('canvas'); cv.width = cv.height = TW;
    const ctx = cv.getContext('2d'), img = ctx.createImageData(TW, TW);
    const L = (TERRAIN_LAYERS[this.terrain] || TERRAIN_LAYERS.Plains).map(n => TERRAIN_PAL[n]);
    const rock = TERRAIN_PAL.Rock, c = this.compound;
    for (let py = 0; py < TW; py++) for (let px = 0; px < TW; px++) {
      const wx = -E + (px + 0.5) / TW * 2 * E, wz = E - (py + 0.5) / TW * 2 * E;
      const n = this.perlin.noise(wx * 0.05 + this.ox, wz * 0.05 + this.oz);
      let w0 = 1, w1 = clamp01((n - 0.55) * 3), w2 = clamp01((0.35 - n) * 3);
      const pd = this.distToPath(wx, wz);
      if (pd < 4.5) w1 += (1 - pd / 4.5) * 3;
      if (c && Math.abs(wx - c.x) < c.w * 0.5 && Math.abs(wz - c.z) < c.d * 0.5) { w2 += 3; w0 = 0.2; }
      if (this.terrain === 'Beach' && wx < this.seaStartX - 20) w2 += invLerp(this.seaStartX - 20, -this.half, wx) * 2;
      const sum = w0 + w1 + w2;
      let r = (L[0][0] * w0 + L[1][0] * w1 + L[2][0] * w2) / sum, g = (L[0][1] * w0 + L[1][1] * w1 + L[2][1] * w2) / sum, b = (L[0][2] * w0 + L[1][2] * w1 + L[2][2] * w2) / sum;
      // steile Hänge felsig
      const s = Math.abs(this.ground(wx + 1.5, wz) - this.ground(wx - 1.5, wz)) + Math.abs(this.ground(wx, wz + 1.5) - this.ground(wx, wz - 1.5));
      const rk = clamp01((s - 1.6) / 2.5);
      r = lerp(r, rock[0], rk); g = lerp(g, rock[1], rk); b = lerp(b, rock[2], rk);
      if (this.hasSea && this.ground(wx, wz) < 0.2) { const wet = clamp01((0.2 - this.ground(wx, wz)) / 1.5); r = lerp(r, 150, wet); g = lerp(g, 135, wet); b = lerp(b, 105, wet); }
      // großflächige Farbvariation (trockene und sattere Flecken)
      const v = this.perlin.noise(wx * 0.011 + 31, wz * 0.011 + 17) - 0.5;
      if (L[0] === TERRAIN_PAL.Grass || L[0] === TERRAIN_PAL.JungleFloor) { r += v * 70; g += v * 40; b += v * 8; }
      else { r += v * 30; g += v * 26; b += v * 20; }
      const f = 0.86 + 0.28 * this.perlin.noise(wx * 0.31 + 11, wz * 0.31 + 5);
      const o = (py * TW + px) * 4;
      img.data[o] = r * f; img.data[o + 1] = g * f; img.data[o + 2] = b * f; img.data[o + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    this.mapCanvas = cv;
    const tex = new THREE.CanvasTexture(cv);
    tex.encoding = THREE.sRGBEncoding; tex.anisotropy = 8;
    const detail = detailNoiseTexture(256, (this.setup.seed || 1) % 97 + 3);
    const mat = new THREE.MeshLambertMaterial({ map: tex });
    const rep = (2 * E / 3).toFixed(1), rep2 = (2 * E / 13).toFixed(1);
    mat.onBeforeCompile = sh => {
      sh.uniforms.detailMap = { value: detail };
      sh.fragmentShader = 'uniform sampler2D detailMap;\n' + sh.fragmentShader.replace('#include <map_fragment>',
        `#include <map_fragment>\n float dn = texture2D(detailMap, vUv * vec2(${rep}, ${rep})).r * 0.55 + texture2D(detailMap, vUv * vec2(${rep2}, ${rep2})).r * 0.45;\n diffuseColor.rgb *= 0.78 + 0.42 * dn;`);
    };
    const mesh = new THREE.Mesh(geo, mat);
    mesh.receiveShadow = true;
    this.group.add(mesh);
    this.terrainMesh = mesh;
    this.disposables.push(geo, mat, tex, detail);
    // Sockel außerhalb
    const base = L[0];
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), new THREE.MeshLambertMaterial({ color: new THREE.Color(base[0] / 255 * 0.8, base[1] / 255 * 0.8, base[2] / 255 * 0.8) }));
    let minH = Infinity;
    for (let k = 0; k < hm.length; k++) if (hm[k] < minH) minH = hm[k];
    plane.rotation.x = -Math.PI / 2; plane.position.y = Math.min(0, minH) - 0.4;
    plane.receiveShadow = false;
    this.group.add(plane);
    this.disposables.push(plane.geometry, plane.material);
    if (this.hasSea) {
      const sea = new THREE.Mesh(new THREE.PlaneGeometry(3000, 6000), new THREE.MeshPhongMaterial({ color: 0x1d7f94, shininess: 90, specular: 0x557788, transparent: true, opacity: 0.93 }));
      sea.rotation.x = -Math.PI / 2; sea.position.set(this.seaStartX + 1500 - 12, -0.6, 0);
      this.group.add(sea);
      this.disposables.push(sea.geometry, sea.material);
    }
  }

  // ======================================================= Platzierhilfen ====
  free(x, z, radius) {
    const h = this.half;
    if (Math.abs(x) > h - 6 || Math.abs(z) > h - 6) return false;
    if (this.hasSea && x > this.seaStartX - 4) return false;
    if (this.distToPath(x, z) < 6 + radius * 0.5) return false;
    const c = this.compound;
    if (c && Math.abs(x - c.x) < c.w * 0.5 + 8 && Math.abs(z - c.z) < c.d * 0.5 + 8) return false;
    for (const b of this.blockers) if (Math.hypot(x - b[0], z - b[1]) < b[2] + radius) return false;
    return true;
  }
  tryPoint(radius) {
    const h = this.half;
    for (let i = 0; i < 25; i++) {
      const x = this.R(-h + 8, h - 8), z = this.R(-h + 8, h - 8);
      if (!this.free(x, z, radius)) continue;
      this.blockers.push([x, z, radius]);
      return { x, y: this.ground(x, z), z };
    }
    return null;
  }
  onGround(x, z) { return { x, y: this.ground(x, z), z }; }

  // ============================================================ Hindernisse ====
  /** Quader: Mittelpunkt (x,z), Boden y0, Höhe, halbe Ausdehnung, Gierwinkel (rad). */
  addBox(x, z, y0, height, hx, hz, yaw, mat = 'stone', low = false, cover = true) {
    const o = { k: 0, x, z, y0, y1: y0 + height, hx, hz, c: Math.cos(yaw), s: Math.sin(yaw), r: Math.hypot(hx, hz), mat, id: this.obstacles.length };
    this.obstacles.push(o);
    if (cover) this.addBoxCover(o, low);
    return o;
  }
  addCyl(x, z, y0, y1, r, mat = 'wood', cover = true, low = false, count = 4) {
    const o = { k: 1, x, z, y0, y1, r, mat, id: this.obstacles.length };
    this.obstacles.push(o);
    if (cover) this.addRoundCover(x, z, r, low, count);
    return o;
  }
  addCoverPoint(x, z, dx, dz, low) {
    const l = Math.hypot(dx, dz);
    if (l < 1e-4) return;
    this.cover.push({ x, z, y: 0, dx: dx / l, dz: dz / l, low, occ: null });
  }
  addBoxCover(o, low) {
    const spacing = 2.6, off = 0.9;
    // lokale Achsen: X = (c,0,-s), Z = (s,0,c)
    const ax = [o.c, -o.s], az = [o.s, o.c];
    const edge = (mx, mz, along, half, cdx, cdz) => {
      const n = Math.max(1, Math.floor(half * 2 / spacing));
      for (let i = 0; i < n; i++) {
        const t = n === 1 ? 0 : -half + 0.6 + (half * 2 - 1.2) * i / (n - 1);
        this.addCoverPoint(mx + along[0] * t, mz + along[1] * t, cdx, cdz, low);
      }
    };
    edge(o.x + az[0] * (o.hz + off), o.z + az[1] * (o.hz + off), ax, o.hx, -az[0], -az[1]);
    edge(o.x - az[0] * (o.hz + off), o.z - az[1] * (o.hz + off), ax, o.hx, az[0], az[1]);
    edge(o.x + ax[0] * (o.hx + off), o.z + ax[1] * (o.hx + off), az, o.hz, -ax[0], -ax[1]);
    edge(o.x - ax[0] * (o.hx + off), o.z - ax[1] * (o.hx + off), az, o.hz, ax[0], ax[1]);
  }
  addRoundCover(x, z, r, low, count) {
    for (let i = 0; i < count; i++) {
      const a = i * Math.PI * 2 / count, dx = Math.cos(a), dz = Math.sin(a);
      this.addCoverPoint(x + dx * (r + 0.8), z + dz * (r + 0.8), -dx, -dz, low);
    }
  }

  // ---------------------------------------------------------- Requisiten ----
  mesh(geo, opts) {
    const m = new THREE.Mesh(geo, opts && opts.mat ? opts.mat : this.vcMat());
    m.castShadow = !opts || opts.shadow !== false; m.receiveShadow = true;
    this.group.add(m);
    this.disposables.push(geo);
    return m;
  }
  vcMat() { if (!this._vc) { this._vc = new THREE.MeshLambertMaterial({ vertexColors: true }); this.disposables.push(this._vc); } return this._vc; }
  queue(kind, x, y, z, sx, sy, sz, yaw = 0, tilt = 0) { (this.inst[kind] = this.inst[kind] || []).push([x, y, z, sx, sy, sz, yaw, tilt]); }

  rock(p, size) {
    const sx = size * this.R(1, 1.6), sy = size * this.R(0.6, 1.1), sz = size * this.R(0.9, 1.4);
    this.queue('rock', p.x, p.y + sy * 0.25, p.z, sx, sy, sz, this.R(0, 6.28), this.R(-0.3, 0.3));
    this.addCyl(p.x, p.z, p.y - 0.5, p.y + sy * 0.72, Math.max(sx, sz) * 0.42, 'stone', false);
    this.addRoundCover(p.x, p.z, Math.max(sx, sz) * 0.5, sy < 1.6, sx > 2.5 ? 8 : 5);
  }
  sandbags(p, length, yaw) {
    const b = new GeoBuilder(), cols = [[0.62, 0.55, 0.4], [0.57, 0.5, 0.36], [0.66, 0.6, 0.45]];
    const n = Math.max(2, Math.round(length / 0.62));
    for (let row = 0; row < 3; row++) for (let i = 0; i < n - (row === 2 ? 1 : 0); i++) {
      const lx = -length / 2 + (i + 0.5 + (row % 2) * 0.5) * (length / n);
      const ox = Math.cos(yaw) * lx, oz = -Math.sin(yaw) * lx;
      b.add('box', p.x + ox, p.y + 0.17 + row * 0.31, p.z + oz, length / n * 0.96, 0.3, 0.62, cols[(i + row) % 3], yaw, 0, (i % 2 ? 0.04 : -0.04));
    }
    this.mesh(b.build());
    this.addBox(p.x, p.z, p.y - 0.3, 1.25, length / 2, 0.35, yaw, 'sand', true);
  }
  crate(p, size, yaw = this.R(0, 1.57)) {
    const b = new GeoBuilder(), wood = [0.45, 0.36, 0.22], dark = [0.33, 0.26, 0.15];
    b.add('box', p.x, p.y + size / 2, p.z, size, size, size, wood, yaw);
    b.add('box', p.x, p.y + size / 2, p.z, size * 1.02, size * 0.14, size * 1.02, dark, yaw);
    b.add('box', p.x, p.y + size * 0.93, p.z, size * 1.02, size * 0.12, size * 1.02, dark, yaw);
    this.mesh(b.build());
    this.addBox(p.x, p.z, p.y - 0.2, size + 0.2, size / 2, size / 2, yaw, 'wood', size < 1.5);
  }
  wreck(p, yaw = this.R(0, 6.28)) {
    const b = new GeoBuilder(), burnt = [0.2, 0.18, 0.16], rust = [0.4, 0.24, 0.14];
    const fx = Math.sin(yaw), fz = Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
    b.add('box', p.x, p.y + 0.75, p.z, 1.9, 0.75, 4.2, rust, yaw, 0, 0.06);
    b.add('box', p.x - fx * 0.3, p.y + 1.35, p.z - fz * 0.3, 1.7, 0.55, 2, burnt, yaw, 0, 0.06);
    for (const [a, c] of [[1, 1.4], [-1, 1.4], [1, -1.4], [-1, -1.4]]) b.add('cyl', p.x + rx * a * 0.95 + fx * c, p.y + 0.35, p.z + rz * a * 0.95 + fz * c, 0.7, 0.3, 0.7, [0.08, 0.08, 0.08], yaw, 0, Math.PI / 2, 10);
    this.mesh(b.build());
    this.addBox(p.x, p.z, p.y - 0.2, 1.8, 0.95, 2.1, yaw, 'metal', true);
  }
  building(p, size, yaw, wall, roof) {
    const [w, h, d] = size, b = new GeoBuilder();
    const fx = Math.sin(yaw), fz = Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
    b.add('box', p.x, p.y + h / 2 - 0.3, p.z, w, h + 0.6, d, wall, yaw);
    b.add('box', p.x, p.y + h + 0.12, p.z, w + 0.5, 0.3, d + 0.5, roof, yaw);
    b.add('box', p.x, p.y + h + 0.45, p.z, w * 0.8, 0.5, d * 0.85, mulC(roof, 0.9), yaw);
    const dark = [0.12, 0.1, 0.09], frame = mulC(wall, 0.75);
    // Tür und Fenster an den Längsseiten
    for (const side of [1, -1]) {
      const cx = p.x + fx * side * (d / 2 + 0.03), cz = p.z + fz * side * (d / 2 + 0.03);
      b.add('box', cx, p.y + 1.05, cz, 1.2, 2.1, 0.06, dark, yaw);
      for (const off of [-w * 0.3, w * 0.3]) if (w > 4.5) {
        b.add('box', cx + rx * off, p.y + Math.min(h - 1, 2.2), cz + rz * off, 0.9, 1.1, 0.07, dark, yaw);
        b.add('box', cx + rx * off, p.y + Math.min(h - 1, 2.2) - 0.62, cz + rz * off, 1.1, 0.12, 0.12, frame, yaw);
      }
      if (h > 6) for (const off of [-w * 0.3, 0, w * 0.3]) b.add('box', cx + rx * off, p.y + h - 1.8, cz + rz * off, 0.8, 1, 0.07, dark, yaw);
    }
    this.mesh(b.build());
    this.addBox(p.x, p.z, p.y - 0.5, h + 1, w / 2, d / 2, yaw, 'stone', false);
  }
  wall(p, length, height, yaw, color) {
    const b = new GeoBuilder();
    b.add('box', p.x, p.y + height / 2 - 0.3, p.z, length, height + 0.6, 0.8, color, yaw);
    b.add('box', p.x, p.y + height + 0.05, p.z, length + 0.1, 0.12, 0.9, mulC(color, 0.85), yaw);
    this.mesh(b.build());
    this.addBox(p.x, p.z, p.y - 0.5, height + 0.5, length / 2, 0.4, yaw, 'stone', height < 1.6);
  }
  tree(p, scale, pine) {
    if (pine) { this.queue('pineTrunk', p.x, p.y, p.z, 0.35 * scale, 3 * scale, 0.35 * scale); this.queue('pine', p.x, p.y + 1.6 * scale, p.z, 2.6 * scale, 6.5 * scale, 2.6 * scale, this.R(0, 6.28)); }
    else { this.queue('trunk', p.x, p.y, p.z, 0.4 * scale, 3.4 * scale, 0.4 * scale); this.queue(this.rng.chance(0.5) ? 'crownA' : 'crownB', p.x, p.y + 4.2 * scale, p.z, 3.6 * scale, 3 * scale, 3.6 * scale, this.R(0, 6.28)); }
    this.addCyl(p.x, p.z, p.y - 0.3, p.y + 4 * scale, 0.25 * scale, 'wood', false);
    this.addRoundCover(p.x, p.z, 0.25 * scale, false, 3);
  }
  palm(p, scale) {
    const yaw = this.R(0, 6.28), tilt = this.R(0.05, 0.22);
    this.queue('palmTrunk', p.x, p.y, p.z, 0.32 * scale, 6 * scale, 0.32 * scale, yaw, tilt);
    const tx = p.x + Math.sin(yaw) * Math.sin(tilt) * 6 * scale, tz = p.z + Math.cos(yaw) * Math.sin(tilt) * 6 * scale;
    this.queue('palmCrown', tx, p.y + Math.cos(tilt) * 6 * scale, tz, 3.2 * scale, 3.2 * scale, 3.2 * scale, this.R(0, 6.28));
    this.addCyl(p.x, p.z, p.y - 0.3, p.y + 5 * scale, 0.2 * scale, 'wood', false);
    this.addRoundCover(p.x, p.z, 0.2 * scale, false, 3);
  }
  jungleTree(p, scale) {
    this.queue('jTrunk', p.x, p.y, p.z, 0.7 * scale, 7 * scale, 0.7 * scale);
    this.queue(this.rng.chance(0.5) ? 'jCrownA' : 'jCrownB', p.x, p.y + 7 * scale, p.z, 5 * scale, 3.2 * scale, 5 * scale, this.R(0, 6.28));
    if (this.rng.chance(0.6)) this.queue('jCrownB', p.x + this.R(-1, 1), p.y + 4.6 * scale, p.z + this.R(-1, 1), 3.6 * scale, 2.4 * scale, 3.6 * scale, this.R(0, 6.28));
    this.addCyl(p.x, p.z, p.y - 0.3, p.y + 7 * scale, 0.35 * scale, 'wood', false);
    this.addRoundCover(p.x, p.z, 0.35 * scale, false, 4);
  }
  bush(p, size, dark) { this.queue(dark ? 'bushDark' : 'bush', p.x, p.y + size * 0.3, p.z, size * 1.4, size * 0.8, size * 1.2, this.R(0, 6.28)); }
  watchtower(p) {
    const b = new GeoBuilder(), wood = [0.42, 0.32, 0.2];
    for (const [a, c] of [[1, 1], [-1, 1], [1, -1], [-1, -1]]) b.add('box', p.x + a * 1.3, p.y + 2.5, p.z + c * 1.3, 0.25, 5.2, 0.25, wood);
    b.add('box', p.x, p.y + 4.9, p.z, 3.4, 0.25, 3.4, wood);
    for (const [a, c, w, d] of [[0, 1.6, 3.4, 0.1], [0, -1.6, 3.4, 0.1], [1.6, 0, 0.1, 3.4], [-1.6, 0, 0.1, 3.4]]) b.add('box', p.x + a, p.y + 5.5, p.z + c, w, 1, d, mulC(wood, 0.85));
    b.add('cone', p.x, p.y + 7.4, p.z, 4.6, 1.4, 4.6, [0.5, 0.42, 0.25], Math.PI / 4, 0, 0, 4);
    this.mesh(b.build());
    this.addBox(p.x, p.z, p.y - 0.3, 6.2, 1.5, 1.5, 0, 'wood', false);
  }

  // ------------------------------------------------------------ Geländetypen ----
  buildPlainsProps(d) {
    let p;
    for (let i = 0; i < 18 * d; i++) if ((p = this.tryPoint(2))) this.rock(p, this.R(1.2, 3.2));
    for (let i = 0; i < 10 * d; i++) if ((p = this.tryPoint(3))) this.sandbags(p, this.R(3, 6), this.R(-0.44, 0.44));
    for (let i = 0; i < 26 * d; i++) if ((p = this.tryPoint(2.5))) { if (this.rng.chance(0.5)) this.palm(p, this.R(0.8, 1.2)); else this.tree(p, this.R(0.8, 1.3), false); }
    for (let i = 0; i < 3 * d; i++) if ((p = this.tryPoint(9))) this.building(p, [this.R(7, 10), this.R(3.5, 5), this.R(6, 9)], this.R(0, 1.57), this.rng.pick(PASTELS), TERRACOTTA);
    for (let i = 0; i < 8 * d; i++) if ((p = this.tryPoint(1.5))) this.crate(p, this.R(1, 1.6));
    for (let i = 0; i < 3 * d; i++) if ((p = this.tryPoint(4))) this.wreck(p);
    for (let i = 0; i < 20 * d; i++) if ((p = this.tryPoint(1))) this.bush(p, this.R(1, 2), false);
  }
  buildJungle() {
    let p;
    for (let i = 0; i < 170; i++) if ((p = this.tryPoint(2.2))) this.jungleTree(p, this.R(0.8, 1.4));
    for (let i = 0; i < 45; i++) if ((p = this.tryPoint(1.8))) this.palm(p, this.R(0.8, 1.2));
    for (let i = 0; i < 90; i++) if ((p = this.tryPoint(0.8))) this.bush(p, this.R(1.2, 2.6), true);
    for (let i = 0; i < 20; i++) if ((p = this.tryPoint(2.5))) {
      const yaw = this.R(0, 3.14);
      this.queue('log', p.x, p.y + 0.4, p.z, 0.8, 5, 0.8, yaw, Math.PI / 2);
      const ax = Math.sin(yaw), az = Math.cos(yaw);
      this.addBox(p.x, p.z, p.y - 0.3, 1.1, 0.4, 2.5, yaw, 'wood', false);
      for (let k = -1; k <= 1; k++) this.addRoundCover(p.x + ax * k * 1.8, p.z + az * k * 1.8, 0.5, true, 4);
    }
    for (let i = 0; i < 14; i++) if ((p = this.tryPoint(2))) this.rock(p, this.R(1.2, 2.6));
    for (let i = 0; i < 2; i++) if ((p = this.tryPoint(7))) this.building(p, [5, 3, 5], this.R(0, 1.57), [0.6, 0.45, 0.3], [0.5, 0.42, 0.25]);
  }
  buildForest() {
    let p;
    for (let i = 0; i < 150; i++) if ((p = this.tryPoint(2))) this.tree(p, this.R(0.9, 1.5), this.rng.chance(0.6));
    for (let i = 0; i < 16; i++) if ((p = this.tryPoint(2))) this.rock(p, this.R(1.2, 2.6));
    for (let i = 0; i < 40; i++) if ((p = this.tryPoint(0.8))) this.bush(p, this.R(1, 2), true);
    for (let i = 0; i < 6; i++) if ((p = this.tryPoint(3))) this.sandbags(p, this.R(3, 5), this.R(-0.5, 0.5));
  }
  buildDesert() {
    let p;
    for (let i = 0; i < 30; i++) if ((p = this.tryPoint(2.5))) this.rock(p, this.R(1.5, 4));
    for (let i = 0; i < 7; i++) if ((p = this.tryPoint(6))) {
      const yaw = this.R(0, 3.14);
      this.wall(p, this.R(5, 9), this.R(2, 3.4), yaw, [0.75, 0.66, 0.5]);
      const q = this.onGround(p.x + Math.cos(yaw) * 3 + Math.sin(yaw) * 3, p.z - Math.sin(yaw) * 3 + Math.cos(yaw) * 3);
      this.wall(q, this.R(3, 5), this.R(1.2, 2.2), yaw + Math.PI / 2, [0.72, 0.63, 0.48]);
    }
    for (let i = 0; i < 5; i++) if ((p = this.tryPoint(4))) this.wreck(p);
    for (let i = 0; i < 8; i++) if ((p = this.tryPoint(3))) this.sandbags(p, this.R(3, 6), this.R(-0.5, 0.5));
    for (let i = 0; i < 14; i++) if ((p = this.tryPoint(0.6))) this.queue('cactus', p.x, p.y, p.z, 0.4, 2.4, 0.4, this.R(0, 6.28));
    if ((p = this.tryPoint(6))) this.watchtower(p);
  }
  buildTown() {
    const h = this.half;
    for (let bx = -h + 40; bx < h - 30; bx += 32) for (let bz = -h + 70; bz < h - 60; bz += 32) {
      if (Math.abs(bx) < 20 && Math.abs(bz) < 20) continue;
      if (this.distToPath(bx, bz) < 14) continue;
      const houses = this.rng.int(2, 4);
      for (let k = 0; k < houses; k++) {
        const x = bx + this.R(-7, 7), z = bz + this.R(-7, 7);
        if (!this.free(x, z, 5)) continue;
        this.blockers.push([x, z, 6]);
        this.building(this.onGround(x, z), [this.R(7, 11), this.R(4, 9), this.R(7, 10)], this.rng.int(0, 2) * Math.PI / 2, this.rng.pick(PASTELS), TERRACOTTA);
      }
    }
    this.building(this.onGround(0, 6), [10, 8, 16], 0, [0.95, 0.93, 0.86], TERRACOTTA);
    const t = this.onGround(0, -4), b = new GeoBuilder();
    b.add('box', t.x, t.y + 6.7, t.z, 4, 14, 4, [0.95, 0.93, 0.86]);
    b.add('cone', t.x, t.y + 14.8, t.z, 4.4, 2.2, 4.4, TERRACOTTA, Math.PI / 4, 0, 0, 4);
    this.mesh(b.build());
    this.addBox(t.x, t.z, t.y - 0.5, 14.5, 2, 2, 0, 'stone', false);
    this.blockers.push([0, 2, 14]);
    let p;
    for (let i = 0; i < 9; i++) if ((p = this.tryPoint(4))) this.wreck(p);
    for (let i = 0; i < 10; i++) if ((p = this.tryPoint(3))) this.sandbags(p, this.R(3, 6), this.rng.int(0, 2) * Math.PI / 2);
    for (let i = 0; i < 12; i++) if ((p = this.tryPoint(1.5))) this.crate(p, this.R(1, 1.5));
    for (let i = 0; i < 12; i++) if ((p = this.tryPoint(2))) this.palm(p, this.R(0.8, 1.1));
  }
  buildHills() {
    let p;
    for (let i = 0; i < 45; i++) if ((p = this.tryPoint(3))) this.rock(p, this.R(1.5, 4.5));
    for (let i = 0; i < 40; i++) if ((p = this.tryPoint(2))) this.tree(p, this.R(0.8, 1.4), this.rng.chance(0.5));
    for (let i = 0; i < 8; i++) if ((p = this.tryPoint(3))) this.sandbags(p, this.R(3, 6), this.R(0, 3.14));
  }
  buildBeach() {
    let p;
    for (let i = 0; i < 45; i++) if ((p = this.tryPoint(2))) this.palm(p, this.R(0.8, 1.3));
    for (let i = 0; i < 10; i++) if ((p = this.tryPoint(2.5))) this.rock(p, this.R(1.2, 3));
    for (let i = 0; i < 4; i++) if ((p = this.tryPoint(6))) this.building(p, [5, 3, 4], this.R(0, 1.57), this.rng.pick(PASTELS), [0.75, 0.62, 0.4]);
    for (let i = 0; i < 8; i++) if ((p = this.tryPoint(3))) this.sandbags(p, this.R(3, 6), this.R(-0.5, 0.5));
    for (let i = 0; i < 2; i++) if ((p = this.tryPoint(4))) this.wreck(p);
    for (let i = 0; i < 3; i++) {
      const g = M.ship(false, i + 3);
      const x = this.seaStartX + this.R(14, 30), z = this.R(-this.half + 30, this.half - 30);
      g.position.set(x, Math.max(-0.4, this.ground(x, z)), z);
      g.rotation.y = this.R(0, 6.28);
      g.scale.setScalar(1.6);
      this.group.add(g);
    }
  }
  buildFarmland() {
    for (let f = 0; f < 6; f++) {
      const fx = this.R(-this.half + 40, this.half - 40), fz = this.R(-this.half + 60, this.half - 60);
      if (!this.free(fx, fz, 14)) continue;
      this.blockers.push([fx, fz, 12]);
      const yaw = this.rng.int(0, 2) * Math.PI / 2, kind = this.rng.chance(0.5) ? 'cropG' : 'cropY';
      for (let r = -5; r <= 5; r++) {
        const ox = Math.cos(yaw) * r * 2.2, oz = -Math.sin(yaw) * r * 2.2;
        const p = this.onGround(fx + ox, fz + oz);
        this.queue(kind, p.x, p.y + 0.5, p.z, 0.8, 1, 22, yaw);

  findPath(from, to, veh) {

      const prot = (c.dx * tx + c.dz * tz) / Math.max(0.01, td);

      const score = prot * 10 - Math.hypot(from.x - c.x, from.z - c.z) * 0.35 + (c.low ? 1.5 : 0);

  // ========================================================== Aufstellung ====
  spawnPoint(team, index) {

  }
  vehicleSpawnPoint(team, index) {

  dispose() {
    if (this.group.parent) this.group.parent.remove(this.group);
    for (const d of this.disposables) try { d.dispose(); } catch (e) { /* egal */ }

  }
}

    const fx = tp.x - s.pos.x, fz = tp.z - s.pos.z;
    if (fx * fx + fz * fz > 0.01 && Math.abs(angleDelta(s.yaw, Math.atan2(fx, fz))) > 25 * DEG) return;
    this.burstT -= dt;
    if (this.firing) {
      w.fireOnce();
      if (this.burstT <= 0) { this.firing = false; this.burstT = (0.35 + Math.random() * 0.55) * (w.def.fireMode === 'Semi' ? 1.4 : 1); }
    } else if (this.burstT <= 0) { this.firing = true; this.burstT = w.def.fireMode === 'Auto' ? 0.25 + Math.random() * 0.45 : 0.02; }
  }
  faceTowards(p, dt) {
    const s = this.s, fx = p.x - s.pos.x, fz = p.z - s.pos.z;
    if (fx * fx + fz * fz > 0.01) s.yaw = rotateTowards(s.yaw, Math.atan2(fx, fz), 7 * dt);
    const eye = s.eye(Battle._a7), horiz = Math.hypot(p.x - eye.x, p.z - eye.z);
    s.pitch = Math.atan2(p.y - eye.y, Math.max(0.1, horiz)) / DEG;
  }

  // -------------------------------------------------------------- Bewegung ----
  moveTo(p, run) {
    this.run = run;
    if (this.goal && Math.hypot(this.goal.x - p.x, this.goal.z - p.z) < 1.2 && (this.path.length || this.wantPath)) { this.moving = true; return; }
    this.goal = { x: p.x, z: p.z };
    this.requestPath();
    this.moving = true;
  }
  requestPath() {
    if (Battle.pathBudget <= 0) { this.wantPath = true; this.path = []; return; }
    Battle.pathBudget--;
    this.wantPath = false;
    this.path = Battle.field.findPath(this.s.pos, this.goal, false);
    this.pathIdx = 0;
    if (!this.path.length) this.moving = false;
  }
  stop() { this.moving = false; this.path = []; this.goal = null; this.wantPath = false; }
  arrived(tol) { return !this.goal || Math.hypot(this.s.pos.x - this.goal.x, this.s.pos.z - this.goal.z) <= tol; }
  get inCover() { return !!(this.cover && Math.hypot(this.s.pos.x - this.cover.x, this.s.pos.z - this.cover.z) < 1.3); }
  seekCover(threat, center, radius) {
    const c = Battle.field.findCover(center, radius, threat, this.s, 4, 220);
    if (!c) return false;
    if (c !== this.cover) { this.releaseCover(); this.cover = c; c.occ = this.s; }
    this.moveTo(c, true);

  }
  releaseCover() { if (this.cover && this.cover.occ === this.s) this.cover.occ = null; this.cover = null; }
  move(dt) {
    const s = this.s;
    if (this.wantPath && this.goal) this.requestPath();
    if (!this.moving || !this.goal) { s.speed = moveTowards(s.speed, 0, dt * 12); return; }
    let wp = this.path.length ? this.path[Math.min(this.pathIdx, this.path.length - 1)] : this.goal;
    while (this.path.length && this.pathIdx < this.path.length - 1 && Math.hypot(wp.x - s.pos.x, wp.z - s.pos.z) < 0.9) wp = this.path[++this.pathIdx];
    const dx = wp.x - s.pos.x, dz = wp.z - s.pos.z, d = Math.hypot(dx, dz);
    const last = !this.path.length || this.pathIdx >= this.path.length - 1;
    if (last && d < 0.6) { this.moving = false; s.speed = 0; return; }
    const speed = (this.run ? 5.6 : 3.4) * (s.crouch ? 0.6 : 1);

    const step = Math.min(d, s.speed * dt);
    s.pos.x += dx / d * step; s.pos.z += dz / d * step;

    if (!this.visible) s.yaw = rotateTowards(s.yaw, Math.atan2(dx, dz), 9 * dt);

    this.stuckT += dt;
    if (this.stuckT > 1.4) {
      if (s.pos.distanceTo(this.lastPos) < 0.6) { this.requestPath(); if (this.path.length > 1) this.pathIdx = 1; }
