    this.scene.add(terrain);
    this.terrain = terrain;
  },

  buildWater() {
    const m = this.map;
    const c = document.createElement('canvas'); c.width = m.W; c.height = m.H;
    const ctx = c.getContext('2d'), img = ctx.createImageData(m.W, m.H);
    for (let y = 0; y < m.H; y++) for (let x = 0; x < m.W; x++) {
      const i = y * m.W + x, o = ((m.H - 1 - y) * m.W + x) * 4;
      for (let k = 0; k < 4; k++) img.data[o + k] = m.waterColors[i * 4 + k];
    }
    ctx.putImageData(img, 0, 0);
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    const EXT = 5000;
    const g = new THREE.PlaneGeometry(m.MW + 2 * EXT, m.MH + 2 * EXT, 1, 1);
    g.rotateX(-Math.PI / 2);
    g.translate(m.MW / 2, WATER, -m.MH / 2);
    const uv = g.attributes.uv, p = g.attributes.position;
    for (let i = 0; i < uv.count; i++) uv.setXY(i, p.getX(i) / m.MW, -p.getZ(i) / m.MH);
    const mat = new THREE.MeshPhongMaterial({ map: tex, shininess: 90, specular: 0x557788 });
    this.waterUniforms = { time: { value: 0 } };
    mat.onBeforeCompile = sh => {
      sh.uniforms.time = this.waterUniforms.time;
      sh.vertexShader = 'varying vec3 vWPos;\n' + sh.vertexShader.replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\n vWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
      sh.fragmentShader = 'uniform float time;\nvarying vec3 vWPos;\n' + sh.fragmentShader.replace('#include <map_fragment>',
        '#include <map_fragment>\n float wv = sin(vWPos.x * 0.09 + time * 1.1) * sin(vWPos.z * 0.075 - time * 0.8) + 0.5 * sin((vWPos.x + vWPos.z) * 0.21 + time * 1.7);\n diffuseColor.rgb *= 0.96 + 0.05 * wv;');
    };
    const water = new THREE.Mesh(g, mat);
    water.receiveShadow = true;
    this.scene.add(water);
    this.water = water;
  },

  buildVegetation() {
    const V = this.map.veg, scene = this.scene, d = new THREE.Object3D();
    const inst = (geom, color, list, fn, shadow = true) => {
      if (!list.length) return;
      const mesh = new THREE.InstancedMesh(geom, new THREE.MeshLambertMaterial({ color }), list.length);
      list.forEach((e, i) => { fn(e); d.updateMatrix(); mesh.setMatrixAt(i, d.matrix); });
      mesh.castShadow = shadow; mesh.receiveShadow = true;
      scene.add(mesh);
    };
    const bc = M.bicone();
    const jA = V.jungle.filter((_, i) => i % 2 === 0), jB = V.jungle.filter((_, i) => i % 2 === 1);
    const setTree = e => { d.position.copy(V3(e[0], e[1] + 3.2 * e[3], e[2])); d.rotation.set(0, e[4], 0); d.scale.set(3.4 * e[3], 2.6 * e[3], 3.4 * e[3]); };
    inst(bc, 0x174d1c, jA, setTree); inst(bc, 0x26662a, jB, setTree);
    const trunkJ = new THREE.CylinderGeometry(0.5, 0.5, 1, 5); trunkJ.translate(0, 0.5, 0);
    inst(trunkJ, 0x5a4128, V.jungle.filter((_, i) => i % 3 === 0), e => { d.position.copy(V3(e[0], e[1], e[2])); d.rotation.set(0, 0, 0); d.scale.set(0.5 * e[3], 2.4 * e[3], 0.5 * e[3]); }, false);
    // Urwaldriesen: hohe, breite Kronen über dem Blätterdach
    if (V.giant && V.giant.length) {
      inst(bc, 0x2e7a26, V.giant, e => { d.position.copy(V3(e[0], e[1] + 6.4 * e[3], e[2])); d.rotation.set(0, e[4], 0); d.scale.set(5.2 * e[3], 3.0 * e[3], 5.2 * e[3]); });
      inst(trunkJ, 0x6b5034, V.giant, e => { d.position.copy(V3(e[0], e[1], e[2])); d.rotation.set(0, 0, 0); d.scale.set(0.7 * e[3], 5.6 * e[3], 0.7 * e[3]); }, false);
    }
    const pineG = new THREE.ConeGeometry(1, 1, 7); pineG.translate(0, 0.5, 0);
    inst(pineG, 0x1f4d26, V.pine, e => { d.position.copy(V3(e[0], e[1], e[2])); d.rotation.set(0, e[4], 0); d.scale.set(2.2 * e[3], 7.5 * e[3], 2.2 * e[3]); });
    const trunkG = new THREE.ConeGeometry(1, 1, 5); trunkG.translate(0, 0.5, 0);
    inst(trunkG, 0x735638, V.palm, e => { d.position.copy(V3(e[0], e[1], e[2])); d.rotation.set(0.08, e[4], 0); d.scale.set(0.35 * e[3], 5.2 * e[3], 0.35 * e[3]); });
    inst(M.palmCrown(), 0x38852e, V.palm, e => { d.position.copy(V3(e[0], e[1] + 5 * e[3], e[2])); d.rotation.set(0, e[4], 0); d.scale.setScalar(2.8 * e[3]); });
    if (V.jpalm && V.jpalm.length) {   // Dschungelpalmen: höher, sattgrün
      inst(trunkG, 0x5e4a30, V.jpalm, e => { d.position.copy(V3(e[0], e[1], e[2])); d.rotation.set(0.12, e[4], 0); d.scale.set(0.4 * e[3], 7 * e[3], 0.4 * e[3]); });
      inst(M.palmCrown(), 0x2f9a3a, V.jpalm, e => { d.position.copy(V3(e[0], e[1] + 6.8 * e[3], e[2])); d.rotation.set(0, e[4], 0); d.scale.setScalar(3.4 * e[3]); });
    }
    const cactusG = new THREE.BoxGeometry(0.4, 1, 0.4); cactusG.translate(0, 0.5, 0);
    inst(cactusG, 0x4d8040, V.cactus, e => { d.position.copy(V3(e[0], e[1], e[2])); d.rotation.set(0, e[4], 0); d.scale.set(e[3], 2.4 * e[3], e[3]); });
    inst(new THREE.OctahedronGeometry(1, 0), 0x7a7066, V.rock, e => { d.position.copy(V3(e[0], e[1] + 0.4 * e[3], e[2])); d.rotation.set(0.3, e[4], 0.2); d.scale.set(2.2 * e[3], 1.4 * e[3], 1.8 * e[3]); });
  },

  buildTowns(s) {
    for (const t of s.towns) {
      const def = LAYOUT.findTown(t.id);
      const o = M.town(t.visual, t.type, DB.factionColor(t.owner), Math.floor(t.pos.x * 13 + t.pos.z * 7) + 1);
      o.group.scale.setScalar(2.6);
      o.group.position.copy(V3(t.pos.x, this.map.surfaceHeight(t.pos.x, t.pos.z), t.pos.z));
      o.group.rotation.y = (def ? def.x * 9 : 0) % (Math.PI * 2);
      this.scene.add(o.group);
      this.townObjs[t.id] = o;
      this.labels['t_' + t.id] = UI.mapLabel(t.name, 'town', DB.factionColor(t.owner), { kind: 'town', id: t.id });
    }
  },
  refreshTown(t) {
    const o = this.townObjs[t.id];
    if (o) o.flag.material.color.setHex(M.hex(DB.factionColor(t.owner)));
    const l = this.labels['t_' + t.id];
    if (l) l.setFaction(t.owner);
    this.provDirty = true;
  },
  /** Provinzen zeichnen: Grundton + Schimmer an den Grenzen in Fraktionsfarbe, Linien zwischen Provinzen. */
  drawProvinces(s) {
    const m = this.map;
    if (!m.prov || !this.provCanvas) return;
    const c = this.provCanvas, ctx = c.getContext('2d'), TW = c.width, TH = c.height;
    ctx.clearRect(0, 0, TW, TH);
    const g = this.provGlow || (this.provGlow = document.createElement('canvas'));
    g.width = m.W; g.height = m.H;
    const gc = g.getContext('2d'), img = gc.createImageData(m.W, m.H), d8 = img.data;
    const cols = LAYOUT.towns.map(def => { const t = GS.town(s, def.id); return t ? DB.factionColor(t.owner) : null; });
    for (let y = 0; y < m.H; y++) for (let x = 0; x < m.W; x++) {
      const i = y * m.W + x, p = m.prov[i];
      if (p < 0 || !cols[p]) continue;
      const o = ((m.H - 1 - y) * m.W + x) * 4, c3 = cols[p], bd = m.provBorderDist[i];
      d8[o] = c3[0] * 255; d8[o + 1] = c3[1] * 255; d8[o + 2] = c3[2] * 255;
      d8[o + 3] = (0.1 + 0.45 * Math.max(0, 1 - bd / 4.5)) * 255;
    }
    gc.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(g, 0, 0, TW, TH);
    const sx = TW / m.MW, sy = TH / m.MH;
    const path = (cx, l, kx, ky) => { cx.beginPath(); l.world.forEach(([x, z], k) => { const px = x * kx, py = (m.MH - z) * ky; if (k) cx.lineTo(px, py); else cx.moveTo(px, py); }); };
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const l of m.provLines) {
      const ta = GS.town(s, LAYOUT.towns[l.a].id), tb = GS.town(s, LAYOUT.towns[l.b].id);
      path(ctx, l, sx, sy);
      if (ta && tb && ta.owner !== tb.owner) {
        ctx.setLineDash([]);
        ctx.lineWidth = 4.6; ctx.strokeStyle = 'rgba(14,10,6,0.6)'; ctx.stroke();
        ctx.lineWidth = 1.7; ctx.strokeStyle = 'rgba(255,238,200,0.9)'; ctx.stroke();
      } else {
        ctx.setLineDash([6, 6]);
        ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(25,18,10,0.5)'; ctx.stroke();
      }
    }
    ctx.setLineDash([]);
    this.provTex.needsUpdate = true;
    // Minikarte
    const mc = this.provMini.getContext('2d'), MWp = this.provMini.width, MHp = this.provMini.height;
    mc.clearRect(0, 0, MWp, MHp);
    mc.imageSmoothingEnabled = true;
    mc.globalAlpha = 0.85; mc.drawImage(g, 0, 0, MWp, MHp); mc.globalAlpha = 1;
    mc.lineCap = 'round'; mc.lineJoin = 'round';
    for (const l of m.provLines) {
      const ta = GS.town(s, LAYOUT.towns[l.a].id), tb = GS.town(s, LAYOUT.towns[l.b].id);
      if (!ta || !tb || ta.owner === tb.owner) continue;
      path(mc, l, MWp / m.MW, MHp / m.MH);
      mc.lineWidth = 1.6; mc.strokeStyle = 'rgba(10,8,6,0.75)'; mc.stroke();
    }
  },
  buildHideouts(s) {
    for (const h of s.hideouts) {
      const g = M.hideout();
      g.scale.setScalar(2.2);
      g.position.copy(V3(h.pos.x, this.map.surfaceHeight(h.pos.x, h.pos.z), h.pos.z));
      this.scene.add(g);
      this.hideoutObjs[h.id] = g;
      this.labels['h_' + h.id] = UI.mapLabel(h.name, 'hideout', [0.1, 0.1, 0.1], { kind: 'hideout', id: h.id });
    }
  },
  buildShips() {
    this.ships = [];
    LAYOUT.ships.forEach((s, i) => {
      const g = M.ship(i % 2 === 0, i * 37 + 5);
      g.scale.setScalar(3);
      g.position.copy(V3(s[0] * this.map.MW, WATER, s[1] * this.map.MH));
      g.rotation.y = i * 1.7;
      this.scene.add(g);
      this.ships.push(g);
    });
  },
  buildVolcano() {
    const v = this.map.volcanoPos, h = this.map.heightAt(v.x, v.z);
    const lava = new THREE.Mesh(new THREE.CylinderGeometry(7, 7, 1, 20), M.basic(0xff5a1a));
    lava.position.copy(V3(v.x, h + 0.6, v.z));
    this.scene.add(lava);
    const light = new THREE.PointLight(0xff7326, 2.2, 90);
    light.position.copy(V3(v.x, h + 8, v.z));
    this.scene.add(light);
    this.volcanoTop = V3(v.x, h + 4, v.z);
    this.smokeTimer = 0;
  },

  // ---------------------------------------------------------------- Laufzeit ----
  syncParties(s, playerPos, timeRunning, dt) {
    const seen = new Set();
    for (const p of s.parties) {
      seen.add(p.id);
      let mk = this.partyMarkers.get(p.id);
      const motor = Campaign.motorized(p);
      if (!mk || mk.motorized !== motor || mk.faction !== p.faction) {
        if (mk) { this.scene.remove(mk.group); }
        const f = M.partyFigure(DB.factionColor(p.faction), motor, false);
        f.group.scale.setScalar(2.6);
        this.scene.add(f.group);
        mk = Object.assign(f, { motorized: motor, faction: p.faction, anim: 0, last: null, id: p.id, base: 2.6 });
        this.partyMarkers.set(p.id, mk);
      }
      const vis = Campaign.visibleToPlayer(s, p, playerPos);
      mk.group.visible = vis;
      mk.visible = vis;
      if (!vis) continue;
      this.placeMarker(mk, p.pos, timeRunning && p.order !== 'Idle', dt);
    }
    for (const [id, mk] of this.partyMarkers) if (!seen.has(id)) { this.scene.remove(mk.group); this.partyMarkers.delete(id); }
  },
  placeMarker(mk, pos, moving, dt) {
    const y = this.map.surfaceHeight(pos.x, pos.z);
    if (mk.last) {
      const dx = pos.x - mk.last.x, dz = pos.z - mk.last.z;
      if (dx * dx + dz * dz > 0.0004) {
        const target = Math.atan2(dx, -dz) + Math.PI; // Blick in Laufrichtung (three: -z = Norden)
        mk.group.rotation.y = rotateTowards(mk.group.rotation.y, target, dt * 6);
      }
    }
    mk.last = { x: pos.x, z: pos.z };
    mk.group.position.copy(V3(pos.x, y, pos.z));
    mk.group.scale.setScalar((mk.base || 2.6) * clamp(MapCam.distance / 115, 1, 3.4));
    if (moving) mk.anim += dt * (mk.motorized ? 18 : 10);
    mk.figure.position.y = moving ? Math.abs(Math.sin(mk.anim)) * (mk.motorized ? 0.06 : 0.18) : 0;
  },
  updatePlayer(pos, motorized, moving, dt) {
    let pm = this.playerMarker;
    if (pm.motorized !== motorized) {
      this.scene.remove(pm.group);
      const f = M.partyFigure(DB.factionColor(DB.PLAYER), motorized, true);
      f.group.scale.setScalar(3);
      this.scene.add(f.group);
      pm = this.playerMarker = Object.assign(f, { motorized, anim: 0, last: pm.last, base: 3 });
    }
    this.placeMarker(pm, pos, moving, dt);
  },
  showFlag(pos) {
    if (!pos) { this.flag.visible = false; return; }
    this.flag.visible = true;
    this.flag.position.copy(V3(pos.x, this.map.surfaceHeight(pos.x, pos.z), pos.z));
  },

  update(dt, s, renderer) {
    this.time += dt;
    if (this.provDirty && s) { this.provDirty = false; this.drawProvinces(s); }
    if (this.waterUniforms) this.waterUniforms.time.value = this.time;
    this.lightTimer -= dt;
    if (this.lightTimer <= 0) { this.lightTimer = 0.25; Lighting.apply(this.env, GS.hour(s), 0.55); this.shadowDirty = true; }
    // Schiffe schaukeln
    if (this.ships) this.ships.forEach((g, i) => { g.position.y = WATER + Math.sin(this.time * 0.9 + i) * 0.15; g.rotation.z = Math.sin(this.time * 0.7 + i * 2) * 0.03; });
    // Vulkanrauch
    this.smokeTimer -= dt;
    if (this.smokeTimer <= 0) {
      this.smokeTimer = 0.45;
      let sp = this.smoke.find(p => !p.alive);
      if (!sp) {
        const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: this.smokeTex, color: 0x5e5a58, transparent: true, depthWrite: false, opacity: 0.5 }));
        this.scene.add(spr);
        sp = { spr };
        this.smoke.push(sp);
      }
      sp.alive = true; sp.age = 0; sp.life = 9;
      sp.spr.position.copy(this.volcanoTop).add(new THREE.Vector3((Math.random() - 0.5) * 8, 0, (Math.random() - 0.5) * 8));
      sp.spr.visible = true;
    }
    for (const p of this.smoke) {
      if (!p.alive) continue;
      p.age += dt;
      const t = p.age / p.life;
      if (t >= 1) { p.alive = false; p.spr.visible = false; continue; }
      p.spr.position.x += 2.5 * dt; p.spr.position.y += 9 * dt; p.spr.position.z -= 1.2 * dt;
      const sc = lerp(16, 55, t);
      p.spr.scale.set(sc, sc, 1);
      p.spr.material.opacity = 0.55 * (1 - t) * Math.min(1, p.age * 2);
    }
    // Schatten folgen der Kamera
    const tgt = MapCam.target;
    const sz = clamp(MapCam.distance * 0.85, 90, 650);
    const sun = this.env.sun;
    const center = V3(tgt.x, this.map.surfaceHeight(tgt.x, tgt.z), tgt.z);
    sun.target.position.copy(center);
    sun.position.copy(center).addScaledVector(this.env.sunDir, 900);
    const sc = sun.shadow.camera;
    if (sc.right !== sz) { sc.left = -sz; sc.right = sz; sc.top = sz; sc.bottom = -sz; sc.near = 10; sc.far = 2200; sc.updateProjectionMatrix(); this.shadowDirty = true; }
    if (!this.lastShadowTarget || Math.hypot(tgt.x - this.lastShadowTarget.x, tgt.z - this.lastShadowTarget.z) > sz * 0.08) { this.shadowDirty = true; this.lastShadowTarget = { x: tgt.x, z: tgt.z }; }
    this.shadowTimer -= dt;
    if (this.shadowTimer <= 0) { this.shadowTimer = 0.25; this.shadowDirty = true; }
    if (this.shadowDirty) { renderer.shadowMap.needsUpdate = true; this.shadowDirty = false; }
  },

  /** Strahl von der Kamera auf das Gelände (Ray-Marching im Höhenfeld). */
  groundPick(ndcX, ndcY) {
    const ray = new THREE.Raycaster();
    ray.setFromCamera({ x: ndcX, y: ndcY }, this.camera);
    const o = ray.ray.origin, d = ray.ray.direction;
    let prev = 0;
    for (let t = 0; t < 9000; t += 2) {
      const x = o.x + d.x * t, y = o.y + d.y * t, z = -(o.z + d.z * t);
      if (x < -50 || z < -50 || x > this.map.MW + 50 || z > this.map.MH + 50) { if (t > 3000) break; prev = t; continue; }
      if (y <= this.map.surfaceHeight(x, z)) {
        let a = prev, b = t;
        for (let k = 0; k < 12; k++) {
          const mid = (a + b) / 2, mx = o.x + d.x * mid, my = o.y + d.y * mid, mz = -(o.z + d.z * mid);
          if (my <= this.map.surfaceHeight(mx, mz)) b = mid; else a = mid;
        }
        return { x: o.x + d.x * b, z: -(o.z + d.z * b) };
      }
      prev = t;
    }
    return null;
  },
  /** Bildschirmposition eines Kartenpunkts (CSS-Pixel). */
  project(x, y, z, w, h) {
    const v = V3(x, y, z).project(this.camera);
    return { x: (v.x * 0.5 + 0.5) * w, y: (-v.y * 0.5 + 0.5) * h, visible: v.z < 1 && v.z > -1 };
  },
};

// ===================================================================== Kamera ====
const MapCam = {
  target: { x: 700, z: 250 }, yaw: 0, distance: 190, minD: 35, maxD: 760, follow: true,
  dragging: false,
  update(dt, followPos) {
    const inp = Input;
    if (!UI.modalOpen()) {
      const w = inp.wheel();
      if (w) this.distance = clamp(this.distance * Math.pow(1.0015, w), this.minD, this.maxD);
      if (inp.down('KeyQ')) this.yaw -= 1.75 * dt;
      if (inp.down('KeyE')) this.yaw += 1.75 * dt;
      if (inp.mouse[2] && !UI.pointerOverUI) { const md = inp.mouseDeltaRaw(); this.yaw += md.x * 0.006; }
      // Ziehen mit gedrückter linker Maustaste (oder Finger) verschiebt die Karte
      const cs = typeof Overworld !== 'undefined' ? Overworld.clickStart : null;
      if (inp.mouse[0] && cs && Game.mode === 'map') {
        if (!this.dragging && Math.hypot(inp.mx - cs.x, inp.my - cs.y) > 8) { this.dragging = true; this.lastDrag = { x: inp.mx, y: inp.my }; }
        if (this.dragging) {
          const k = this.distance * 0.00185, dx = inp.mx - this.lastDrag.x, dy = inp.my - this.lastDrag.y;
          this.lastDrag = { x: inp.mx, y: inp.my };
          const fx = Math.sin(this.yaw), fz = Math.cos(this.yaw), mx = -dx * k, mz = dy * k;
          this.target.x += fx * mz + fz * mx; this.target.z += fz * mz - fx * mx;
          if (dx || dy) this.follow = false;
        }
      } else this.dragging = false;
      let mx = 0, mz = 0;
      if (inp.down('KeyW') || inp.down('ArrowUp')) mz += 1;
      if (inp.down('KeyS') || inp.down('ArrowDown')) mz -= 1;
      if (inp.down('KeyA') || inp.down('ArrowLeft')) mx -= 1;
      if (inp.down('KeyD') || inp.down('ArrowRight')) mx += 1;
      if (mx || mz) {
        this.follow = false;
        const sp = 120 * (this.distance / 190) * dt;
        const fx = Math.sin(this.yaw), fz = Math.cos(this.yaw);
        this.target.x += (fx * mz + fz * mx) * sp;
        this.target.z += (fz * mz - fx * mx) * sp;
      }
      if (inp.pressed('Space')) this.follow = true;
    }
    if (this.follow && followPos) {
      const k = 1 - Math.exp(-8 * dt);
      this.target.x = lerp(this.target.x, followPos.x, k);
      this.target.z = lerp(this.target.z, followPos.z, k);
    }
    this.target.x = clamp(this.target.x, 0, World.map.MW);
    this.target.z = clamp(this.target.z, 0, World.map.MH);
    const pitch = lerp(32, 62, invLerp(this.minD, this.maxD, this.distance)) * DEG;
    const ty = World.map.surfaceHeight(this.target.x, this.target.z);
    const hz = Math.cos(pitch) * this.distance;
    const cx = this.target.x - Math.sin(this.yaw) * hz, cz = this.target.z - Math.cos(this.yaw) * hz;
    let cy = ty + Math.sin(pitch) * this.distance;
    cy = Math.max(cy, World.map.surfaceHeight(cx, cz) + 8);
    World.camera.position.copy(V3(cx, cy, cz));
    World.camera.lookAt(V3(this.target.x, ty, this.target.z));
  },
  focus(pos) { this.target.x = pos.x; this.target.z = pos.z; },
};

// ===== input.js =====
// ===================================================================================
//  input.js – Tastatur, Maus, Mausrad, Pointer-Lock (mit Rückfallmodus) und
//  Touch auf der Karte (Tippen, Ziehen, zwei Finger zoomen/drehen).
//  Die Touch-Steuerung im Gefecht liegt in touch.js und schreibt hier hinein
//  (touchAxis, Blick-Deltas, Tasten).
// ===================================================================================
'use strict';

const Input = {
  keys: new Set(), pressedSet: new Set(), releasedSet: new Set(),
  mouse: [false, false, false], mousePressedArr: [false, false, false], mouseReleasedArr: [false, false, false],
  mx: 0, my: 0, accDx: 0, accDy: 0, fdx: 0, fdy: 0, accWheel: 0, fWheel: 0,
  locked: false, lockFailed: false, canvas: null, lastMove: null, inWindow: false,
  touchAxis: null, accLookX: 0, accLookY: 0, lookX: 0, lookY: 0, pinch: null, touchClick: false,
  GAME_KEYS: new Set(['F1', 'F2', 'F3', 'F4', 'Tab', 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']),

  init(canvas) {
    this.canvas = canvas;
    const typing = e => { const t = e.target; return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable); };
    window.addEventListener('keydown', e => {
      if (typing(e)) return;
      if (this.GAME_KEYS.has(e.code) || (e.code.startsWith('F') && e.code.length <= 3 && e.code !== 'F11' && e.code !== 'F12' && e.code !== 'F5')) e.preventDefault();
      if (!this.keys.has(e.code)) this.pressedSet.add(e.code);
      this.keys.add(e.code);
    });
    window.addEventListener('keyup', e => { this.keys.delete(e.code); this.releasedSet.add(e.code); });
    window.addEventListener('blur', () => { this.keys.clear(); this.mouse = [false, false, false]; });
    canvas.addEventListener('mousedown', e => {
      if (e.button > 2) return;
      this.mouse[e.button] = true; this.mousePressedArr[e.button] = true;
      if (typeof Game !== 'undefined' && Game.wantsPointerLock && Game.wantsPointerLock()) this.requestLock();
    });
    window.addEventListener('mouseup', e => { if (e.button > 2) return; this.mouse[e.button] = false; this.mouseReleasedArr[e.button] = true; });
    document.addEventListener('mouseleave', () => { this.inWindow = false; });
    window.addEventListener('mouseout', e => { if (!e.relatedTarget) this.inWindow = false; });
    window.addEventListener('mousemove', e => {
      this.inWindow = true;
      this.mx = e.clientX; this.my = e.clientY;
      if (this.locked) { this.accDx += e.movementX || 0; this.accDy += e.movementY || 0; }
      else if (this.lastMove) { this.accDx += e.clientX - this.lastMove[0]; this.accDy += e.clientY - this.lastMove[1]; }
      this.lastMove = [e.clientX, e.clientY];
    });
    canvas.addEventListener('wheel', e => { e.preventDefault(); this.accWheel += e.deltaY * (e.deltaMode === 1 ? 33 : 1); }, { passive: false });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('pointerlockchange', () => { this.locked = document.pointerLockElement === canvas; });
    document.addEventListener('pointerlockerror', () => { this.lockFailed = true; this.locked = false; });
    // Touch auf Karte und Hauptmenü (im Gefecht übernimmt touch.js)
    const opt = { passive: false };
    canvas.addEventListener('touchstart', e => this.onMapTouch(e, 'start'), opt);
    canvas.addEventListener('touchmove', e => this.onMapTouch(e, 'move'), opt);
    canvas.addEventListener('touchend', e => this.onMapTouch(e, 'end'), opt);
    canvas.addEventListener('touchcancel', e => this.onMapTouch(e, 'end'), opt);
  },
  onMapTouch(e, phase) {
    if (typeof Game !== 'undefined' && Game.mode === 'battle') return;
    e.preventDefault();
    const ts = e.touches;
    const two = () => {
      const a = ts[0], b = ts[1];
      return { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), a: Math.atan2(b.clientY - a.clientY, b.clientX - a.clientX) };
    };
    if (phase === 'start') {
      this.inWindow = true;
      if (typeof UI !== 'undefined') UI.pointerOverUI = false;
      if (ts.length === 1) {
        const t = ts[0];
        this.mx = t.clientX; this.my = t.clientY; this.lastMove = [t.clientX, t.clientY];
        this.mouse[0] = true; this.mousePressedArr[0] = true; this.pinch = null; this.touchClick = true;
      } else if (ts.length >= 2) {
        // Zwei Finger: zoomen und drehen, keinen Marschbefehl auslösen
        this.mouse[0] = false; this.touchClick = false;
        if (typeof Overworld !== 'undefined') Overworld.clickStart = null;
        if (typeof MapCam !== 'undefined') { MapCam.dragging = false; const g = two(); this.pinch = { d0: Math.max(10, g.d), a0: g.a, dist0: MapCam.distance, yaw0: MapCam.yaw }; }
      }
    } else if (phase === 'move') {
      if (this.pinch && ts.length >= 2) {
        const g = two();
        MapCam.distance = clamp(this.pinch.dist0 * this.pinch.d0 / Math.max(10, g.d), MapCam.minD, MapCam.maxD);
        MapCam.yaw = this.pinch.yaw0 - angleDelta(this.pinch.a0, g.a);
      } else if (ts.length === 1 && !this.pinch) { this.mx = ts[0].clientX; this.my = ts[0].clientY; }
    } else if (ts.length === 0) {
      if (this.mouse[0]) { this.mouse[0] = false; if (this.touchClick) this.mouseReleasedArr[0] = true; }
      this.pinch = null; this.touchClick = false;
    }
  },
  requestLock() {
    if (this.locked || this.lockFailed || !this.canvas.requestPointerLock) return;
    try {
      const r = this.canvas.requestPointerLock();
      if (r && r.catch) r.catch(() => { this.lockFailed = true; });
    } catch (e) { this.lockFailed = true; }
  },
  exitLock() { if (document.pointerLockElement && document.exitPointerLock) document.exitPointerLock(); },
  beginFrame() {
    this.fdx = this.accDx; this.fdy = this.accDy; this.accDx = 0; this.accDy = 0;
    this.fWheel = this.accWheel; this.accWheel = 0;
    this.lookX = this.accLookX; this.lookY = this.accLookY; this.accLookX = 0; this.accLookY = 0;
  },
  endFrame() {
    this.pressedSet.clear(); this.releasedSet.clear();
    this.mousePressedArr = [false, false, false]; this.mouseReleasedArr = [false, false, false];
  },
  down: code => Input.keys.has(code),
  pressed: code => Input.pressedSet.has(code),
  released: code => Input.releasedSet.has(code),
  mousePressed: b => Input.mousePressedArr[b],
  mouseReleased: b => Input.mouseReleasedArr[b],
  mouseDeltaRaw() { return { x: this.fdx, y: this.fdy }; },
  wheel() { return this.fWheel; },
  /** Blick-Deltas der Touch-Steuerung (Pixel) für diesen Frame. */
  touchLook() { return { x: this.lookX, y: this.lookY }; },
  addLook(dx, dy) { this.accLookX += dx; this.accLookY += dy; },
  /** Bewegungsachse WASD (+ Pfeile) plus virtueller Stick. */
  moveAxis() {
    let x = 0, y = 0;
    if (this.down('KeyW') || this.down('ArrowUp')) y += 1;
    if (this.down('KeyS') || this.down('ArrowDown')) y -= 1;
    if (this.down('KeyA') || this.down('ArrowLeft')) x -= 1;
    if (this.down('KeyD') || this.down('ArrowRight')) x += 1;
    if (this.touchAxis) { x += this.touchAxis.x; y += this.touchAxis.y; }
    return { x: clamp(x, -1, 1), y: clamp(y, -1, 1) };
  },
};

// ===== audio.js =====
// ===================================================================================
//  audio.js – synthetische Klänge mit WebAudio (Port von ProceduralAudio.cs):
//  Schüsse je Waffenklasse, Explosionen, Nachladen, Treffer, Motor, Umgebung, UI.
//  Startet erst nach der ersten Nutzerinteraktion (Browser-Vorgabe).
// ===================================================================================
'use strict';

const Audio2 = {
  ctx: null, master: null, outGain: null, musicBus: null, volume: 0.7, noise: null, voices: 0, listener: { x: 0, y: 0, z: 0, yaw: 0 }, engineNode: null, amb: null,
  // Lautstärken in 30 Stufen (0–30) je Kanal, dazu Ein/Aus-Schalter und globales Stummschalten
  lvl: { master: 30, music: 24, sfx: 28 }, on: { master: true, music: true, sfx: true }, muted: false, onUnlock: [],

  init(cfg) {
    this.load(cfg);
    const unlock = () => {
      if (!this.ctx) this.create();
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => { /* egal */ });
      if (this.ctx && this.onUnlock.length) { const l = this.onUnlock; this.onUnlock = []; l.forEach(f => f()); }
      if (this.ctx && typeof Music !== 'undefined') Music.onGesture();   // jede Geste: hängende Wiedergabe erneut anstoßen (iOS)
    };

    window.addEventListener('keydown', unlock, true);
    window.addEventListener('touchend', unlock, true);
  },
  load(cfg) {
    if (!cfg || typeof cfg !== 'object') return;
    for (const k of ['master', 'music', 'sfx']) {
      if (cfg.lvl && Number.isFinite(cfg.lvl[k])) this.lvl[k] = clamp(Math.round(cfg.lvl[k]), 0, 30);
      if (cfg.on && typeof cfg.on[k] === 'boolean') this.on[k] = cfg.on[k];
    }

  },
  config() { return { lvl: { ...this.lvl }, on: { ...this.on }, muted: this.muted }; },
  /** 30 Stufen auf einer dB-Skala (1,4 dB je Stufe), 0 = aus. */
  gainFor(l) { return l <= 0 ? 0 : Math.pow(10, ((l - 30) * 1.4) / 20); },
  masterGain() { return this.muted || !this.on.master ? 0 : this.gainFor(this.lvl.master); },
  musicGain() { return this.on.music ? this.gainFor(this.lvl.music) : 0; },
  sfxGain() { return this.on.sfx ? this.gainFor(this.lvl.sfx) : 0; },
  /** Wirksame Gesamtstufe für das Lautsprecher-Symbol (0–30). */
  iconLevel() { return this.muted || !this.on.master ? 0 : this.lvl.master; },
  apply() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.outGain.gain.setTargetAtTime(this.masterGain(), t, 0.03);
    this.master.gain.setTargetAtTime(this.sfxGain(), t, 0.03);
    this.musicBus.gain.setTargetAtTime(this.musicGain(), t, 0.05);
  },
  create() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;

      this.outGain = this.ctx.createGain();      // Gesamtlautstärke
      this.master = this.ctx.createGain();       // Effekte (alle Geräusche laufen hier hinein)
      this.musicBus = this.ctx.createGain();     // Musik
      this.outGain.gain.value = this.masterGain();
      this.master.gain.value = this.sfxGain();
      this.musicBus.gain.value = this.musicGain();

      comp.threshold.value = -14; comp.ratio.value = 6; comp.attack.value = 0.002; comp.release.value = 0.2;
      this.master.connect(comp); comp.connect(this.outGain);
      this.musicBus.connect(this.outGain);
      this.outGain.connect(this.ctx.destination);
      const len = this.ctx.sampleRate;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noise.getChannelData(0);

      this.brown = this.ctx.createBuffer(1, len * 2, this.ctx.sampleRate);

      for (let i = 0; i < b.length; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; b[i] = last * 3.5; }

  },
  ok() { return !!(this.ctx && this.ctx.state === 'running') && this.on.sfx && this.lvl.sfx > 0 && this.masterGain() > 0; },
  setVolume(v) { this.setLevel('master', Math.round(clamp(v, 0, 1) * 30)); },
  setLevel(ch, l) { this.lvl[ch] = clamp(Math.round(l), 0, 30); if (this.lvl[ch] > 0 && ch !== 'master') this.on[ch] = true; if (ch === 'master' && this.lvl.master > 0) { this.on.master = true; this.muted = false; } this.apply(); this.changed(); },
  toggle(ch) { this.on[ch] = !this.on[ch]; if (this.on[ch] && this.lvl[ch] === 0) this.lvl[ch] = 15; if (ch === 'master' && this.on.master) this.muted = false; this.apply(); this.changed(); },
  setMuted(m) { this.muted = !!m; this.apply(); this.changed(); },
  changed() { if (typeof Game !== 'undefined' && Game.saveAudio) Game.saveAudio(); if (typeof AudioUI !== 'undefined') AudioUI.refresh(); if (typeof Music !== 'undefined') Music.onSettings(); },
  suspend() { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend().catch(() => { /* egal */ }); },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => { /* egal */ }); },

  setListener(x, y, z, yaw) { const l = this.listener; l.x = x; l.y = y; l.z = z; l.yaw = yaw; },
  /** Entfernung und Stereo-Position eines Punktes (three-Koordinaten) relativ zum Hörer. */
  spatial(p) {

  tone(dest, t, f0, f1, dur, type = 'sine', vol = 1) {

    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);

  },

  // ------------------------------------------------------------ Waffen ----
  /** Schuss: Waffe (WeaponDef), Position (three.Vector3) oder null für eigene Waffe. */
  shot(w, pos, own) {
    if (!this.ok()) return;
    const sp = pos && !own ? this.spatial(pos) : { dist: 0, pan: 0 };
    if (this.voices > 40 && sp.dist > 40) return;
    const t = this.ctx.currentTime;
    const cls = w.weaponClass, heavy = cls === 'MountedHMG' || cls === 'LMG' || cls === 'BattleRifle';
    const near = clamp01(1 - sp.dist / 420);
    const vol = (own ? 0.55 : 0.08 + 0.75 * near * near) * (cls === 'Pistol' ? 0.7 : cls === 'SMG' ? 0.8 : heavy ? 1.15 : 1);
    if (vol < 0.01) return;
    const out = this.out(sp.pan, vol);
    const pitch = (w.soundPitch || 1) * (0.94 + Math.random() * 0.12);
    const cut = lerp(900, 6500, near) * pitch;
    if (cls === 'MountedGL') {
      this.tone(out, t, 140 * pitch, 50, 0.18, 'sine', 0.9);
      this.noiseBurst(out, t, 0.12, 0.003, 900, 0.8, 'lowpass');
      return;
    }
    this.noiseBurst(out, t, (heavy ? 0.22 : cls === 'Shotgun' ? 0.28 : 0.16) * (1 + (1 - near) * 0.8), 0.002, cut, 0.7, 'lowpass');

      const e = this.out(-sp.pan * 0.5, vol * (own ? 0.12 : 0.3));

    }

  explosion(pos) {

    this.noiseBurst(out, t, 0.35, 0.002, lerp(800, 3500, near), 0.7, 'lowpass');

  reload(own) {

    this.noiseBurst(out, t + 0.45, 0.06, 0.002, 1800, 2, 'bandpass');
    this.noiseBurst(out, t + 0.75, 0.05, 0.002, 3200, 3, 'bandpass');
  },
  dryFire() { if (!this.ok()) return; this.noiseBurst(this.out(0, 0.2), this.ctx.currentTime, 0.04, 0.001, 3500, 4, 'bandpass'); },
  hitMarker(kill) {

  },
  impact(pos, metal) {

  whiz(pos) {

  hurt() { if (!this.ok()) return; this.tone(this.out(0, 0.3), this.ctx.currentTime, 220, 90, 0.18, 'triangle', 0.6); },

  // ------------------------------------------------------------ Motor ----
  engine(level, rpm) {

  stopAll() { this.engine(0, 0); this.ambience(null); },

  click() { if (!this.ok()) return; this.tone(this.out(0, 0.08), this.ctx.currentTime, 1300, 900, 0.03, 'square', 0.5); },
  coin() {
    if (!this.ok()) return;
    const t = this.ctx.currentTime, out = this.out(0, 0.1);
    this.tone(out, t, 1320, 1320, 0.07, 'triangle', 0.8); this.tone(out, t + 0.06, 1760, 1760, 0.12, 'triangle', 0.8);
  },
};

// ===== music.js =====
// ===================================================================================
//  music.js – Soundtrack-Spieler: Hauptmenü-Thema, ruhige Kartenmusik, Gefechtsmusik,
//  Sieg-/Niederlage-Stücke. Zwei Abspieler im Wechsel für weiche Überblendungen; das
//  Signal läuft über den Musik-Bus von Audio2 (eigene Lautstärke, auch auf iOS regelbar).
// ===================================================================================
'use strict';

const Music = {
  LIB: {
    menu: [{ id: 'menu_isla_en_llamas', title: 'Isla en Llamas – Hauptthema' }],
    map: [
      { id: 'map_brisa_del_caribe', title: 'Brisa del Caribe' },
      { id: 'map_plantagenpfad', title: 'Plantagenpfad' },
      { id: 'map_abendrot', title: 'Abendrot über San Cristóbal' },
      { id: 'map_bahia_azul', title: 'Bahía Azul' },
      { id: 'map_sierra_de_fuego', title: 'Sierra de Fuego' },
      { id: 'map_mercado_del_puerto', title: 'Mercado del Puerto' },
    ],
    battle: [
      { id: 'battle_feuergefecht', title: 'Feuergefecht' },
      { id: 'battle_sturm_auf_die_festung', title: 'Sturm auf die Festung' },
      { id: 'battle_dschungelkrieg', title: 'Dschungelkrieg' },
      { id: 'battle_letzte_linie', title: 'Letzte Linie' },
    ],
    win: [{ id: 'sting_sieg', title: 'Sieg' }],
    lose: [{ id: 'sting_niederlage', title: 'Niederlage' }],
  },
  CTX_LABEL: { menu: 'Hauptmenü', map: 'Kampagnenkarte', battle: 'Gefecht', win: 'Gefechtsende', lose: 'Gefechtsende' },
  CTX_GAIN: { menu: 1.25, map: 1.0, battle: 0.92, win: 1.0, lose: 1.0 },
  BASE: 'music/',
  ctx: null, decks: [], active: -1, track: null, order: {}, pos: {}, failed: new Set(), gapTimer: 0, pending: false, hiddenPause: false,

  init() {
    document.addEventListener('visibilitychange', () => this.visibility(document.hidden));
  },
  /** Bei jeder Nutzergeste: erste Wiedergabe starten oder eine vom Browser blockierte nachholen. */
  onGesture() {
    if (!this.decks.length || this.pending) { this.pending = false; this.kick(); }
  },
  /** Spielt erst nach der ersten Nutzerinteraktion (Browser-Vorgabe). */
  kick() {
    if (!this.ensureDecks()) return;
    // iOS: jeden Abspieler einmal innerhalb der Nutzergeste starten, sonst bleiben spätere Wechsel stumm
    for (const d of this.decks) if (!d.primed) {
      d.primed = true;
      if (this.ctx && d === this.decks[(this.active + 1) % 2]) continue;   // dieser startet gleich echt
      try { d.el.src = this.SILENT; const p = d.el.play(); if (p && p.then) p.then(() => d.el.pause()).catch(() => { /* egal */ }); } catch (e) { /* egal */ }
    }
    if (this.ctx && !this.playing()) this.start(this.ctx, true);
  },
  SILENT: 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAAAA',

  makeDeck() {
    const el = new Audio();
    el.preload = 'auto';
    el.setAttribute('playsinline', '');
    const d = { el, gain: null, src: null, vol: 0 };
    const ac = Audio2.ctx;
    if (ac && ac.createMediaElementSource) {
      try {
        d.src = ac.createMediaElementSource(el);
        d.gain = ac.createGain();
        d.gain.gain.value = 0;
        d.src.connect(d.gain); d.gain.connect(Audio2.musicBus);
      } catch (e) { d.src = null; d.gain = null; }
    }
    el.addEventListener('ended', () => this.onEnded(d));
    el.addEventListener('error', () => this.onError(d));
    return d;
  },
  ensureDecks() {
    if (this.decks.length || !Audio2.ctx) return this.decks.length > 0;
    this.decks = [this.makeDeck(), this.makeDeck()];
    return true;
  },
  /** Lautstärke eines Abspielers weich setzen (WebAudio-Gain oder – ohne WebAudio – Element-Lautstärke). */
  fade(d, to, sec) {
    d.vol = to;
    if (d.gain) {
      const t = Audio2.ctx.currentTime, g = d.gain.gain;
      g.cancelScheduledValues(t);
      g.setValueAtTime(g.value, t);
      g.linearRampToValueAtTime(to, t + Math.max(0.02, sec));
    } else {
      const v0 = d.el.volume, t0 = performance.now();
      clearInterval(d.iv);
      d.iv = setInterval(() => {
        const f = Math.min(1, (performance.now() - t0) / (sec * 1000));
        d.el.volume = clamp(v0 + (to * Audio2.musicGain() * Audio2.masterGain() - v0) * f, 0, 1);
        if (f >= 1) clearInterval(d.iv);
      }, 50);
    }
  },
  enabled() { return Audio2.on.music && Audio2.lvl.music > 0 && !Audio2.muted && Audio2.on.master && Audio2.lvl.master > 0; },
  playing() { const d = this.decks[this.active]; return !!(d && !d.el.paused && this.track); },

  // ------------------------------------------------------------ Steuerung ----
  /** Spielbereich wechseln: 'menu' | 'map' | 'battle'. Gleicher Bereich läuft weiter. */
  setContext(name) {
    if (!this.LIB[name]) return;
    if (name === this.ctx && (this.playing() || this.pending)) return;
    if (name === 'menu') this.pos.menu = -1;   // das Hauptmenü beginnt immer mit dem Thema
    this.ctx = name;
    this.start(name, false);
  },
  /** Sieg/Niederlage am Gefechtsende. */
  sting(victory) {
    this.ctx = victory ? 'win' : 'lose';
    this.start(this.ctx, false, 0.8);
  },
  next() {
    if (!this.ctx) this.ctx = Game.mode === 'battle' ? 'battle' : Game.mode === 'menu' ? 'menu' : 'map';
    if (!Audio2.on.music) { Audio2.toggle('music'); return; }
    this.start(this.ctx, false, 1.2, true);
  },
  /** Reihenfolge: Menü beginnt immer mit dem Thema, danach die Kartenstücke; sonst gemischt ohne direkte Wiederholung. */
  pick(ctx, advance) {   // eslint-disable-line no-unused-vars
    let list = this.LIB[ctx];
    if (ctx === 'menu') list = this.LIB.menu.concat(this.LIB.map);
    if (!this.order[ctx] || this.order[ctx].length !== list.length) {
      const idx = list.map((_, i) => i);
      if (ctx !== 'menu') for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
      this.order[ctx] = idx; this.pos[ctx] = -1;
    }
    for (let tries = 0; tries < list.length; tries++) {
      if (advance || this.pos[ctx] < 0 || tries > 0) this.pos[ctx] = (this.pos[ctx] + 1) % list.length;
      const tr = list[this.order[ctx][this.pos[ctx]]];
      if (!this.failed.has(tr.id)) return tr;
    }
    return null;
  },
  start(ctx, resume, fadeSec = 2.2, skip = false) {
    clearTimeout(this.gapTimer); this.pending = false;
    if (!this.enabled()) { this.stopAll(0.6); this.track = null; this.refreshUI(); return; }
    if (!this.ensureDecks()) { this.pending = true; this.refreshUI(); return; }
    if (resume && this.track && this.trackCtx === ctx) {
      const d = this.decks[this.active];
      if (d && d.el.paused) { d.el.play().catch(() => { /* egal */ }); this.fade(d, this.CTX_GAIN[ctx] || 1, 0.8); this.refreshUI(); return; }
    }
    const tr = this.pick(ctx, true);
    if (!tr) { this.stopAll(1); this.track = null; this.refreshUI(); return; }
    const old = this.decks[this.active];
    this.active = (this.active + 1) % 2;
    const d = this.decks[this.active];
    if (old && old !== d) { this.fade(old, 0, fadeSec); setTimeout(() => { if (this.decks[this.active] !== old) old.el.pause(); }, fadeSec * 1000 + 80); }
    d.el.src = this.BASE + tr.id + '.mp3';
    d.el.currentTime = 0;
    if (d.gain) d.gain.gain.value = 0; else d.el.volume = 0;
    const p = d.el.play();
    if (p && p.catch) p.catch(() => { this.pending = true; this.refreshUI(); });
    this.fade(d, this.CTX_GAIN[ctx] || 1, ctx === 'win' || ctx === 'lose' ? 0.3 : Math.min(1.6, fadeSec));
    this.track = tr; this.trackCtx = ctx;
    this.refreshUI();
  },
  stopAll(sec = 1) {
    for (const d of this.decks) { this.fade(d, 0, sec); setTimeout(() => { if (d.vol === 0) d.el.pause(); }, sec * 1000 + 80); }
  },
  onEnded(d) {
    if (d !== this.decks[this.active]) return;
    if (this.trackCtx === 'win' || this.trackCtx === 'lose') { this.track = null; this.refreshUI(); return; }
    // kurze Pause zwischen den Stücken
    this.gapTimer = setTimeout(() => { if (this.ctx) this.start(this.ctx, false, 0.5, true); }, 1800);
    this.refreshUI();
  },
  onError(d) {
    if (d !== this.decks[this.active] || !this.track) return;
    this.failed.add(this.track.id);
    const all = Object.values(this.LIB).flat();
    if (all.every(t => this.failed.has(t.id))) { this.track = null; this.unavailable = true; this.refreshUI(); return; }
    this.gapTimer = setTimeout(() => this.start(this.ctx, false, 0.3, true), 300);
  },
  /** Einstellungen geändert (Musik an/aus, Lautstärken). */
  onSettings() {
    if (!this.decks.length && !Audio2.ctx) return;
    if (!this.enabled()) { if (this.playing()) this.stopAll(0.5); this.refreshUI(); return; }
    if (!this.playing() && this.ctx) this.start(this.ctx, true);
    for (const d of this.decks) if (!d.gain && d === this.decks[this.active]) this.fade(d, this.CTX_GAIN[this.trackCtx] || 1, 0.2);
    this.refreshUI();
  },
  visibility(hidden) {
    const d = this.decks[this.active];
    if (!d) return;
    if (hidden) { if (!d.el.paused) { d.el.pause(); this.hiddenPause = true; } }
    else if (this.hiddenPause) { this.hiddenPause = false; if (this.enabled()) d.el.play().catch(() => { /* egal */ }); }
  },
  /** Für die Anzeige im Audio-Menü. */
  info() {
    const ctx = this.trackCtx || this.ctx;
    let list = this.LIB[ctx] || [];
    if (ctx === 'menu') list = this.LIB.menu.concat(this.LIB.map);
    const i = this.track ? list.indexOf(this.track) : -1;
    return {
      title: this.unavailable ? 'Musik nicht verfügbar' : !this.enabled() ? (this.track ? `Musik aus · ${this.track.title}` : 'Musik aus') : this.track ? this.track.title : this.pending || !Audio2.ctx ? 'Startet nach dem ersten Tippen/Klick' : '–',
      where: this.CTX_LABEL[ctx] || '', index: i >= 0 ? i + 1 : 0, count: list.length, on: this.enabled(),
    };
  },
  refreshUI() { if (typeof AudioUI !== 'undefined') AudioUI.refresh(); },
};

// ===== audio_ui.js =====
// ===================================================================================
//  audio_ui.js – Lautsprecher-Knopf oben rechts (überall sichtbar) mit Audio-Menü:
//  aktueller Titel, Musik an/aus, nächstes Lied, Stumm, Gesamt-/Musik-/Effektlautstärke
//  jeweils mit Schalter und 30 Stufen. Das Symbol zeigt die Gesamtstufe als 30er-Ring.
// ===================================================================================
'use strict';

const AudioUI = {
  root: null, btn: null, panel: null, ticks: [], open_: false,
  CH: [['master', 'Gesamt'], ['music', 'Musik'], ['sfx', 'Effekte']],

  init() {
    const root = document.createElement('div');
    root.id = 'audioUi';
    const ticks = [];
    for (let i = 0; i < 30; i++) {
      const a = (120 + i * (300 / 29)) * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
      ticks.push(`<line class="tk" x1="${(24 + c * 19).toFixed(2)}" y1="${(24 + s * 19).toFixed(2)}" x2="${(24 + c * 22.2).toFixed(2)}" y2="${(24 + s * 22.2).toFixed(2)}"/>`);
    }
    root.innerHTML = `<button type="button" id="audioBtn" aria-label="Ton und Musik" aria-expanded="false" aria-controls="audioPanel" title="Ton &amp; Musik">
      <svg viewBox="0 0 48 48" aria-hidden="true">${ticks.join('')}
        <path class="spk" d="M13.5 20.2h4.6l6.2-5.4v18.4l-6.2-5.4h-4.6z"/>
        <path class="wv w1" d="M27.6 20.6a4.8 4.8 0 0 1 0 6.8"/><path class="wv w2" d="M30.2 17.6a9 9 0 0 1 0 12.8"/><path class="wv w3" d="M32.8 14.7a13.2 13.2 0 0 1 0 18.6"/>
        <path class="mx" d="M28.4 19.6l7.4 8.8M35.8 19.6l-7.4 8.8"/>
      </svg><span class="lvl" aria-hidden="true"></span></button>
      <div id="audioPanel" role="dialog" aria-label="Ton und Musik" hidden>
        <div class="ap-now">
          <div class="ap-k"><span>Musik</span><span data-ap="where"></span></div>
          <div class="ap-title" data-ap="title">–</div>
          <div class="ap-btns">
            <button type="button" class="ap-b" data-au="music"></button>
            <button type="button" class="ap-b" data-au="next">Nächstes Lied <span aria-hidden="true">⏭</span></button>
          </div>
        </div>
        <div class="ap-rows">${this.CH.map(([ch, lbl]) => `
          <div class="ap-row" data-row="${ch}">
            <button type="button" class="ap-tog" data-au="tog" data-ch="${ch}" aria-pressed="true">${lbl}</button>
            <button type="button" class="ap-step" data-au="dec" data-ch="${ch}" aria-label="${lbl} leiser">−</button>
            <input type="range" min="0" max="30" step="1" data-ch="${ch}" aria-label="${lbl}: Lautstärke">
            <button type="button" class="ap-step" data-au="inc" data-ch="${ch}" aria-label="${lbl} lauter">+</button>
            <span class="ap-val" data-v="${ch}">0</span>
          </div>`).join('')}
        </div>
        <div class="ap-foot">
          <button type="button" class="ap-b" data-au="mute"></button>
          <button type="button" class="ap-b" data-au="both"></button>
        </div>
      </div>`;
    document.body.appendChild(root);
    this.root = root;
    this.btn = root.querySelector('#audioBtn');
    this.panel = root.querySelector('#audioPanel');
    this.ticks = [...root.querySelectorAll('.tk')];
    // Eingaben nicht an Karte/Gefecht weiterreichen
    for (const ev of ['pointerdown', 'mousedown', 'touchstart', 'wheel', 'contextmenu']) root.addEventListener(ev, e => e.stopPropagation(), { passive: true });
    this.btn.addEventListener('click', () => this.toggle());
    this.panel.addEventListener('click', e => {
      const b = e.target.closest('[data-au]');
      if (!b) return;
      const ch = b.dataset.ch, a = b.dataset.au;
      if (a === 'music') Audio2.toggle('music');
      else if (a === 'next') Music.next();
      else if (a === 'mute') Audio2.setMuted(!Audio2.muted);
      else if (a === 'both') {
        const anyOn = Audio2.on.music || Audio2.on.sfx;
        Audio2.on.music = !anyOn; Audio2.on.sfx = !anyOn;
        if (!anyOn) { if (!Audio2.lvl.music) Audio2.lvl.music = 15; if (!Audio2.lvl.sfx) Audio2.lvl.sfx = 15; }
        Audio2.apply(); Audio2.changed();
      } else if (a === 'tog') Audio2.toggle(ch);
      else if (a === 'dec') Audio2.setLevel(ch, Audio2.lvl[ch] - 1);
      else if (a === 'inc') Audio2.setLevel(ch, Audio2.lvl[ch] + 1);
      Audio2.click();
    });
    this.panel.addEventListener('input', e => { const t = e.target; if (t.dataset.ch) Audio2.setLevel(t.dataset.ch, parseInt(t.value, 10) || 0); });
    document.addEventListener('pointerdown', e => { if (this.open_ && !root.contains(e.target)) this.close(); }, true);
    window.addEventListener('keydown', e => {
      if (this.open_ && e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); this.close(); }
    }, true);
    this.refresh();
  },
  toggle() { if (this.open_) this.close(); else this.open(); },
  open() {
    if (Game.mode === 'battle' && !Game.isTouch() && typeof Battle !== 'undefined' && !Battle.over && !UI.modalOpen()) Battle.pause();
    this.open_ = true; this.panel.hidden = false; this.btn.setAttribute('aria-expanded', 'true'); this.refresh();
  },
  close() { this.open_ = false; this.panel.hidden = true; this.btn.setAttribute('aria-expanded', 'false'); },

  refresh() {
    if (!this.root) return;
    const L = Audio2.iconLevel(), off = L === 0;
    this.ticks.forEach((t, i) => t.classList.toggle('on', i < Audio2.lvl.master));
    this.btn.classList.toggle('off', off);
    const wv = (cls, from) => {
      const e = this.btn.querySelector(cls), k = clamp((L - from + 1) / 10, 0, 1);
      e.style.opacity = off ? 0 : k <= 0 ? 0 : (0.35 + 0.65 * k).toFixed(2);
    };
    wv('.w1', 1); wv('.w2', 11); wv('.w3', 21);
    this.btn.querySelector('.mx').style.opacity = off ? 1 : 0;
    this.btn.querySelector('.lvl').textContent = off ? '' : L;
    this.btn.setAttribute('aria-label', off ? 'Ton und Musik (stumm)' : `Ton und Musik (Stufe ${L} von 30)`);
    if (this.panel.hidden && !this.open_) return;
    const inf = typeof Music !== 'undefined' ? Music.info() : { title: '–', where: '', index: 0, count: 0, on: false };
    const q = s => this.panel.querySelector(s);
    q('[data-ap="title"]').textContent = inf.title;
    q('[data-ap="where"]').textContent = inf.where ? `${inf.where}${inf.index ? ` · ${inf.index}/${inf.count}` : ''}` : '';
    q('[data-au="music"]').textContent = Audio2.on.music ? 'Musik aus' : 'Musik an';
    q('[data-au="music"]').classList.toggle('on', !Audio2.on.music);
    q('[data-au="mute"]').textContent = Audio2.muted ? 'Ton wieder an' : 'Stumm schalten';
    q('[data-au="mute"]').classList.toggle('on', Audio2.muted);
    q('[data-au="both"]').textContent = Audio2.on.music || Audio2.on.sfx ? 'Musik & Effekte aus' : 'Musik & Effekte an';
    for (const [ch] of this.CH) {
      const row = q(`[data-row="${ch}"]`), on = Audio2.on[ch] && !(ch === 'master' && Audio2.muted);
      row.classList.toggle('off', !on);
      row.querySelector('.ap-tog').setAttribute('aria-pressed', on ? 'true' : 'false');
      const r = row.querySelector('input');
      if (document.activeElement !== r) r.value = Audio2.lvl[ch];
      row.querySelector('.ap-val').textContent = Audio2.lvl[ch];
    }
  },
};

// ===== overworld.js =====
// ===================================================================================
//  overworld.js – Steuerung der Kampagnenkarte (Port von WorldMapController.cs)
//  Klick bewegt die Armee (A*), Zeit läuft nur bei Bewegung oder Rast,
//  Ankunft in Orten, Begegnungen mit KI-Armeen, Gefechtsaufbau.
// ===================================================================================
'use strict';

const Overworld = {
  hoursPerSecond: 1, playerBaseSpeed: 17, arrivalRadius: 12, fastForwardFactor: 3, restSpeedFactor: 4,
  path: null, pathIndex: 0, targetKind: 'none', targetTownId: null, targetPartyId: -1, targetHideoutId: null,
  repathTimer: 0, resting: false, fastForward: false, encounter: null, clickStart: null,
  rng: new RNG(RND.int(1, 1e9)),

  get S() { return Game.state; },
  get map() { return Game.map; },
  playerPos() { return this.S.player.pos; },
  isMoving() { return !!(this.path && this.pathIndex < this.path.length); },

  // ============================================================== Schleife ====
  update(dt) {
    const s = this.S;
    const modal = UI.modalOpen();
    if (!modal) this.handleMouse();
    this.fastForward = Input.down('ShiftLeft') || Input.down('ShiftRight') || !!this.ffToggle;
    if (!modal && Input.pressed('KeyR')) this.setResting(!this.resting);
    let hours = 0;
    if (!modal && this.isMoving()) {
      hours = dt * this.hoursPerSecond * (this.fastForward ? this.fastForwardFactor : 1);
      this.movePlayer(hours);
    } else if (!modal && this.resting) hours = dt * this.hoursPerSecond * this.restSpeedFactor;
    if (hours > 0) {
      Game.advanceTime(hours);
      const contact = Campaign.tick(s, hours, this.playerPos(), this.playerStrength());
      if (this.resting && this.enemyNearby(40)) { this.resting = false; UI.toast('Feind in Sicht! Rast abgebrochen.'); }
      if (contact && !UI.modalOpen()) this.openEncounter(contact, true, false);
      else if (!UI.modalOpen()) this.checkArrival();
    }
    World.syncParties(s, this.playerPos(), hours > 0, dt);
    World.updatePlayer(this.playerPos(), this.playerMotorized(), hours > 0 && this.isMoving(), dt);
    MapCam.update(dt, this.playerPos());
  },

  handleMouse() {
    if (Input.mousePressed(0) && !UI.pointerOverUI) this.clickStart = { x: Input.mx, y: Input.my };
    if (!Input.mouseReleased(0) || !this.clickStart) return;
    const moved = Math.hypot(Input.mx - this.clickStart.x, Input.my - this.clickStart.y);
    this.clickStart = null;
    if (moved > 8 || UI.pointerOverUI) return;
    const hit = UI.pickAt(Input.mx, Input.my);
    if (hit) {
      if (hit.kind === 'town') { this.goToTown(hit.id); return; }
      if (hit.kind === 'hideout') { this.goToHideout(hit.id); return; }
      if (hit.kind === 'party') { this.goToParty(hit.id); return; }
    }
    const r = Game.renderer.domElement.getBoundingClientRect();
    const g = World.groundPick((Input.mx - r.left) / r.width * 2 - 1, -((Input.my - r.top) / r.height) * 2 + 1);
    if (g) this.goToPoint(g);
  },

  // ============================================================== Bewegung ====
  setResting(rest) { this.resting = rest; if (rest) this.stopMoving(); },
  setPath(target) {
    this.path = this.map.findPath(this.playerPos(), target);
    this.pathIndex = 0;
    this.resting = false;
    if (!this.path.length) { UI.toast('Dorthin führt kein Weg.'); this.targetKind = 'none'; return false; }
    return true;
  },
  goToPoint(p) { this.targetKind = 'point'; if (this.setPath(p)) World.showFlag(this.path[this.path.length - 1]); },
  goToTown(id) {
    const t = GS.town(this.S, id);
    if (!t) return;
    if (flatDist(this.playerPos(), t.pos) < this.arrivalRadius) { this.stopMoving(); this.enterTown(t); return; }
    this.targetKind = 'town'; this.targetTownId = id;
    if (this.setPath(t.pos)) World.showFlag(t.pos);
  },
  goToParty(id) {
    const p = GS.party(this.S, id);
    if (!p) return;
    this.targetKind = 'party'; this.targetPartyId = id; this.repathTimer = 0.5;
    this.setPath(p.pos);
    World.showFlag(null);
  },
  goToHideout(id) {
    const h = GS.hideout(this.S, id);
    if (!h) return;
    if (flatDist(this.playerPos(), h.pos) < this.arrivalRadius) { this.stopMoving(); this.openHideout(h); return; }
    this.targetKind = 'hideout'; this.targetHideoutId = id;
    if (this.setPath(h.pos)) World.showFlag(h.pos);
  },
  stopMoving() { this.path = null; this.pathIndex = 0; this.targetKind = 'none'; World.showFlag(null); },

  movePlayer(hours) {
    const p = this.S.player;
    if (this.targetKind === 'party') {
      const target = GS.party(this.S, this.targetPartyId);
      if (!target) { this.stopMoving(); return; }
      this.repathTimer -= hours;
      if (this.repathTimer <= 0) {
        this.repathTimer = 0.5;
        if (flatDist(this.playerPos(), target.pos) < 35 && this.map.straightLinePassable(this.playerPos(), target.pos)) { this.path = [{ x: target.pos.x, z: target.pos.z }]; this.pathIndex = 0; }
        else this.setPath(target.pos);
      }
    }
    let budget = this.playerSpeed() * this.map.speedAt(this.playerPos()) * hours;
    let pos = { x: p.pos.x, z: p.pos.z };
    while (budget > 0.0001 && this.path && this.pathIndex < this.path.length) {
      const wp = this.path[this.pathIndex], d = flatDist(pos, wp);
      if (d <= budget) { pos = { x: wp.x, z: wp.z }; budget -= d; this.pathIndex++; }
      else { pos = stepTowards(pos, wp, budget); budget = 0; }
    }
    p.pos = pos;
    if (this.path && this.pathIndex >= this.path.length && this.targetKind === 'point') this.stopMoving();
  },
  checkArrival() {
    const s = this.S;
    if (this.targetKind === 'town') {
      const t = GS.town(s, this.targetTownId);
      if (t && flatDist(this.playerPos(), t.pos) < this.arrivalRadius) { this.stopMoving(); this.enterTown(t); }
    } else if (this.targetKind === 'party') {
      const party = GS.party(s, this.targetPartyId);
      if (!party) { this.stopMoving(); return; }
      if (flatDist(this.playerPos(), party.pos) < Campaign.contactRadius * 1.3) {
        this.stopMoving();
        this.openEncounter(party, GS.areHostile(s, party.faction, DB.PLAYER), true);
      }
    } else if (this.targetKind === 'hideout') {
      const h = GS.hideout(s, this.targetHideoutId);
      if (h && flatDist(this.playerPos(), h.pos) < this.arrivalRadius) { this.stopMoving(); this.openHideout(h); }
    }
  },
  enemyNearby(r) { return this.S.parties.some(p => GS.areHostile(this.S, p.faction, DB.PLAYER) && flatDist(p.pos, this.playerPos()) < r); },

  // ====================================================== Werte des Spielers ====
  playerSpeed() {
    const p = this.S.player, troops = Roster.total(p.roster) + 1;
    const size = clamp(1.15 - troops / 120, 0.7, 1.15), seats = GS.vehicleSeats(p), fuel = Econ.hasFuel(p);
    const motor = !fuel ? 1 : seats >= troops ? 1.45 : 1 + 0.45 * seats / Math.max(1, troops);
    return this.playerBaseSpeed * size * motor * (p.morale < 30 ? 0.9 : 1);
  },
  playerStrength() {
    const p = this.S.player;
    let v = 0;
    for (const veh of p.vehicles) { const d = DB.vehicle(veh.vehicleId); if (d && veh.health > 0) v += d.strength * VehicleState.frac(veh); }
    return Roster.strength(p.roster) + v + 3 + p.renown / 50;
  },
  playerMotorized() { const p = this.S.player; return p.vehicles.length > 0 && GS.vehicleSeats(p) >= Roster.total(p.roster) + 1 && Econ.hasFuel(p); },
  statusText() {
    if (this.resting) return 'Rastet';
    if (!this.isMoving()) return 'Wartet (Zeit angehalten)';
    const s = this.S;
    if (this.targetKind === 'town') { const t = GS.town(s, this.targetTownId); return `Marsch nach ${t ? t.name : '?'}`; }
    if (this.targetKind === 'party') { const p = GS.party(s, this.targetPartyId); return `Verfolgt ${p ? p.name : '?'}`; }
    if (this.targetKind === 'hideout') { const h = GS.hideout(s, this.targetHideoutId); return `Marsch zu ${h ? h.name : '?'}`; }
    return 'Unterwegs';
  },
  nearestTownName(pos) {
    let best = null, bd = 1e9;
    for (const t of this.S.towns) { const d = flatDist(t.pos, pos); if (d < bd) { bd = d; best = t; } }
    return best ? best.name : '';
  },

  // ================================================================ Städte ====
  enterTown(t) { this.resting = false; UI.openTown(t); },
  restInTown(hours) {
    const s = this.S;
    for (let i = 0; i < hours; i++) { Game.advanceTime(1); Campaign.tick(s, 1, this.playerPos(), this.playerStrength()); }
  },
  beginSiege(t) {
    if (!GS.areHostile(this.S, t.owner, DB.PLAYER)) GS.setWarWithPlayer(this.S, t.owner, true);
    const setup = this.createBattleSetup(null, t, null, true);
    UI.closeModal();
    Game.startBattle(setup);
  },
  autoResolveSiege(t) {
    if (!GS.areHostile(this.S, t.owner, DB.PLAYER)) GS.setWarWithPlayer(this.S, t.owner, true);
    const setup = this.createBattleSetup(null, t, null, true);
    UI.closeModal();
    UI.showReport(Game.resolveImmediately(setup));
  },

  // ============================================================ Begegnungen ====
  openEncounter(party, hostile, initiatedByPlayer) {
    this.stopMoving(); this.resting = false;
    this.encounter = { party, hostile, initiatedByPlayer, hideout: null };
    UI.showEncounter(this.encounter);
  },
  openHideout(h) {
    this.resting = false;
    this.encounter = { party: null, hostile: true, initiatedByPlayer: true, hideout: h };
    UI.showEncounter(this.encounter);
  },
  encounterSetup() {
    const e = this.encounter;
    return e.hideout ? this.createBattleSetup(null, null, e.hideout, true) : this.createBattleSetup(e.party, null, null, e.initiatedByPlayer);
  },
  encounterFight() { const setup = this.encounterSetup(); this.encounter = null; UI.closeModal(); Game.startBattle(setup); },
  encounterAutoResolve() { const setup = this.encounterSetup(); this.encounter = null; UI.closeModal(); UI.showReport(Game.resolveImmediately(setup)); },
  encounterRetreat() {
    const e = this.encounter, s = this.S;
    if (e && e.party && e.hostile && !e.initiatedByPlayer) {
      const r = s.player.roster, lose = Math.ceil(Roster.healthy(r) * 0.1);
      let lost = 0;
      for (let i = 0; i < lose; i++) if (Roster.removeRandomLowTier(r, this.rng)) lost++;
      if (lost > 0) GS.log(s, `Rückzug vor ${e.party.name}: ${lost} Soldaten sind als Nachhut gefallen.`);
    }
    if (e && e.party) {
      e.party.contactCooldown = 4;
      let ax = this.playerPos().x - e.party.pos.x, az = this.playerPos().z - e.party.pos.z;
      if (ax * ax + az * az < 0.01) { ax = 0; az = -1; }
      const l = Math.hypot(ax, az);
      s.player.pos = this.map.nearestPassable(this.map.clampToMap({ x: this.playerPos().x + ax / l * 25, z: this.playerPos().z + az / l * 25 }));
    }
    this.encounter = null;
    UI.closeModal();
  },
  encounterDeclareWar() { const e = this.encounter; if (e && e.party) GS.setWarWithPlayer(this.S, e.party.faction, true); e.hostile = true; this.encounterFight(); },
  encounterLeave() { const e = this.encounter; if (e && e.party) e.party.contactCooldown = 2; this.encounter = null; UI.closeModal(); },

  // ========================================================= Gefechtsaufbau ====
  createBattleSetup(enemy, town, hideout, playerAttacks) {
    const s = this.S, p = s.player, setup = newBattleSetup();
    setup.playerTroops = Roster.cloneHealthy(p.roster);
    for (const v of p.vehicles) if (v.health > 0) setup.playerVehicles.push(VehicleState.create(v.vehicleId, v.health));
    const deployed = Roster.total(setup.playerTroops) + 1, crates = Inv.get(p, DB.AMMO), needed = Math.ceil(deployed / 4);
    setup.magazinesPerSoldier = crates >= needed ? 6 : crates > 0 ? 4 : 2;
    setup.playerPrimary = p.primaryWeapon; setup.playerSecondary = p.secondaryWeapon; setup.playerSpecial = p.specialWeapon;
    setup.playerHealth = Math.max(35, p.health); setup.playerMaxHealth = p.maxHealth;
    setup.playerStrengthBonus = 3 + p.renown / 50;
    setup.hourOfDay = GS.hour(s);
    setup.seed = this.rng.int(1, 999999);
    setup.playerIsAttacker = playerAttacks;
    if (enemy) {
      setup.enemyName = enemy.name; setup.enemyFaction = enemy.faction; setup.enemyPartyId = enemy.id;
      setup.enemyTroops = Roster.cloneHealthy(enemy.roster);
      for (const vid of enemy.vehicles) { const d = DB.vehicle(vid); if (d) setup.enemyVehicles.push(VehicleState.create(vid, d.maxHealth)); }
      setup.terrain = this.map.battleTerrain(this.playerPos(), s.towns);
      setup.locationName = this.nearestTownName(this.playerPos());
      setup.title = `Gefecht gegen ${enemy.name}`;
    } else if (town) {
      setup.isSiege = true; setup.townId = town.id;
      setup.enemyName = `Garnison von ${town.name}`; setup.enemyFaction = town.owner;
      setup.enemyTroops = Towns.defenders(town);
      setup.terrain = 'Siege'; setup.fortificationLevel = town.fortificationLevel;
      setup.locationName = town.name; setup.title = `Sturm auf ${town.name}`;
    } else if (hideout) {
      setup.hideoutId = hideout.id; setup.enemyName = hideout.name; setup.enemyFaction = hideout.faction;
      const def = DB.faction(hideout.faction), pool = def && def.unitPool.length ? def.unitPool : ['pirate'];
      const n = 8 + this.rng.int(0, 7) + Math.floor(GS.day(s) / 10);
      for (let i = 0; i < n; i++) Roster.add(setup.enemyTroops, pool[i % 3 === 2 ? pool.length - 1 : 0], 1);
      const bt = this.map.battleTerrain(hideout.pos, null);
      setup.terrain = bt === 'Plains' ? 'Hills' : bt;
      setup.locationName = hideout.name; setup.title = `Angriff auf ${hideout.name}`;
    }
    return setup;
  },
};

// ===== ui.js =====
// ===================================================================================
//  ui.js – Karten-HUD (Port von OverworldUI.cs): Kopfleiste, Ressourcen, Log,
//  Menüleiste, Minikarte, Toasts, Kartenbeschriftungen, Hover-Infos, Klick-Erkennung.
//  Die Tafeln (Städte, Armee, Begegnungen …) liegen in ui_views.js.
// ===================================================================================
'use strict';

const UI = {
  modal: null, pointerOverUI: false, labels: [], partyLabels: new Map(), playerLabel: null,
  logLines: [], hudTimer: 0, miniTimer: 0, hoverTimer: 0, hoverHit: null, el: {}, views: {}, actions: {},
  _v: null,

  init() {
    const $ = id => document.getElementById(id);
    this.el = {
      hud: $('hud'), labels: $('labels'), modal: $('modal'), toasts: $('toasts'), date: $('hudDate'), status: $('hudStatus'),
      res: $('hudRes'), log: $('hudLog'), minimap: $('minimap'), hover: $('hoverTip'), restBtn: $('btnRest'), menubar: $('menubar'),
      loading: $('loading'), loadBar: $('loadBar'), loadStatus: $('loadStatus'), bhud: $('bhud'), mapTitle: $('mapTitle'),
    };
    this._v = typeof THREE !== 'undefined' ? new THREE.Vector3() : null;
    this.el.res.innerHTML = [['Credits', 'credits'], ['Truppen', 'troops'], ['Nahrung', 'food'], ['Moral', 'morale'], ['Ansehen', 'renown']]
      .map(([k, id]) => `<div class="r"><div class="k">${k}</div><div class="v" data-r="${id}">–</div></div>`).join('');
    this.el.menubar.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b || Game.mode !== 'map') return;
      Audio2.click();
      if (b.dataset.action === 'toggleRest') { Overworld.setResting(!Overworld.resting); this.refreshHud(true); }
      else if (b.dataset.action === 'panel') this.openPanel(b.dataset.panel);
      b.blur();
    });
    this.el.mapTitle.addEventListener('click', () => { if (Game.mode === 'map' && !this.modal) { MapCam.follow = true; } });
    document.getElementById('mapctl').addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b || Game.mode !== 'map' || this.modal) return;
      Audio2.click();
      const c = b.dataset.mc;
      if (c === 'in') MapCam.distance = clamp(MapCam.distance / 1.4, MapCam.minD, MapCam.maxD);
      else if (c === 'out') MapCam.distance = clamp(MapCam.distance * 1.4, MapCam.minD, MapCam.maxD);
      else if (c === 'rl') MapCam.yaw -= 0.4;
      else if (c === 'rr') MapCam.yaw += 0.4;
      else if (c === 'follow') MapCam.follow = true;
      else if (c === 'ff') { Overworld.ffToggle = !Overworld.ffToggle; b.classList.toggle('on', Overworld.ffToggle); }
      b.blur();
    });
    this.el.modal.addEventListener('click', e => {
      if (e.target === this.el.modal && this.modal && this.modal.dismissable) { this.closeModal(); return; }
      const a = e.target.closest('[data-act]');
      if (!a || a.disabled) return;
      Audio2.click();
      this.act(a.dataset.act, a.dataset.arg, a);
    });
    this.el.modal.addEventListener('input', e => { const t = e.target; if (t.dataset && t.dataset.set) Game.setSetting(t.dataset.set, t.type === 'checkbox' ? t.checked : parseFloat(t.value)); });
    this.el.modal.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.set && t.type === 'checkbox') this.render(); });
    this.el.modal.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'cmdName') { e.preventDefault(); this.act('startNew'); } });
    window.addEventListener('mousemove', e => { this.pointerOverUI = !Game.renderer || e.target !== Game.renderer.domElement; });
    window.addEventListener('keydown', e => this.onKey(e));
    const mm = this.el.minimap;
    const miniPos = e => { const r = mm.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * Game.map.MW, z: (1 - (e.clientY - r.top) / r.height) * Game.map.MH }; };
    mm.addEventListener('mousedown', e => {
      if (Game.mode !== 'map' || this.modal) return;
      e.preventDefault();
      const p = miniPos(e);
      if (e.button === 2 || e.shiftKey) { Overworld.goToPoint(Game.map.nearestPassable(Game.map.clampToMap(p))); MapCam.follow = true; }
      else { MapCam.follow = false; MapCam.focus(p); }
    });
    mm.addEventListener('contextmenu', e => e.preventDefault());
  },

  // ============================================================ Laden ====
  setLoading(frac, text) {
    this.el.loadBar.style.width = Math.round(clamp01(frac) * 100) + '%';
    if (text) this.el.loadStatus.textContent = text;
  },
  hideLoading() { this.el.loading.hidden = true; },
  loadingError(msg) { this.el.loadStatus.innerHTML = `<span class="bad-text">${esc(msg)}</span>`; },

  // ============================================================ Modus ====
  setMode(mode) {
    this.el.hud.hidden = mode !== 'map';
    this.el.labels.hidden = mode !== 'map' && mode !== 'menu';
    this.el.bhud.hidden = mode !== 'battle';
    this.el.hover.hidden = true;
    if (mode === 'map') this.refreshHud(true);
  },

  // ======================================================= Tastatur ====
  onKey(e) {
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    if (Game.mode !== 'map') return;
    if (e.code === 'Escape') {
      e.preventDefault();
      if (this.modal) {
        if (this.modal.confirm) { this.modal.confirm = null; this.render(); }
        else if (this.modal.kind !== 'main' && this.modal.kind !== 'encounter') this.act('close');
      } else this.openPanel('menu');
    } else if (!this.modal && e.code === 'KeyH') this.openPanel('help');
    else if (!this.modal && e.code === 'KeyI') this.openPanel('army');
    else if (!this.modal && e.code === 'KeyT') this.openPanel('towns');
    else if (!this.modal && e.code === 'KeyJ') this.openPanel('missions');
  },

  // ======================================================= Modal ====
  modalOpen() { return !!this.modal; },
  open(m) {
    this.modal = Object.assign({ tab: null, msg: '', msgOk: true, confirm: null, dismissable: false }, m);
    this.el.modal.classList.toggle('clear', !!m.clear);
    this.el.modal.hidden = false;
    this.el.hover.hidden = true;
    this.render(true);
  },
  closeModal() {
    this.modal = null;
    this.el.modal.hidden = true;
    this.el.modal.innerHTML = '';
    if (Game.mode === 'map') this.refreshHud(true);
  },
  render(fresh) {
    if (!this.modal) { this.closeModal(); return; }
    const view = this.views[this.modal.kind];
    if (!view) { this.closeModal(); return; }
    const body = this.el.modal.querySelector('.body');
    const scroll = !fresh && body ? body.scrollTop : 0;
    this.el.modal.innerHTML = view.call(this, this.modal);
    const nb = this.el.modal.querySelector('.body');
    if (nb) nb.scrollTop = scroll;
    if (fresh) {
      const f = this.el.modal.querySelector('[autofocus]');
      if (f) try { f.focus(); } catch (err) { /* egal */ }
    }
  },
  act(name, arg, el) {
    const fn = this.actions[name];
    if (!fn) return;
    const m = this.modal;
    fn.call(this, arg, el, false);
    if (this.modal && this.modal === m) this.render();
    if (Game.mode === 'map') this.refreshHud(true);
  },
  /** Ergebnis {ok,msg} einer Aktion als Meldung in der Tafel anzeigen. */
  flash(res) { if (!res || !this.modal) return; this.modal.msg = res.msg; this.modal.msgOk = res.ok; if (res.ok) Audio2.coin(); },
  ask(text, act, arg, label = 'Ja') { if (this.modal) this.modal.confirm = { text, act, arg, label }; },
  openPanel(name) {
    if (!this.views[name]) return;
    this.open({ kind: name, dismissable: true });
  },

  // ======================================================= Toasts & Log ====
  toast(msg, ms = 3400) {
    const d = document.createElement('div');
    d.textContent = msg;
    this.el.toasts.appendChild(d);
    while (this.el.toasts.children.length > 4) this.el.toasts.firstChild.remove();
    setTimeout(() => { d.style.opacity = '0'; setTimeout(() => d.remove(), 700); }, ms);
  },
  onLog(msg) {
    this.logLines.push({ msg, t: performance.now() });
    while (this.logLines.length > 6) this.logLines.shift();
    this.renderLog();
  },
  renderLog() {
    const now = performance.now();
    this.el.log.innerHTML = this.logLines.map(l => `<div style="opacity:${clamp01(1.4 - (now - l.t) / 14000).toFixed(2)}">${esc(l.msg)}</div>`).join('');
  },

  // ======================================================= HUD ====
  refreshHud(force) {
    const s = Game.state;
    if (!s) return;
    const p = s.player, set = (el, txt, cls) => { if (el.textContent !== txt) el.textContent = txt; if (cls !== undefined && el.dataset.cls !== cls) { el.className = 'v ' + cls; el.dataset.cls = cls; } };
    set(this.el.date, `${GS.dateString(s)} · ${GS.clock(s)}`);
    const st = Overworld.statusText() + (Overworld.fastForward && Overworld.isMoving() ? ' · Zeitraffer ×3' : '');
    set(this.el.status, st);
    this.el.status.classList.toggle('moving', Overworld.isMoving() || Overworld.resting);
    const q = sel => this.el.res.querySelector(`[data-r="${sel}"]`);
    const exp = Econ.dailyExpenses(s), food = Econ.daysOfFood(p);
    set(q('credits'), fmt(p.credits), p.credits < exp ? 'bad' : p.credits < exp * 3 ? 'warn' : '');
    const troops = Roster.total(p.roster), wounded = Roster.wounded(p.roster);
    set(q('troops'), `${troops}/${GS.maxPartySize(p)}${wounded ? ` (${wounded}✚)` : ''}`, troops === 0 ? 'bad' : '');
    set(q('food'), `${Math.floor(food)} Tg`, food < 1 ? 'bad' : food < 3 ? 'warn' : '');
    set(q('morale'), `${Math.round(p.morale)}`, p.morale < ECO.desertionThreshold ? 'bad' : p.morale < 40 ? 'warn' : '');
    set(q('renown'), fmt(p.renown), '');
    this.el.restBtn.classList.toggle('on', Overworld.resting);
    this.el.restBtn.textContent = Overworld.resting ? 'Rast beenden' : 'Rasten';
    if (force) this.renderLog();
  },

  update(dt) {
    if (Game.mode !== 'map' && Game.mode !== 'menu') return;
    this.updateLabels();
    if (Game.mode !== 'map') return;
    this.hudTimer -= dt;
    if (this.hudTimer <= 0) { this.hudTimer = 0.2; this.refreshHud(); this.renderLog(); }
    this.miniTimer -= dt;
    if (this.miniTimer <= 0) { this.miniTimer = 0.25; this.drawMinimap(); }
    this.hoverTimer -= dt;
    if (this.hoverTimer <= 0) { this.hoverTimer = 0.08; this.updateHover(); }
  },

  // ======================================================= Minikarte ====
  drawMinimap() {
    const c = this.el.minimap, ctx = c.getContext('2d'), m = Game.map, s = Game.state;
    if (!m || !s) return;
    if (!this.minimapBase) this.minimapBase = m.buildMinimap();
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(this.minimapBase, 0, 0, c.width, c.height);
    if (World.provMini) ctx.drawImage(World.provMini, 0, 0, c.width, c.height);
    const sx = c.width / m.MW, sy = c.height / m.MH, P = p => [p.x * sx, (m.MH - p.z) * sy];
    // Kamera-Ausschnitt
    const [cx, cy] = P(MapCam.target), vw = MapCam.distance * 1.1 * sx, vh = MapCam.distance * 0.7 * sy;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(MapCam.yaw);
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 1.5; ctx.strokeRect(-vw / 2, -vh / 2, vw, vh);
    ctx.restore();
    for (const h of s.hideouts) {
      if (!GS.hideoutActive(h, GS.day(s))) continue;
      const [x, y] = P(h.pos);
      ctx.fillStyle = '#1a1208'; ctx.strokeStyle = '#d9b26a'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(x, y - 5); ctx.lineTo(x + 5, y + 4); ctx.lineTo(x - 5, y + 4); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    for (const t of s.towns) {
      const [x, y] = P(t.pos), r = t.type === 'Village' ? 4 : 6;
      ctx.fillStyle = rgbCss(DB.factionColor(t.owner)); ctx.strokeStyle = GS.isHostileToPlayer(s, t.owner) ? '#ff3b2b' : '#000'; ctx.lineWidth = 2;
      ctx.beginPath();
      if (t.type === 'Fortress') ctx.rect(x - r, y - r, r * 2, r * 2); else ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    }
    for (const p of s.parties) {
      if (!Campaign.visibleToPlayer(s, p, s.player.pos)) continue;
      const [x, y] = P(p.pos);
      ctx.fillStyle = rgbCss(DB.factionColor(p.faction));
      ctx.strokeStyle = GS.areHostile(s, p.faction, DB.PLAYER) ? '#ff3b2b' : '#111'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, y, 3.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    const [px, py] = P(s.player.pos);
    ctx.fillStyle = '#ffd34d'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (Overworld.path && Overworld.pathIndex < Overworld.path.length) {
      ctx.strokeStyle = 'rgba(255,211,77,0.85)'; ctx.setLineDash([4, 4]); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(px, py);
      for (let i = Overworld.pathIndex; i < Overworld.path.length; i++) { const [x, y] = P(Overworld.path[i]); ctx.lineTo(x, y); }
      ctx.stroke(); ctx.setLineDash([]);
    }
  },

  // ======================================================= Beschriftungen ====
  mapLabel(name, kind, color, pick) {
    const el = document.createElement('div');
    el.className = 'lbl ' + kind;
    const lbl = { el, kind, pick, name, visible: false, ax: -1e4, ay: -1e4, war: false, owner: null };
    if (kind === 'town') {
      // Fraktionsname über dem Ortsnamen, beides in Fraktionsfarbe
      const t = Game.state ? GS.town(Game.state, pick.id) : null;
      if (t) el.classList.add(t.type === 'City' ? 'city' : t.type === 'Fortress' ? 'fort' : 'village');
      el.innerHTML = `<span class="lf"></span><span class="ln">${esc(name)}</span>`;
      lbl.lf = el.firstChild;
      lbl.setFaction = owner => {
        if (owner === lbl.owner) return;
        lbl.owner = owner;
        const c = DB.factionColor(owner), mix = (k, w) => Math.round((c[k] + (1 - c[k]) * w) * 255);
        el.style.setProperty('--fc', `rgb(${mix(0, 0.12)},${mix(1, 0.12)},${mix(2, 0.12)})`);
        el.style.setProperty('--ft', `rgb(${mix(0, 0.5)},${mix(1, 0.5)},${mix(2, 0.5)})`);
        lbl.lf.textContent = owner === DB.PLAYER ? 'Deine Kompanie' : DB.factionName(owner);
        el.classList.toggle('mine', owner === DB.PLAYER);
      };
      lbl.setColor = () => { };
      if (t) lbl.setFaction(t.owner);
    } else {
      el.textContent = name;
      el.style.borderLeftColor = rgbCss(color);
      lbl.setColor = c => { el.style.borderLeftColor = rgbCss(c); };
      lbl.setFaction = o => lbl.setColor(DB.factionColor(o));
    }
    this.el.labels.appendChild(el);
    this.labels.push(lbl);
    return lbl;
  },
  /** Projiziert einen Kartenpunkt; liefert false, wenn er nicht sichtbar ist. */
  proj(x, y, z, out) {
    const v = this._v.set(x, y, -z).project(World.camera);
    if (v.z > 1 || v.z < -1) return false;
    out.x = (v.x * 0.5 + 0.5) * window.innerWidth; out.y = (-v.y * 0.5 + 0.5) * window.innerHeight;
    return out.x > -200 && out.x < window.innerWidth + 200 && out.y > -100 && out.y < window.innerHeight + 200;
  },
  place(l, vis, x, y) {
    if (vis !== l.visible) { l.el.style.display = vis ? '' : 'none'; l.visible = vis; }
    if (vis) l.el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-100%)`;
  },
  updateLabels() {
    const s = Game.state, m = Game.map;
    if (!s || !World.camera) return;
    const o = { x: 0, y: 0 }, a = { x: 0, y: 0 }, day = GS.day(s), far = MapCam.distance;
    for (const l of this.labels) {
      let pos, off;
      if (l.pick.kind === 'town') {
        const t = GS.town(s, l.pick.id);
        if (!t) { this.place(l, false); continue; }
        pos = t.pos; off = t.type === 'Village' ? 10 : 17;
        if (l.owner !== t.owner && l.setFaction) l.setFaction(t.owner);
        const war = GS.isHostileToPlayer(s, t.owner);
        if (war !== l.war) { l.war = war; l.el.classList.toggle('war', war); }
      } else {
        const h = GS.hideout(s, l.pick.id);
