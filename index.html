    }
  }

  // ------------------------------------------------------------ Kameraden ----
  thinkSquad() {
    const B = Battle, player = B.player, alive = player && player.alive;
    switch (B.order) {
      case 'FollowMe': if (alive) this.followLogic(player); else this.attackLogic(); break;
      case 'HoldPosition': this.holdLogic(B.holdPoint); break;
      case 'Mount': this.mountLogic(player); break;
      default: this.attackLogic();
    }
  }
  formationSlot(leader) {
    const row = Math.floor(this.squadIndex / 3) + 1, col = this.squadIndex % 3 - 1;
    const ref = leader.vehicle ? leader.vehicle : leader, yaw = ref.yaw, lp = ref.pos;
    const sp = leader.vehicle ? 4 : 2.6, f = fwdOf(yaw, 0, Battle._a8), r = rightOf(yaw, Battle._a9);
    return { x: lp.x - f.x * (2.5 + row * sp) + r.x * col * sp * (1 + row * 0.15), z: lp.z - f.z * (2.5 + row * sp) + r.z * col * sp * (1 + row * 0.15) };
  }
  followLogic(player) {
    this.releaseCover();
    const slot = this.formationSlot(player), d = Math.hypot(this.s.pos.x - slot.x, this.s.pos.z - slot.z);
    if (this.visible && d < 6 && this.target) { this.stop(); return; }
    if (d > 2.5) this.moveTo(slot, d > 7 || player.inVehicle); else this.stop();
  }
  holdLogic(point) {
    const a = this.squadIndex * 47 * DEG, rr = 3 + (this.squadIndex % 4) * 1.5;
    const slot = { x: point.x + Math.sin(a) * rr, z: point.z + Math.cos(a) * rr };
    if (this.visible && this.target) { if (!this.inCover && !this.seekCover(this.target.pos, point, 14)) this.stop(); return; }
    this.releaseCover();

    if (d > 2) this.moveTo(slot, d > 10); else this.stop();
  }
  attackLogic() {
    const s = this.s, w = s.weapon, pref = w ? w.def.aiPreferredRange : 50;
    if (this.visible && this.target) {
      const tp = this.target.vehicle ? this.target.vehicle.pos : this.target.pos, dist = Math.hypot(s.pos.x - tp.x, s.pos.z - tp.z);
      if (this.suppression > 0.55 && !this.inCover) { this.seekCover(tp, s.pos, 14); return; }
      if (dist > pref * 1.3) {
        const toward = { x: lerp(s.pos.x, tp.x, 0.35), z: lerp(s.pos.z, tp.z, 0.35) };
        if (!this.seekCover(tp, toward, 14)) this.moveTo(stepTowards(s.pos, tp, 14), false);
      } else if (!this.inCover && !this.seekCover(tp, s.pos, 10)) this.stop();
      return;
    }
    this.releaseCover();
    const goal = Battle.time - this.lastSeen < 15 ? this.lastKnown : Battle.teamCenter(1);
    const a = this.squadIndex * 40 * DEG;
    this.moveTo({ x: goal.x + Math.sin(a) * 4, z: goal.z + Math.cos(a) * 4 }, Math.hypot(s.pos.x - goal.x, s.pos.z - goal.z) > 40);
  }
  mountLogic(player) {
    const s = this.s;

      if (v.destroyed || v.team !== s.team || !v.hasFreeSeat) continue;
      const d = s.pos.distanceTo(v.pos);
      if (d < bd) { bd = d; best = v; }
    }
    if (!best) { if (player && player.alive) this.followLogic(player); else this.attackLogic(); return; }
    this.releaseCover();
    if (bd < 4.5 + best.def.size[2] * 0.5) { this.stop(); best.tryEnter(s); }
    else this.moveTo(best.pos, true);
  }

  // ---------------------------------------------------------------- Gegner ----
  thinkEnemy() { if (this.visible && this.target) this.engage(); else this.search(); }
  engage() {
    const s = this.s, w = s.weapon, pref = w ? w.def.aiPreferredRange : 50;
    const tp = this.target.vehicle ? this.target.vehicle.pos : this.target.pos, dist = Math.hypot(s.pos.x - tp.x, s.pos.z - tp.z);
    if (this.isDefender) {

      if (!this.inCover && !this.seekCover(tp, c, 16)) this.stop();
      return;
    }
    if (this.isFlanker && Battle.time < this.flankUntil && dist > 20) {
      const tx = tp.x - s.pos.x, tz = tp.z - s.pos.z, l = Math.max(0.01, Math.hypot(tx, tz)), nx = tx / l, nz = tz / l;
      const sx = nz * this.flankSide, sz = -nx * this.flankSide, k = Math.min(40, dist * 0.6);
      this.releaseCover();
      this.moveTo({ x: tp.x + sx * k - nx * 15, z: tp.z + sz * k - nz * 15 }, true);
      if (this.arrived(4)) this.flankUntil = 0;
      return;
    }
    if (this.suppression > 0.5 && !this.inCover && this.seekCover(tp, s.pos, 15)) return;
    if (w && w.def.weaponClass === 'Marksman' && dist < pref * 0.35) {
      const l = Math.max(0.01, dist), away = { x: s.pos.x + (s.pos.x - tp.x) / l * 14, z: s.pos.z + (s.pos.z - tp.z) / l * 14 };
      if (!this.seekCover(tp, away, 14)) this.moveTo(away, true);
      return;
    }
    if (dist > pref * 1.4) {
      const toward = { x: lerp(s.pos.x, tp.x, 0.35), z: lerp(s.pos.z, tp.z, 0.35) };
      if (!this.seekCover(tp, toward, 15)) this.moveTo(stepTowards(s.pos, tp, 15), false);
    } else if (!this.inCover && !this.seekCover(tp, s.pos, 10)) this.stop();
  }
  search() {
    const s = this.s;

      const dc = this.defendCenter;
      if (Math.hypot(s.pos.x - dc.x, s.pos.z - dc.z) > this.defendRadius) this.moveTo({ x: dc.x + RND.range(-8, 8), z: dc.z + RND.range(-8, 8) }, true);
      else if (Battle.time - this.lastSeen < 20) this.seekCover(this.lastKnown, s.pos, 12);

    }
    this.releaseCover();
    const goal = Battle.time - this.lastSeen < 15 ? this.lastKnown : Battle.teamCenter(0);
    const a = this.hash * 45 * DEG;
    this.moveTo({ x: goal.x + Math.sin(a) * 5, z: goal.z + Math.cos(a) * 5 }, Math.hypot(s.pos.x - goal.x, s.pos.z - goal.z) > 35);
  }

  // ------------------------------------------------------------ Fahrzeuge ----
  vehicleBehaviour(dt) {
    const s = this.s, v = s.vehicle;
    if (!v || v.destroyed) return;
    if (this.kind === 'squad' && Battle.order !== 'Mount') {
      const rideWithPlayer = Battle.player && Battle.player.alive && Battle.player.vehicle === v;
      if (!rideWithPlayer) {
        if (v.driver === s) v.setInput(0, 0, true);
        if (Math.abs(v.speed) < 3) v.exit(s);

      }
    }

  driverBehaviour(v) {

    if (this.kind === 'enemy') { v.aiDrive(B.teamCenter(0), v.weapon && v.gunner ? 55 : 40, 0.85); return; }

    if (!p || !p.alive) { v.aiDrive(B.teamCenter(1), 70, 0.8); return; }
    if (p.vehicle === v) { v.aiDrive(B.teamCenter(1), 65, 0.85); return; }
    v.aiDrive(p.vehicle ? p.vehicle.pos : p.pos, p.vehicle ? 18 : 14, 1);
  }
  gunnerBehaviour(v, dt) {
    const w = v.weapon;
    this.perceptionT -= dt;
    if (this.perceptionT <= 0) { this.perceptionT = 0.35; this.perceive(Math.min(w.def.maxRange, this.detection * 1.2)); }
    if (!this.visible || !this.target || !this.target.alive) { w.trigger = false; return; }

    const off = Battle._a5.set(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1).multiplyScalar(dist * Math.tan(err * DEG) * (this.target.isPlayer ? 0.75 : 0.55));
    v.aimTurret(Battle._a6.copy(tp).add(off), dt);
    w.setAim(Battle._a6);
    this.reactionT -= dt;
    if (this.reactionT > 0) return;
    this.burstT -= dt;
    if (v.isAimedAt(tp, 4) && this.firing) w.fireOnce();
    if (this.burstT <= 0) { this.firing = !this.firing; this.burstT = this.firing ? 0.6 + Math.random() * 0.8 : 0.4 + Math.random() * 0.6; }
  }
}

    const scene = this.scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9cc9e8);
    scene.fog = new THREE.FogExp2(0xb4d6ec, 0.003);
    this.camera = new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.05, 1800);
    const hemi = new THREE.HemisphereLight(0xcfe6ff, 0x6b5a3a, 1);
    const sun = new THREE.DirectionalLight(0xfff1dc, 1.2);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    const sc = sun.shadow.camera; sc.left = -55; sc.right = 55; sc.top = 55; sc.bottom = -55; sc.near = 1; sc.far = 420; sc.updateProjectionMatrix();
    sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.05;
    scene.add(hemi, sun, sun.target);
    this.env = { scene, sun, hemi, sunDir: new THREE.Vector3(0.3, 0.8, 0.2) };
    Lighting.apply(this.env, setup.hourOfDay, 0.24);
    const skyMat = new THREE.ShaderMaterial({
      uniforms: { top: { value: new THREE.Color() }, bottom: { value: new THREE.Color() } },
      vertexShader: 'varying vec3 vP;\nvoid main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: 'uniform vec3 top; uniform vec3 bottom; varying vec3 vP;\nvoid main(){ float h = clamp(vP.y * 1.8 + 0.02, 0.0, 1.0); gl_FragColor = vec4(mix(bottom, top, pow(h, 0.6)), 1.0); }',
      side: THREE.BackSide, depthWrite: false, fog: false,
    });
    const bg = scene.background, fogC = scene.fog.color;
    skyMat.uniforms.bottom.value.copy(fogC);
    skyMat.uniforms.top.value.setRGB(clamp01(bg.r * 0.62), clamp01(bg.g * 0.8), clamp01(bg.b * 1.02));
    this.sky = new THREE.Mesh(new THREE.SphereGeometry(1400, 24, 12), skyMat);
    this.sky.renderOrder = -1; this.sky.frustumCulled = false;
    scene.add(this.sky);
    this.field = new BattleField(setup);
    this.field.generate(scene);
    scene.fog.density = this.field.fogDensity;
    Fx.init(scene);
    const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = this.rng.int(0, i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    this.reserves = [shuffle(Roster.expandHealthy(setup.playerTroops)), shuffle(Roster.expandHealthy(setup.enemyTroops))];
    this.initial = [this.reserves[0].length + 1, this.reserves[1].length];
    this.fallen = [Roster.create(), Roster.create()];
    this.spawnVehicles();
    const ps = this.field.playerSpawn;
    this.player = this.spawnSoldier('rifleman', 0, true, { x: ps.x, y: ps.y + 0.1, z: ps.z }, 0);
    const pSlots = Math.max(0, this.maxActive - 1 - this.crew(0));
    for (let i = 0; i < pSlots && this.reserves[0].length; i++) this.spawnFromReserve(0);
    const eSlots = Math.max(0, this.maxActive - this.crew(1));
    for (let i = 0; i < eSlots && this.reserves[1].length; i++) this.spawnFromReserve(1);
    this.order = setup.isSiege || setup.hideoutId ? 'Attack' : 'FollowMe';
    this.holdPoint = new THREE.Vector3(ps.x, ps.y, ps.z);
    Player.init(this.player);
    BCam.init();
    if (!Input.inWindow) { Input.mx = window.innerWidth / 2; Input.my = window.innerHeight / 2; }
    BattleUI.build();
    BattleUI.intro(setup.title, `${setup.locationName ? 'bei ' + setup.locationName + ' · ' : ''}${BT_LABEL[setup.terrain] || ''} · ${pad2(Math.floor(setup.hourOfDay))}:00 Uhr`);
    Audio2.ambience(setup.terrain);
    if (Game.isTouch() && window.innerHeight > window.innerWidth) setTimeout(() => UI.toast('Tipp: Gefechte spielen sich im Querformat am besten.', 4500), 600);
    for (let i = 0; i < 3; i++) this.update(0.016, true);
  },
  crew(team) { let n = 0; for (const v of this.vehicles) if (v.team === team) for (const s of v.seats) if (s.occ && !s.occ.isPlayer) n++; return n; },
  spawnVehicles() {
    const S = this.setup;
    S.playerVehicles.forEach((st, i) => { if (i < this.maxVehicles && st.health > 0) this.spawnVehicle(st, 0, this.field.vehicleSpawnPoint(0, i), 0, i); });
    S.enemyVehicles.forEach((st, i) => {
      if (i >= Math.min(3, this.maxVehicles) || st.health <= 0) return;
      const v = this.spawnVehicle(st, 1, this.field.vehicleSpawnPoint(1, i), Math.PI, i);
      const crew = Math.min(v.seats.length, 4);
      for (let k = 0; k < crew && this.reserves[1].length; k++) { const s = this.spawnFromReserve(1); if (s) v.tryEnter(s); }
    });
  },
  spawnVehicle(state, team, p, yaw, index) { const v = new Vehicle(state, team, p, yaw, index); this.vehicles.push(v); return v; },
  spawnFromReserve(team) {
    if (!this.reserves[team].length) return null;
    const unit = this.reserves[team].shift(), idx = this.spawnCounter++ % 30;
    return this.spawnSoldier(unit, team, false, this.field.spawnPoint(team, idx), this.field.spawnYaw(team));
  },
  spawnSoldier(unitId, team, isPlayer, pos, yaw) {
    const S = this.setup, s = new Soldier(unitId, team, isPlayer, pos, yaw, S);
    const mags = team === 0 ? S.magazinesPerSoldier : 6;
    if (isPlayer) s.setupWeapons([S.playerPrimary, S.playerSecondary, S.playerSpecial], mags + 2);
    else s.setupWeapons([s.def.primaryWeapon, s.def.secondaryWeapon, null], mags);
    if (!isPlayer) {
      const opts = {};
      if (team === 0) opts.squadIndex = this.squadCounter++;
      else if (this.field.compound) { const c = this.field.compound; Object.assign(opts, { isDefender: true, defendCenter: { x: c.x, z: c.z }, defendRadius: Math.max(c.w, c.d) * 0.5 }); }
      else opts.isFlanker = this.rng.chance(0.3);
      s.ai = new SoldierAI(s, team === 0 ? 'squad' : 'enemy', opts);
    }
    this.soldiers.push(s);
    return s;
  },

  // ================================================================ Ablauf ====
  update(dt, warm) {
    if (!this.scene) return;
    this.dt = dt;
    if (!warm) this.handleKeys();
    const paused = UI.modalOpen();
    if (!paused) {
      this.time += dt; this.pathBudget = 5;
      if (!this.over && !warm) this.tickManager(dt);
      Player.update(dt);
      for (const s of this.soldiers) if (s.ai && s.alive) s.ai.update(dt);
      for (const v of this.vehicles) v.update(dt);
      for (const s of this.soldiers) if (s.alive && s.weapon) s.weapon.update(dt);
      this.updateProjectiles(dt);
      this.separate();
    } else Player.releaseTriggers();
    for (const s of this.soldiers) {
      if (!s.alive && !s.removed && this.time - s.deathTime > 40) { s.removed = true; s.rig.root.visible = false; }
      if (!s.removed) s.updateVisual(dt);
    }
    BCam.update(dt);
    if (this.sky) this.sky.position.copy(this.camera.position);
    this.updateSun();
    Fx.update(paused ? 0 : dt, this.camera, Game.renderer);
    this.updateAudio();
    if (!warm) BattleUI.update(dt);
  },
  handleKeys() {
    if (Input.pressed('Escape')) {
      if (UI.modal && UI.modal.kind === 'bpause') this.resume();
      else if (!UI.modalOpen() && !this.over) this.pause();
    }
  },
  pause() { if (this.over) return; Input.exitLock(); UI.open({ kind: 'bpause' }); },
  resume() { UI.closeModal(); if (!Game.isTouch()) { Input.lockFailed = false; Input.requestLock(); } },
  wantsPointerLock() { return !!this.scene && !UI.modalOpen() && !this.over; },

  tickManager(dt) {
    this.reinforceT -= dt;
    if (this.reinforceT <= 0) {
      this.reinforceT = 3;
      for (let team = 0; team < 2; team++) {
        let alive = this.countAlive(team), n = 0;
        while (alive < this.maxActive && this.reserves[team].length && n < 4) { this.spawnFromReserve(team); alive++; n++; }
        if (n > 0 && team === 0) this.feed(`Verstärkung eingetroffen (${n})`, 'good');
      }
    }
    const enemyLeft = this.countAlive(1) + this.reserves[1].length, ownLeft = this.countAlive(0) + this.reserves[0].length;
    if (enemyLeft === 0) this.end(true, false);
    else if (ownLeft === 0) this.end(false, false);
  },
  countAlive(team) { let n = 0; for (const s of this.soldiers) if (s.team === team && s.alive) n++; return n; },
  teamCenter(team) {
    const c = this._c4.set(0, 0, 0);
    let n = 0;
    for (const s of this.soldiers) { if (s.team !== team || !s.alive) continue; c.add(s.vehicle ? s.vehicle.pos : s.pos); n++; }
    if (n) return c.multiplyScalar(1 / n);
    const sp = team === 0 ? this.field.playerSpawn : this.field.enemySpawn;
    return c.set(sp.x, sp.y, sp.z);
  },
  issueOrder(o) {
    if (this.over) return;
    if (o === 'Mount' && this.order === 'Mount') o = 'FollowMe';
    this.order = o;
    if (this.player) this.holdPoint.copy(this.player.vehicle ? this.player.vehicle.pos : this.player.pos);
    this.feed('Befehl: ' + ORDER_TEXT[o], 'accent');
  },
  feed(text, cls) { BattleUI.addFeed(text, cls); },
  onSoldierDied(s, info) {
    if (s.isPlayer) {
      this.playerDown = true;
      this.feed('Du wurdest kampfunfähig geschossen!', 'bad');
      Player.releaseTriggers();
      if (!this.over) {
        if (this.countAlive(0) + this.reserves[0].length === 0) this.end(false, false);
        else { Input.exitLock(); UI.open({ kind: 'bdown' }); }
      }
      return;
    }
    Roster.add(this.fallen[s.team], s.unitId, 1);
    const killer = info.attacker ? (info.attacker.isPlayer ? 'Du' : info.attacker.name) : (info.weaponName === 'Fahrzeugexplosion' ? 'Explosion' : 'Explosion');
    this.feed(`${killer}  ×  ${s.name}${info.weaponName ? `  [${info.weaponName}]` : ''}`, s.team === 0 ? 'bad' : info.attacker && info.attacker.isPlayer ? 'accent' : '');
  },
  onPlayerHurt(dmg) { BattleUI.hurt(dmg); Audio2.hurt(); },

  // ============================================================ Treffer ====
  trace(o, d, maxT, ignoreS, ignoreV) {
    let best = maxT, res = null;
    const st = this.field.raycast(o, d, maxT);
    if (st) { best = st.t; res = { t: st.t, nx: st.nx, ny: st.ny, nz: st.nz, mat: st.mat }; }
    const tmp = this._tmpOut;
    for (const s of this.soldiers) {
      if (s === ignoreS || !s.alive || s.vehicle) continue;
      const t = s.rayHit(o, d, best, tmp);
      if (t >= 0 && t < best) { best = t; res = { t, soldier: s, part: tmp.part, nx: -d.x, ny: -d.y, nz: -d.z }; }
    }
    for (const v of this.vehicles) {
      if (v === ignoreV) continue;
      tmp.occupant = null;
      const t = v.rayHit(o, d, best, tmp);
      if (t >= 0 && t <= best) { best = t; res = { t, vehicle: v, occupant: tmp.occupant, nx: tmp.nx || -d.x, ny: tmp.ny || 0, nz: tmp.nz || -d.z, mat: 'metal' }; }
    }
    if (res) res.point = new THREE.Vector3(o.x + d.x * res.t, o.y + d.y * res.t, o.z + d.z * res.t);
    return res;
  },
  hitscan(def, origin, dir, attacker, team, weapon) {
    const o = this._h1.copy(origin), d = this._h2.copy(dir);
    const ignoreV = weapon.vehicle || (attacker && attacker.vehicle) || null;
    const hit = this.trace(o, d, def.maxRange, attacker, ignoreV);
    const end = hit ? hit.point : this._h3.copy(o).addScaledVector(d, def.maxRange);
    if (hit) this.impact(hit, def, hit.t, d, attacker, team);
    if (Math.random() < (weapon.isPlayer ? 0.5 : 0.3)) Fx.tracer(o, end, def.isMounted);
    this.nearMiss(o, end, team);
  },
  nearMiss(a, b, team) {
    const p = this.player;
    if (!p || !p.alive || p.team === team || this.time < this.whizT) return;
    const head = p.eye(this._h4), ab = this._h5.copy(b).sub(a), len = ab.length();
    if (len < 0.1) return;
    const t = clamp(this._c3.copy(head).sub(a).dot(ab) / (len * len), 0, 1);
    const cp = this._c3.copy(a).addScaledVector(ab, t), d = cp.distanceTo(head);
    if (d > 0.45 && d < 2.6) { Audio2.whiz(cp); this.whizT = this.time + 0.12; }
  },
  impact(hit, def, dist, dir, attacker, team) {
    const base = def.damage * damageFalloff(def, dist), n = this._c1.set(hit.nx, hit.ny, hit.nz);
    const info = { amount: base, part: 'torso', team, attacker, ap: def.armorPiercing, explosion: false, weaponName: def.displayName };
    const mark = (target, killed, head) => { if (attacker && attacker.isPlayer && target.team !== team) { BattleUI.hitMarker(killed, head); Audio2.hitMarker(killed); } };
    if (hit.soldier) {
      const s = hit.soldier;
      info.part = hit.part; info.amount = base * ZONE_MULT[hit.part];
      const dmg = s.takeDamage(info);
      Fx.impact(hit.point, n, 'blood');
      if (dmg > 0) mark(s, !s.alive, hit.part === 'head');
    } else if (hit.vehicle) {
      if (hit.occupant && hit.occupant.alive) {
        const dmg = hit.occupant.takeDamage(info);
        Fx.impact(hit.point, n, 'blood');
        if (dmg > 0) mark(hit.occupant, !hit.occupant.alive, false);
      } else {
        const v = hit.vehicle, dmg = v.takeDamage(info);
        Fx.impact(hit.point, n, 'metal');
        Audio2.impact(hit.point, true);
        if (dmg > 0) mark(v, v.destroyed, false);
      }
    } else {
      Fx.impact(hit.point, n, hit.mat || 'ground');
      if (Math.random() < 0.3) Audio2.impact(hit.point, hit.mat === 'metal');
    }
  },
  spawnProjectile(def, origin, dir, attacker, team, ignoreV, weapon) {
    const grenade = def.explosionRadius > 0;
    const pr = { def, p: origin.clone(), v: dir.clone().multiplyScalar(def.projectileSpeed), attacker, team, ignoreV, traveled: 0, age: 0, grenade, mesh: null, tracer: null };
    if (grenade) {
      pr.mesh = new THREE.Mesh(GeoBuilder.unit('sph', 6), Rig.mat([0.1, 0.1, 0.09]));
      pr.mesh.scale.setScalar(0.14);
      pr.mesh.position.copy(origin);
      this.scene.add(pr.mesh);
    } else { pr.tracer = Fx.tracer(origin, origin, def.isMounted, 0.08); if (pr.tracer) pr.tracer.live = true; }
    this.projectiles.push(pr);
  },
  updateProjectiles(dt) {
    for (let i = this.projectiles.length - 1; i >= 0; i--) {
      const pr = this.projectiles[i], d = pr.def;
      const nv = this._c1.copy(pr.v); nv.y -= d.projectileGravity * dt;
      const next = this._c2.copy(pr.p).addScaledVector(pr.v, 0.5 * dt).addScaledVector(nv, 0.5 * dt);
      const seg = this._c3.copy(next).sub(pr.p), len = seg.length();
      let done = false;
      if (len > 1e-4) {
        seg.multiplyScalar(1 / len);
        const hit = this.trace(pr.p, seg, len, pr.attacker, pr.ignoreV);
        if (hit) {
          pr.traveled += hit.t;
          this.impact(hit, d, pr.traveled, seg, pr.attacker, pr.team);
          if (pr.grenade) this.explode(this._ve.set(hit.point.x + hit.nx * 0.3, hit.point.y + hit.ny * 0.3, hit.point.z + hit.nz * 0.3), d.explosionRadius, d.explosionDamage, pr.attacker, pr.team, d.armorPiercing, d.displayName);
          else this.nearMiss(pr.p, hit.point, pr.team);
          done = true;
        }
      }
      if (!done) {
        this.nearMiss(pr.p, next, pr.team);
        pr.traveled += len; pr.v.copy(nv); pr.p.copy(next); pr.age += dt;
        if (pr.mesh) pr.mesh.position.copy(next);
        if (pr.tracer) { const tail = Math.min(8, pr.traveled); pr.tracer.b.copy(next); pr.tracer.a.copy(next).addScaledVector(pr.v, -tail / Math.max(1, pr.v.length())); }
        if (pr.age > 6 || pr.traveled > d.maxRange * 1.6 || next.y < -60) done = true;
      }
      if (done) {
        if (pr.mesh) this.scene.remove(pr.mesh);
        if (pr.tracer) { pr.tracer.live = false; pr.tracer.life = 0.05; }
        this.projectiles.splice(i, 1);
      }
    }
  },
  explode(pos, radius, damage, attacker, team, ap, name, source) {
    pos = pos.clone();
    Fx.explosion(pos, radius);
    Audio2.explosion(pos);
    const cd = this.camera.position.distanceTo(pos);
    Fx.shake = Math.max(Fx.shake, clamp01(1 - cd / 70) * 1.3);
    const info = () => ({ part: 'torso', team, attacker, ap, explosion: true, weaponName: name });
    for (const s of this.soldiers) {
      if (!s.alive || s.vehicle) continue;
      const c = s.center(this._c2), d = Math.max(0, c.distanceTo(pos) - 0.35);
      if (d >= radius) continue;
      let f = 1 - d / radius;
      if (!this.field.los(pos, c)) f *= 0.35;
      const dmg = s.takeDamage(Object.assign(info(), { amount: damage * f }));
      if (dmg > 0 && attacker && attacker.isPlayer && s.team !== team) BattleUI.hitMarker(!s.alive, false);
    }
    for (const v of this.vehicles) {
      if (v === source || v.destroyed) continue;
      const d = Math.max(0, Math.hypot(v.pos.x - pos.x, v.pos.y + 1 - pos.y, v.pos.z - pos.z) - v.def.size[0] * 0.6);
      if (d >= radius) continue;
      const f = 1 - d / radius;
      v.takeDamage(Object.assign(info(), { amount: damage * f * 1.4 }));
      v.seats.forEach(seat => { if (seat.occ && seat.exposed && seat.occ.alive) seat.occ.takeDamage(Object.assign(info(), { amount: damage * f * 0.5 })); });
    }
  },
  separate() {
    const list = this.soldiers;
    for (let i = 0; i < list.length; i++) {
      const a = list[i];
      if (!a.alive || a.vehicle) continue;
      for (let j = i + 1; j < list.length; j++) {
        const b = list[j];
        if (!b.alive || b.vehicle) continue;
        const dx = b.pos.x - a.pos.x, dz = b.pos.z - a.pos.z, d2 = dx * dx + dz * dz;
        if (d2 >= 0.5 || d2 < 1e-6) continue;
        const d = Math.sqrt(d2), push = (0.71 - d) * 0.5, nx = dx / d, nz = dz / d;
        const wa = a.isPlayer ? 0.2 : 1, wb = b.isPlayer ? 0.2 : 1;
        a.pos.x -= nx * push * wa; a.pos.z -= nz * push * wa; b.pos.x += nx * push * wb; b.pos.z += nz * push * wb;
      }
    }
  },
  updateSun() {
    const p = this.player && this.player.alive ? (this.player.vehicle ? this.player.vehicle.pos : this.player.pos) : BCam.focus;
    const sun = this.env.sun;
    sun.target.position.set(p.x, p.y, p.z);
    sun.position.copy(sun.target.position).addScaledVector(this.env.sunDir, 200);
  },
  updateAudio() {
    const c = this.camera;
    Audio2.setListener(c.position.x, c.position.y, c.position.z, BCam.yaw);
    let lvl = 0, rpm = 0;
    for (const v of this.vehicles) {
      if (v.engineLevel <= 0) continue;
      const own = this.player && this.player.vehicle === v;
      const f = own ? 1 : clamp01(1 - v.pos.distanceTo(c.position) / 70) * 0.7;
      if (v.engineLevel * f > lvl) { lvl = v.engineLevel * f; rpm = clamp01(Math.abs(v.speed) / v.def.maxSpeed) + Math.abs(v.throttle) * 0.15; }
    }
    Audio2.engine(UI.modalOpen() ? 0 : lvl * 1.6, rpm);
  },

  // ============================================================ Ausgang ====
  spectate() { this.spectating = true; if (this.order === 'FollowMe') this.order = 'Attack'; UI.closeModal(); },
  quickResolveRemaining() {
    if (this.over) return;
    const pf = this.player && this.player.alive, q = newBattleSetup();
    Object.assign(q, { terrain: this.setup.terrain, isSiege: this.setup.isSiege, fortificationLevel: this.setup.fortificationLevel, playerStrengthBonus: pf ? this.setup.playerStrengthBonus : 0, playerHealth: pf ? this.player.hp : 15 });
    for (const v of this.vehicles) { if (v.destroyed) continue; (v.team === 0 ? q.playerVehicles : q.enemyVehicles).push(VehicleState.create(v.def.id, v.hp)); }
    for (const s of this.soldiers) { if (!s.alive || s.isPlayer) continue; Roster.add(s.team === 0 ? q.playerTroops : q.enemyTroops, s.unitId, 1); }
    for (const u of this.reserves[0]) Roster.add(q.playerTroops, u, 1);
    for (const u of this.reserves[1]) Roster.add(q.enemyTroops, u, 1);
    const r = Resolver.autoResolve(q, this.rng);
    this.quick = r;
    for (const st of r.playerKilled.stacks) Roster.add(this.fallen[0], st.unitId, st.count);
    for (const st of r.playerWounded.stacks) Roster.add(this.fallen[0], st.unitId, st.count);
    for (const st of r.enemyKilled.stacks) Roster.add(this.fallen[1], st.unitId, st.count);
    for (const st of r.prisonersTaken.stacks) Roster.add(this.fallen[1], st.unitId, st.count);
    this.reserves = [[], []];
    this.end(r.victory, false);
  },
  retreat() { if (!this.over) this.end(false, true); },
  end(victory, retreated) {
    this.over = true;
    Music.sting(victory);
    Player.releaseTriggers();
    for (const s of this.soldiers) if (s.weapon) s.weapon.trigger = false;
    for (const v of this.vehicles) if (v.weapon) v.weapon.trigger = false;
    const r = newBattleResult(), rng = this.rng;
    r.victory = victory; r.playerRetreated = retreated;
    for (const st of this.fallen[0].stacks) for (let i = 0; i < st.count; i++) Roster.add(rng.chance(0.4) ? r.playerKilled : r.playerWounded, st.unitId, 1);
    if (!victory) {
      if (this.quick) Roster.addRoster(r.playerCaptured, this.quick.playerCaptured, false);
      else { const ch = retreated ? 0.12 : 0.3; for (const s of this.soldiers) if (s.team === 0 && s.alive && !s.isPlayer && rng.chance(ch)) Roster.add(r.playerCaptured, s.unitId, 1); }
    }
    for (const st of this.fallen[1].stacks) for (let i = 0; i < st.count; i++) Roster.add(victory && rng.chance(0.3) ? r.prisonersTaken : r.enemyKilled, st.unitId, 1);
    const states = this.setup.playerVehicles.map(v => VehicleState.create(v.vehicleId, v.health));
    for (const v of this.vehicles) {
      if (v.team === 0 && v.index >= 0 && v.index < states.length) states[v.index].health = v.destroyed ? 0 : v.hp;
      else if (v.team === 1 && victory && !v.destroyed) r.vehiclesCaptured.push(VehicleState.create(v.def.id, v.hp));
    }
    r.playerVehiclesAfter = states;
    r.playerHealthAfter = this.player && this.player.alive ? this.player.hp : victory ? 25 : 15;
    r.playerKills = this.player ? this.player.kills : 0;
    r.ammoCratesUsed = Math.ceil(this.shotsByTeam[0] / DB.ROUNDS_PER_CRATE);
    r.summary = victory ? 'Der Feind wurde geschlagen.' : retreated ? 'Deine Truppe hat sich vom Gefechtsfeld zurückgezogen.' : 'Deine Truppe wurde aufgerieben.';
    this.result = r;
    Input.exitLock();
    Audio2.engine(0, 0);
    UI.open({ kind: 'bresult' });
  },
  finish() { if (this.result) { const r = this.result; this.result = null; UI.closeModal(); Game.finishBattle(r); } },

  dispose() {
    if (!this.scene) return;
    Audio2.stopAll();
    for (const s of this.soldiers) s.dispose();
    for (const v of this.vehicles) v.dispose();
    for (const p of this.projectiles) if (p.mesh) this.scene.remove(p.mesh);
    Fx.dispose();
    if (this.sky) { this.sky.geometry.dispose(); this.sky.material.dispose(); this.sky = null; }
    this.field.dispose();
    Rig.dispose();
    BattleUI.clear();
    this.soldiers = []; this.vehicles = []; this.projectiles = []; this.player = null;
    this.scene = null; this.field = null;
  },
};

// ========================================================= Spielersteuerung ====
const Player = {
  s: null, yaw: 0, pitch: 0, aiming: false, sprinting: false, fp: false, prompt: '', vy: 0, recoilDebt: 0, crouchToggle: false, grounded: true,
  init(s) { Object.assign(this, { s, yaw: s.yaw, pitch: 0, aiming: false, sprinting: false, fp: false, prompt: '', vy: 0, recoilDebt: 0, crouchToggle: false, grounded: true }); },
  releaseTriggers() {
    const s = this.s;
    if (!s) return;
    if (s.weapon) s.weapon.trigger = false;
    if (s.vehicle) {
      const v = s.vehicle;
      if (v.weapon && v.gunner === s) v.weapon.trigger = false;
      if (v.driver === s) v.setInput(0, 0, true);
    }
  },
  addRecoil(vert, horiz) {
    const f = (this.aiming ? 0.65 : 1) * (this.s && this.s.crouch ? 0.75 : 1);
    this.pitch = clamp(this.pitch + vert * f * DEG, -80 * DEG, 80 * DEG);
    this.yaw -= horiz * f * DEG;
    this.recoilDebt += vert * f * 0.6 * DEG;
  },
  update(dt) {
    const s = this.s;
    if (!s || !s.alive || Battle.over) { this.releaseTriggers(); this.prompt = ''; return; }
    this.look(dt);
    for (const [k, o] of [['F1', 'FollowMe'], ['F2', 'HoldPosition'], ['F3', 'Attack'], ['F4', 'Mount']]) if (Input.pressed(k)) Battle.issueOrder(o);
    if (Input.pressed('KeyV')) { this.fp = !this.fp; if (s.vehicle) s.vehicle.refreshSeats(); }
    if (s.vehicle) { this.vehicleControls(dt); return; }
    this.move(dt);
    this.weapons();
    this.interaction();
  },
  look(dt) {
    const sens = 0.0022 * Game.settings.sensitivity * (this.aiming ? 0.6 : 1);
    if (Game.isTouch()) {
      const t = Input.touchLook(), k = 0.0052 * Game.settings.sensitivity * (this.aiming ? 0.55 : 1);
      this.yaw -= t.x * k;
      this.pitch -= t.y * k * 0.85 * (Game.settings.invertY ? -1 : 1);
    } else if (Input.locked) {
      const md = Input.mouseDeltaRaw();
      this.yaw -= md.x * sens;
      this.pitch -= md.y * sens * (Game.settings.invertY ? -1 : 1);
    } else {
      // Mauszeiger-Modus: am Bildrand drehen
      const nx = Input.mx / window.innerWidth * 2 - 1, ny = Input.my / window.innerHeight * 2 - 1, dz = 0.74;
      if (Input.inWindow && !UI.pointerOverUI) {
        if (Math.abs(nx) > dz && Math.abs(nx) <= 1) this.yaw -= Math.sign(nx) * Math.pow((Math.abs(nx) - dz) / (1 - dz), 2) * 2.4 * dt * Game.settings.sensitivity;
        if (Math.abs(ny) > dz && Math.abs(ny) <= 1) this.pitch -= Math.sign(ny) * Math.pow((Math.abs(ny) - dz) / (1 - dz), 2) * 1.3 * dt * Game.settings.sensitivity;
      }
    }
    const rec = Math.min(this.recoilDebt, 7 * DEG * dt);
    this.pitch -= rec; this.recoilDebt -= rec;
    this.pitch = clamp(this.pitch, -80 * DEG, 80 * DEG);
    this.s.pitch = this.pitch / DEG;
  },
  move(dt) {
    const s = this.s, F = Battle.field;
    if (Input.pressed('KeyC')) this.crouchToggle = !this.crouchToggle;
    const crouch = this.crouchToggle, ax = Input.moveAxis();
    this.aiming = Input.mouse[2];
    this.sprinting = (Input.down('ShiftLeft') || Input.down('ShiftRight')) && ax.y > 0.1 && !this.aiming && !crouch;
    if (this.sprinting) this.crouchToggle = false;
    let speed = crouch ? 2.2 : this.sprinting ? 7 : 4.2;
    if (this.aiming) speed *= 0.6;
    const f = fwdOf(this.yaw, 0, Battle._v1), r = rightOf(this.yaw, Battle._v2);
    let mx = f.x * ax.y + r.x * ax.x, mz = f.z * ax.y + r.z * ax.x;
    const ml = Math.hypot(mx, mz);
    if (ml > 1) { mx /= ml; mz /= ml; }
    mx *= speed; mz *= speed;
    const stand = F.standHeight(s.pos.x, s.pos.z, s.pos.y);
    this.grounded = s.pos.y <= stand + 0.06 && this.vy <= 0.01;
    if (this.grounded) { this.vy = 0; s.pos.y = stand; if (Input.pressed('Space') && !crouch) this.vy = 6.6; }
    else this.vy -= 20 * dt;
    s.pos.x += mx * dt; s.pos.z += mz * dt; s.pos.y += this.vy * dt;
    F.pushOut(s.pos, 0.35, s.pos.y + 0.5);
    const st2 = F.standHeight(s.pos.x, s.pos.z, s.pos.y);
    if (s.pos.y < st2) { s.pos.y = st2; if (this.vy < 0) this.vy = 0; }
    s.yaw = this.yaw; s.speed = Math.hypot(mx, mz); s.crouch = crouch;
  },
  weapons() {
    const s = this.s;
    if (Input.pressed('Digit1')) s.equip(0);
    if (Input.pressed('Digit2')) s.equip(1);
    if (Input.pressed('Digit3')) s.equip(2);
    const wh = Input.wheel();
    if (wh) { for (let k = 1; k <= 2; k++) { const i = (s.slot + (wh > 0 ? k : 3 - k)) % 3; if (s.weapons[i]) { s.equip(i); break; } } }
    const w = s.weapon;
    if (!w) return;
    if (Input.pressed('KeyR')) w.startReload();
    let mult = 1;
    if (s.speed > 0.5) mult = this.sprinting ? 2.5 : 1.6;
    if (s.crouch) mult *= 0.7;
    if (!this.grounded) mult *= 3;
    w.aiming = this.aiming; w.spreadMult = mult;
    w.setAim(BCam.aimPoint(Battle._h4, s, null));
    w.trigger = Input.mouse[0] && !this.sprinting;
  },
  interaction() {
    const s = this.s;
    let best = null, bd = 4.5;
    for (const v of Battle.vehicles) {
      if (v.destroyed || v.team !== s.team) continue;
      const dx = s.pos.x - v.pos.x, dz = s.pos.z - v.pos.z, fx = Math.sin(v.yaw), fz = Math.cos(v.yaw);
      const lf = Math.max(0, Math.abs(dx * fx + dz * fz) - v.def.size[2] / 2), lr = Math.max(0, Math.abs(dx * fz - dz * fx) - v.def.size[0] / 2);
      const d = Math.hypot(lf, lr);
      if (d < bd) { bd = d; best = v; }
    }
    this.canEnter = false;
    if (best) {
      const canEnter = best.hasFreeSeat || (best.driver && !best.driver.isPlayer);
      this.canEnter = canEnter;
      this.prompt = canEnter ? `${Game.isTouch() ? '' : '[E] '}Einsteigen: ${best.def.displayName}` : `${best.def.displayName} ist voll besetzt`;
      if (canEnter && Input.pressed('KeyE')) { this.releaseTriggers(); best.tryEnter(s); }
    } else this.prompt = '';
  },
  vehicleControls(dt) {
    const s = this.s, v = s.vehicle, seat = v.seats[s.seat];
    this.canEnter = false;
    this.prompt = Game.isTouch() ? `${v.def.displayName} – ${seat.name}` : `${v.def.displayName} – ${seat.name}   [E] Aussteigen   [F] Platz wechseln`;
    this.aiming = false; this.sprinting = false;
    if (Input.pressed('KeyE')) { this.releaseTriggers(); v.exit(s); this.yaw = s.yaw = v.yaw; return; }
    if (Input.pressed('KeyF')) { this.releaseTriggers(); v.switchSeat(s); return; }
    if (seat.driver) {
      const ax = Input.moveAxis();
      v.setInput(ax.y, ax.x, Input.down('Space'));
    } else if (seat.gunner && v.weapon) {
      const w = v.weapon;
      v.aimTurret(BCam.aimPoint(Battle._h4, s, v), dt);
      w.setAim(Battle._h4);
      this.aiming = Input.mouse[2];
      w.aiming = this.aiming;
      if (Input.pressed('KeyR')) w.startReload();
      w.trigger = Input.mouse[0];
    }
  },
};

// ================================================================== Kamera ====
const BCam = {
  blend: 0, yaw: 0, specYaw: 0, specPitch: 0.45, specTarget: null, fov: 68, focus: null,
  init() { this.blend = 0; this.specTarget = null; this.fov = 68; this.focus = new THREE.Vector3(); const p = Battle.player; this.focus.copy(p.pos); this.yaw = p.yaw; },
  /** Kollisionsfreie Kameraposition zwischen 'from' und 'to'. */
  avoid(from, to) {
    const d = (this._d || (this._d = new THREE.Vector3())).copy(to).sub(from), dist = d.length();
    if (dist < 0.01) return to;
    d.multiplyScalar(1 / dist);
    const hit = Battle.field.raycast(from, d, dist + 0.3);
    if (hit && hit.t < dist + 0.3) return to.copy(from).addScaledVector(d, Math.max(0.3, hit.t - 0.3));
    return to;
  },
  update(dt) {
    const cam = Battle.camera, P = Player, s = P.s;
    if (!s || !s.alive) { this.spectate(dt); return; }
    const f = fwdOf(P.yaw, P.pitch, Battle._c2), r = rightOf(P.yaw, Battle._c3), u = Battle._c4.crossVectors(r, f);
    this.blend = moveTowards(this.blend, P.fp ? 1 : 0, dt * 4);
    const b = smooth01(this.blend);
    const pos = Battle._h5;
    let targetFov = 68;
    if (s.vehicle) {
      const v = s.vehicle, seat = v.seats[s.seat];
      if (P.fp) {
        if (seat.gunner && v.model.gunPitch) { v.muzzle(pos, Battle._vf); pos.addScaledVector(Battle._vf, -(v.spec.muzzleLen || 1.2) - 0.4).y += 0.42; }
        else { v.seatPos(s.seat, pos); pos.y += 0.75; }
        v.refreshSeats();
      } else {
        const piv = Battle._v7;
        if (seat.gunner && v.model.turretYaw) { piv.set(v.spec.turret[0], v.spec.turret[1], v.spec.turret[2]); v.model.root.localToWorld(piv); piv.y += 0.8; }
        else piv.set(v.pos.x, v.pos.y + 2.4, v.pos.z);
        const dist = seat.gunner ? 4.8 : v.def.size[2] * 1.3 + 3.2;
        pos.copy(piv).addScaledVector(f, -dist).y += 0.6;
        this.avoid(piv, pos);
      }
      targetFov = P.aiming ? 52 : 68;
      this.focus.copy(v.pos);
    } else {
      const head = Battle._v7.set(s.pos.x, s.pos.y + (s.crouch ? 1.15 : 1.62), s.pos.z);
      const off = P.aiming ? [0.55, 0.12, -1.3] : [0.6, 0.25, -2.6];
      const third = Battle._c1.copy(head).addScaledVector(r, off[0]).addScaledVector(u, off[1]).addScaledVector(f, off[2]);
      this.avoid(head, third);
      const first = Battle._h3.copy(head).addScaledVector(f, 0.12).addScaledVector(u, 0.05);
      pos.copy(third).lerp(first, b);
      s.setBodyVisible(b < 0.6);
      targetFov = P.aiming ? lerp(52, 42, b) : 68;
      if (P.sprinting) targetFov += 6;
      this.focus.copy(s.pos);
    }
    this.fov = lerp(this.fov, targetFov, 1 - Math.exp(-10 * dt));
    if (Math.abs(cam.fov - this.fov) > 0.01) { cam.fov = this.fov; cam.updateProjectionMatrix(); }
    cam.position.copy(pos);
    if (Fx.shake > 0) cam.position.add(Battle._c3.set(RND.range(-1, 1), RND.range(-1, 1), RND.range(-1, 1)).multiplyScalar(Fx.shake * 0.12));
    cam.lookAt(Battle._c2.copy(cam.position).add(fwdOf(P.yaw, P.pitch, Battle._c4)));
    this.yaw = P.yaw;
  },
  spectate(dt) {
    const cam = Battle.camera;
    if (!this.specTarget || !this.specTarget.alive) {
      this.specTarget = Battle.soldiers.find(s => s.team === 0 && s.alive) || Battle.soldiers.find(s => s.alive) || null;
      if (this.specTarget) this.specYaw = this.specTarget.yaw;
    }
    const free = UI.modalOpen();
    let md = Input.locked && !free ? Input.mouseDeltaRaw() : { x: 0, y: 0 };
    if (Game.isTouch() && !free) { const t = Input.touchLook(); md = { x: t.x * 2.2, y: t.y * 2.2 }; }
    this.specYaw -= md.x * 0.004;
    if (!md.x) this.specYaw += dt * 0.14;
    this.specPitch = clamp(this.specPitch + md.y * 0.004, 0.08, 1.2);
    if (!free && Input.mousePressed(0) && Battle.spectating) {
      const allies = Battle.soldiers.filter(s => s.team === 0 && s.alive);
      if (allies.length) this.specTarget = allies[(allies.indexOf(this.specTarget) + 1) % allies.length];
    }
    const t = this.specTarget;
    const focus = t ? t.center(Battle._c1) : Battle._c1.set(0, 2, 0);
    const dir = Battle._c2.set(Math.sin(this.specYaw) * Math.cos(this.specPitch), -Math.sin(this.specPitch), Math.cos(this.specYaw) * Math.cos(this.specPitch));
    const want = Battle._c3.copy(focus).addScaledVector(dir, -9);
    want.y = Math.max(want.y, Battle.field.ground(want.x, want.z) + 0.8);
    cam.position.lerp(want, 1 - Math.exp(-6 * dt));
    cam.lookAt(focus);
    this.focus.copy(focus);
    this.yaw = this.specYaw;
    if (Math.abs(cam.fov - 68) > 0.1) { cam.fov = lerp(cam.fov, 68, 0.1); cam.updateProjectionMatrix(); }
  },
  /** Zielpunkt unter dem Fadenkreuz (Bildmitte) bzw. dem Mauszeiger (ohne Mausfang). */
  aimPoint(out, ignoreS, ignoreV) {
    const cam = Battle.camera, ray = Battle.ray;
    const centre = Input.locked || Game.isTouch();
    const nx = centre ? 0 : clamp(Input.mx / window.innerWidth * 2 - 1, -1, 1), ny = centre ? 0 : clamp(-(Input.my / window.innerHeight * 2 - 1), -1, 1);
    ray.setFromCamera({ x: nx, y: ny }, cam);
    const o = ray.ray.origin, d = ray.ray.direction;
    let skip = 0;
    if (ignoreS && !ignoreV) skip = Math.max(0, Battle._c1.copy(ignoreS.pos).sub(o).dot(d)) * 0.9;
    if (ignoreV) skip = Math.max(0, Battle._c1.copy(ignoreV.pos).sub(o).dot(d)) * 0.5;
    const so = Battle._c2.copy(o).addScaledVector(d, skip);
    const hit = Battle.trace(so, d, 1200, ignoreS, ignoreV);
    return hit ? out.copy(hit.point) : out.copy(so).addScaledVector(d, 600);
  },
};

// ===== battle_ui.js =====
// ===================================================================================
//  battle_ui.js – Gefechts-HUD (Port von BattleUI.cs): Lagezähler, Kompass, Radar,
//  Abschussmeldungen, Gesundheit, Waffe/Munition, Befehle, Fadenkreuz mit
//  Treffermarkern, Gefechtsübersicht (Tab), Pause, Ausfall, Ergebnis.
// ===================================================================================
'use strict';

const BattleUI = {
  el: null, feedLines: [], hit: 0, hitKill: false, hitHead: false, hurtV: 0, introT: 0, radarT: 0, last: {},

  build() {
    const root = UI.el.bhud;
    root.innerHTML = `
      <div class="b-top"><span class="own" data-b="own"></span><span class="res" data-b="res"></span><span class="enemy" data-b="enemy"></span><div class="ratio"><i data-b="ratio"></i></div></div>
      <div class="b-compass"><canvas width="760" height="44" data-b="compass"></canvas></div>
      <div class="b-feed" data-b="feed"></div>
      <div class="b-radar"><canvas width="300" height="300" data-b="radar"></canvas></div>
      <div class="b-status"><div class="k">GESUNDHEIT</div><div class="hbar"><i data-b="hpbar"></i><span data-b="hp"></span></div>
        <div class="line" data-b="stance"></div><div class="line" data-b="order"></div></div>
      <div class="b-weapon"><div class="name"><span data-b="wname"></span><small data-b="wmode"></small></div>
        <div class="ammo" data-b="ammo"></div><div class="reload"><i data-b="reload"></i></div><div class="slots" data-b="slots"></div><div class="tap">antippen: Waffe wechseln</div></div>
      <div class="b-orders ui" data-b="orders"><div class="lbl">Befehl an die Truppe</div>
        ${['FollowMe', 'HoldPosition', 'Attack', 'Mount'].map((o, i) => `<button type="button" data-o="${o}">${['Mir folgen', 'Halten', 'Angriff', 'Aufsitzen'][i]}<small>F${i + 1}</small></button>`).join('')}</div>
      <div class="b-prompt" data-b="prompt"></div>
      <div class="b-warn" data-b="warn"></div>
      <div id="cross"><canvas width="200" height="200" data-b="cross"></canvas></div>
      <div id="vignette" data-b="vig"></div>
      <div class="b-intro" data-b="intro"><div class="t" data-b="introT"></div><div class="s" data-b="introS"></div></div>
      <div class="b-hint" data-b="hint"></div>
      <div class="b-over" data-b="over" hidden><canvas width="900" height="900" data-b="overc"></canvas><div class="cap">Gefechtsübersicht · Tab loslassen zum Schließen</div></div>`;
    const el = this.el = {};
    root.querySelectorAll('[data-b]').forEach(e => { el[e.dataset.b] = e; });
    el.orders.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { Audio2.click(); Battle.issueOrder(b.dataset.o); b.blur(); } });
    const wp = el.wname.closest('.b-weapon'), rd = el.radar.parentElement;
    const tapW = e => { if (!Game.isTouch()) return; e.preventDefault(); const p = Battle.player; if (p && p.alive && !p.vehicle) { Input.accWheel += 100; Audio2.click(); } };
    const tapR = e => { if (!Game.isTouch()) return; e.preventDefault(); Touch.overToggle = !Touch.overToggle; Audio2.click(); };
    wp.addEventListener('touchstart', tapW, { passive: false }); wp.addEventListener('mousedown', tapW);
    rd.addEventListener('touchstart', tapR, { passive: false }); rd.addEventListener('mousedown', tapR);
    this.feedLines = []; this.hit = 0; this.hurtV = 0; this.last = {}; this.radarT = 0;
    this.overBase = null;
    this.applyControls();
  },
  /** Touch-Knöpfe ein- oder ausblenden (auch beim Umschalten mitten im Gefecht). */
  applyControls() {
    if (!this.el) return;
    if (Game.isTouch()) { Touch.build(UI.el.bhud); Input.exitLock(); }
    else Touch.clear();
  },
  clear() { Touch.clear(); if (UI.el.bhud) UI.el.bhud.innerHTML = ''; this.el = null; },
  set(key, html) { if (this.last[key] !== html) { this.last[key] = html; this.el[key].innerHTML = html; } },
  intro(t, s) { this.el.introT.textContent = t; this.el.introS.textContent = s; this.el.intro.style.opacity = '1'; this.introT = 5; },
  addFeed(text, cls) {
    if (!this.el) return;
    this.feedLines.push({ text, cls, t: Battle.time });
    while (this.feedLines.length > 7) this.feedLines.shift();
    this.renderFeed();
  },
  renderFeed() {
    const col = { bad: 'var(--danger)', good: 'var(--good)', accent: 'var(--brass)' };
    this.el.feed.innerHTML = this.feedLines.map(l => `<div style="opacity:${clamp01(1.3 - (Battle.time - l.t) / 8).toFixed(2)};${col[l.cls] ? 'color:' + col[l.cls] : ''}">${esc(l.text)}</div>`).join('');
  },
  hitMarker(kill, head) { this.hit = 0.28; this.hitKill = this.hitKill && this.hit > 0 ? this.hitKill || kill : kill; this.hitHead = head; },
  hurt(dmg) { this.hurtV = Math.min(1, this.hurtV + dmg / 45); },

  update(dt) {
    const el = this.el, B = Battle;
    if (!el) return;
    const p = B.player, alive = p && p.alive;
    // Lage
    const own = B.countAlive(0), en = B.countAlive(1), r0 = B.reserves[0].length, r1 = B.reserves[1].length;
    this.set('own', `EIGENE ${own}`);
    this.set('res', `Reserve ${r0} : ${r1}`);
    this.set('enemy', `FEIND ${en}`);
    const tot = own + r0 + en + r1;
    el.ratio.style.width = (tot ? (own + r0) / tot * 100 : 50).toFixed(1) + '%';
    // Gesundheit / Haltung
    if (p) {
      const f = clamp01(p.hp / p.maxHp);
      el.hpbar.style.width = (f * 100).toFixed(1) + '%';
      el.hpbar.style.background = f > 0.6 ? 'var(--good)' : f > 0.3 ? 'var(--warn)' : 'var(--danger)';
      this.set('hp', `${Math.ceil(p.hp)} / ${p.maxHp}`);
      const stance = !alive ? 'Kampfunfähig' : p.vehicle ? `${p.vehicle.def.displayName} · ${p.vehicle.seats[p.seat].name} · ${Math.round(Math.abs(p.vehicle.speed) * 3.6)} km/h · Struktur ${Math.ceil(p.vehicle.hp)}`
        : `${Player.sprinting ? 'Sprinten' : p.crouch ? 'Geduckt' : 'Stehend'}${Player.aiming ? ' · Zielen' : ''} · ${Player.fp ? 'Ego' : 'Schulter'}${Input.locked || Game.isTouch() ? '' : ' · Mauszeiger-Zielen'}`;
      this.set('stance', esc(stance));
      this.set('order', `Befehl: <b style="color:var(--brass)">${ORDER_TEXT[B.order]}</b> · Abschüsse ${p.kills}`);
    }
    // Waffe
    let w = null;
    if (alive) w = p.vehicle ? (p.vehicle.gunner === p ? p.vehicle.weapon : null) : p.weapon;
    if (w) {
      this.set('wname', esc(w.def.displayName));
      this.set('wmode', FIREMODE_LABEL[w.def.fireMode].toUpperCase());
      this.set('ammo', `${w.ammo} <small>/ ${w.reserve}</small>`);
      el.reload.style.width = (w.reloading ? w.reloadProgress * 100 : 0).toFixed(0) + '%';
      el.ammo.style.color = w.ammo === 0 ? 'var(--danger)' : w.ammo <= w.def.magazineSize * 0.25 ? 'var(--warn)' : '';
    } else { this.set('wname', alive && p.vehicle ? esc(p.vehicle.def.displayName) : '–'); this.set('wmode', ''); this.set('ammo', alive && p.vehicle ? '<small>keine Waffe</small>' : ''); el.reload.style.width = '0%'; }
    const tapEl = el.wname.closest('.b-weapon').querySelector('.tap');
    if (tapEl) tapEl.style.visibility = p && p.alive && !p.vehicle ? '' : 'hidden';
    if (p && !p.vehicle) this.set('slots', p.weapons.map((x, i) => `<div class="${i === p.slot ? 'on' : ''}">${i + 1} ${x ? esc(x.def.displayName.split(' ')[0]) : '–'}</div>`).join(''));
    else this.set('slots', '');
    // Befehlsknöpfe
    if (this.last.orderOn !== B.order) { this.last.orderOn = B.order; el.orders.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.o === B.order)); }
    // Hinweise
    this.set('prompt', alive ? esc(Player.prompt || '') : '');
    let warn = '';
    if (alive && w && w.ammo === 0 && w.reserve === 0) warn = 'Keine Munition – Waffe wechseln (1–3)';
    else if (alive && w && w.reloading) warn = '';
    else if (B.spectating && !alive) warn = Game.isTouch() ? 'Zuschauen · Tippen: nächster Kamerad' : 'Zuschauen · Klick: nächster Kamerad';
    this.set('warn', warn);
    this.set('hint', UI.modalOpen() || this.introT > 0 || Input.locked ? '' : Input.lockFailed ? 'Mausfang hier nicht verfügbar · Zielen mit dem Mauszeiger, der Bildrand dreht die Sicht' : 'Klick ins Bild fängt die Maus · ohne Mausfang zielt der Zeiger, der Bildrand dreht die Sicht');
    el.hint.style.display = this.last.hint ? '' : 'none';
    // Intro
    if (this.introT > 0) { this.introT -= dt; el.intro.style.opacity = clamp01(this.introT / 1.2).toFixed(2); if (this.introT <= 0) el.intro.style.display = 'none'; }
    // Treffer-Vignette
    this.hurtV = Math.max(0, this.hurtV - dt * 0.8);
    el.vig.style.boxShadow = this.hurtV > 0.01 ? `inset 0 0 ${80 + this.hurtV * 120}px ${this.hurtV * 60}px rgba(170,0,0,${(this.hurtV * 0.7).toFixed(2)})` : 'none';
    this.drawCross(dt, w);
    this.radarT -= dt;
    if (this.radarT <= 0) { this.radarT = 0.066; this.drawRadar(); this.drawCompass(); this.renderFeed(); }
    if (Game.isTouch()) Touch.update();
    const showOver = (Input.down('Tab') || (Game.isTouch() && Touch.overToggle)) && !UI.modalOpen();
    if (showOver !== !el.over.hidden) el.over.hidden = !showOver;
    if (showOver) this.drawOverview();
  },

  drawCross(dt, w) {
    const el = this.el, c = el.cross, ctx = c.getContext('2d'), p = Battle.player;
    this.hit = Math.max(0, this.hit - dt);
    const box = c.parentElement;
    if (Input.locked || Game.isTouch()) { box.style.left = '50%'; box.style.top = '50%'; }
    else { box.style.left = Input.mx + 'px'; box.style.top = Input.my + 'px'; }
    ctx.clearRect(0, 0, 200, 200);
    if (!p || !p.alive || UI.modalOpen() || Input.down('Tab') || (Game.isTouch() && Touch.overToggle)) return;
    const cx = 100, cy = 100, cam = Battle.camera;
    const focal = 100 / Math.tan(cam.fov * DEG / 2) * (window.innerHeight / 200) / (window.innerHeight / 200);
    const px = window.innerHeight / 2 / Math.tan(cam.fov * DEG / 2);
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 3;
    if (p.vehicle && p.vehicle.gunner === p) {
      ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx - 24, cy); ctx.lineTo(cx - 8, cy); ctx.moveTo(cx + 8, cy); ctx.lineTo(cx + 24, cy); ctx.moveTo(cx, cy + 8); ctx.lineTo(cx, cy + 22); ctx.stroke();
    } else if (!p.vehicle && w) {
      const gap = clamp(Math.tan(w.spread * DEG) * px, 3, 60) + 3;
      ctx.beginPath();
      ctx.moveTo(cx - gap - 9, cy); ctx.lineTo(cx - gap, cy); ctx.moveTo(cx + gap, cy); ctx.lineTo(cx + gap + 9, cy);
      ctx.moveTo(cx, cy - gap - 9); ctx.lineTo(cx, cy - gap); ctx.moveTo(cx, cy + gap); ctx.lineTo(cx, cy + gap + 9);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fillRect(cx - 1, cy - 1, 2, 2);
      void focal;
    }
    if (this.hit > 0) {
      const a = clamp01(this.hit / 0.28), k = this.hitKill;
      ctx.strokeStyle = k ? `rgba(255,70,50,${a})` : this.hitHead ? `rgba(255,210,80,${a})` : `rgba(255,255,255,${a})`;
      ctx.lineWidth = k ? 3 : 2;
      ctx.beginPath();
      for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) { ctx.moveTo(cx + sx * 7, cy + sy * 7); ctx.lineTo(cx + sx * 15, cy + sy * 15); }
      ctx.stroke();
    } else this.hitKill = false;
  },

  drawRadar() {
    const c = this.el.radar, ctx = c.getContext('2d'), B = Battle, W = c.width, R = W / 2, range = 70;
    const focus = BCam.focus, yaw = BCam.yaw;
    ctx.clearRect(0, 0, W, W);
    ctx.strokeStyle = 'rgba(120,150,110,0.35)'; ctx.lineWidth = 2;
    for (const k of [0.33, 0.66, 1]) { ctx.beginPath(); ctx.arc(R, R, R * k - 1, 0, Math.PI * 2); ctx.stroke(); }
    // Weltpunkt -> Radar (oben = Blickrichtung)
    const toR = (x, z) => {
      const dx = x - focus.x, dz = z - focus.z;
      const fwd = dx * Math.sin(yaw) + dz * Math.cos(yaw), right = -dx * Math.cos(yaw) + dz * Math.sin(yaw);
      return [R + right / range * R, R - fwd / range * R, Math.hypot(dx, dz) < range];
    };
    if (B.field.compound) {
      const cc = B.field.compound, corners = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([a, b]) => toR(cc.x + a * cc.w / 2, cc.z + b * cc.d / 2));
      ctx.strokeStyle = 'rgba(220,200,150,0.5)'; ctx.beginPath(); corners.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); ctx.closePath(); ctx.stroke();
    }
    for (const v of B.vehicles) {
      const [x, y, inR] = toR(v.pos.x, v.pos.z);
      if (!inR || v.destroyed) continue;
      ctx.fillStyle = v.team === 0 ? '#7bc66b' : '#e4553f';
      ctx.fillRect(x - 6, y - 6, 12, 12);
    }
    for (const s of B.soldiers) {
      if (!s.alive || s.isPlayer || s.vehicle) continue;
      if (s.team === 1 && B.time - s.revealed > 3) continue;
      const [x, y, inR] = toR(s.pos.x, s.pos.z);
      if (!inR) continue;
      ctx.fillStyle = s.team === 0 ? '#7bc66b' : '#ff4a3a';
      ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#f0b648';
    ctx.beginPath(); ctx.moveTo(R, R - 10); ctx.lineTo(R + 7, R + 8); ctx.lineTo(R - 7, R + 8); ctx.closePath(); ctx.fill();
  },
  drawCompass() {
    const c = this.el.compass, ctx = c.getContext('2d'), W = c.width, H = c.height;
    ctx.clearRect(0, 0, W, H);
    const heading = ((-BCam.yaw / DEG) % 360 + 360) % 360, span = 120, pxPerDeg = W / span;
    ctx.fillStyle = '#ece6d2'; ctx.strokeStyle = 'rgba(236,230,210,0.7)'; ctx.lineWidth = 2;
    ctx.font = '600 22px "Barlow Semi Condensed", Arial, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const names = { 0: 'N', 45: 'NO', 90: 'O', 135: 'SO', 180: 'S', 225: 'SW', 270: 'W', 315: 'NW' };
    for (let d = Math.floor((heading - span / 2) / 15) * 15; d <= heading + span / 2; d += 15) {
      const x = W / 2 + (d - heading) * pxPerDeg, dd = ((d % 360) + 360) % 360;
      if (names[dd] !== undefined) { ctx.fillStyle = dd === 0 ? '#f0b648' : '#ece6d2'; ctx.fillText(names[dd], x, H / 2 + 1); }
      else { ctx.beginPath(); ctx.moveTo(x, H * 0.3); ctx.lineTo(x, H * 0.7); ctx.stroke(); }
    }
    // Richtung zum Feind
    const ec = Battle.teamCenter(1), f = BCam.focus;
    const ang = ((-Math.atan2(ec.x - f.x, ec.z - f.z) / DEG) % 360 + 360) % 360;
    let rel = ang - heading; rel = ((rel + 540) % 360) - 180;
    if (Math.abs(rel) < span / 2) { ctx.fillStyle = '#e4553f'; const x = W / 2 + rel * pxPerDeg; ctx.beginPath(); ctx.moveTo(x, H - 2); ctx.lineTo(x - 7, H - 12); ctx.lineTo(x + 7, H - 12); ctx.closePath(); ctx.fill(); }
    ctx.fillStyle = '#f0b648'; ctx.fillRect(W / 2 - 1.5, 0, 3, 9);
  },
  drawOverview() {
    const B = Battle, F = B.field, c = this.el.overc, ctx = c.getContext('2d'), W = c.width, h = F.half;
    if (!this.overBase) {
      const base = document.createElement('canvas'); base.width = base.height = W;
      const b = base.getContext('2d'), mc = F.mapCanvas, frac = h / F.E, off = (1 - frac) / 2 * mc.width;
      // Blick nach +z = Norden oben; rechts liegt -x (rechtshändiges System) -> waagerecht spiegeln
      b.save(); b.translate(W, 0); b.scale(-1, 1);
      b.drawImage(mc, off, off, mc.width * frac, mc.width * frac, 0, 0, W, W);
      b.restore();
      b.fillStyle = 'rgba(0,0,0,0.15)'; b.fillRect(0, 0, W, W);
      b.fillStyle = 'rgba(30,26,20,0.8)';
      const k = W / (2 * h);
      for (const o of F.obstacles) {
        const x = (h - o.x) * k, y = (h - o.z) * k;
        if (o.k === 1) { if (o.r < 0.6) continue; b.beginPath(); b.arc(x, y, Math.max(1.5, o.r * k), 0, Math.PI * 2); b.fill(); }
        else { b.save(); b.translate(x, y); b.transform(-o.c, o.s, -o.s, -o.c, 0, 0); b.fillRect(-o.hx * k, -o.hz * k, o.hx * 2 * k, o.hz * 2 * k); b.restore(); }
      }
      if (F.compound) { const c = F.compound; b.strokeStyle = 'rgba(240,182,72,0.6)'; b.lineWidth = 2; b.strokeRect((h - c.x - c.w / 2) * k, (h - c.z - c.d / 2) * k, c.w * k, c.d * k); }
      this.overBase = base;
    }
    ctx.drawImage(this.overBase, 0, 0);
    const P = (x, z) => [(h - x) / (2 * h) * W, (h - z) / (2 * h) * W];
    for (const v of B.vehicles) { const [x, y] = P(v.pos.x, v.pos.z); ctx.fillStyle = v.destroyed ? '#333' : v.team === 0 ? '#7bc66b' : '#e4553f'; ctx.fillRect(x - 7, y - 7, 14, 14); }
    for (const s of B.soldiers) {
      if (!s.alive || s.vehicle) continue;
      if (s.team === 1 && B.time - s.revealed > 4) continue;
      const [x, y] = P(s.pos.x, s.pos.z);
      ctx.fillStyle = s.isPlayer ? '#f0b648' : s.team === 0 ? '#7bc66b' : '#ff4a3a';
      ctx.beginPath(); ctx.arc(x, y, s.isPlayer ? 8 : 5, 0, Math.PI * 2); ctx.fill();
      if (s.isPlayer) { ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke(); }
    }
    const [hx, hy] = P(B.holdPoint.x, B.holdPoint.z);
    if (B.order === 'HoldPosition') { ctx.strokeStyle = '#f0b648'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(hx, hy, 14, 0, Math.PI * 2); ctx.stroke(); }
  },
};
